<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Lisieux</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#f4f6f9; --surface:#fff; --surface-2:#f7f9fc; --text:#161a22; --muted:#626b7a; --faint:#8a93a2;
    --border:#dbe1ea; --grid:#e6eaf0; --accent:#2f5fd6; --accent-soft:#e3ebfd;
    --good:#1f8a55; --good-soft:#e1f3ea; --warn:#b7791f; --warn-soft:#fbf1dc; --bad:#c1443a; --bad-soft:#fbe7e5;
    --off:#9aa3b2; --off-soft:#eef1f5;
    --a-familia:#2f5fd6; --a-fe:#a8771c; --a-esporte:#1f8a55; --a-blogs:#7a4bc4; --a-negocios:#c1443a; --a-confirmar:#6b7280; --a-offline:#8a5a3b;
    --serif:"Fraunces", Georgia, serif; --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0f14; --surface:#12161d; --surface-2:#161b23; --text:#e8ebf0; --muted:#8a94a3; --faint:#6b7483;
      --border:#232a35; --grid:#1f2630; --accent:#4d8dff; --accent-soft:#17233d;
      --good:#34b37a; --good-soft:#103524; --warn:#e0a33a; --warn-soft:#33270f; --bad:#e2645a; --bad-soft:#3a1714;
      --off:#5b6474; --off-soft:#1b212a;
      --a-familia:#5b8dff; --a-fe:#d9a441; --a-esporte:#34b37a; --a-blogs:#a07ae6; --a-negocios:#e2645a; --a-confirmar:#8a94a3; --a-offline:#c08a64;
      color-scheme:dark;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--text); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; color:inherit; }
  .wrap{ max-width:1240px; margin:0 auto; padding:20px 24px 64px; }

  /* topo */
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ font:600 26px/1.1 var(--serif); letter-spacing:-.01em; }
  .brand b{ color:var(--accent); font-weight:700; }
  .brand small{ font:400 14px var(--mono); color:var(--muted); letter-spacing:.02em; }
  .draft{ display:inline-flex; align-items:center; gap:8px; font:500 12px var(--mono); letter-spacing:.06em; text-transform:uppercase;
          color:var(--warn); background:var(--warn-soft); border:1px dashed var(--warn); border-radius:999px; padding:6px 12px; }
  .nav{ display:flex; gap:6px; margin:18px 0 6px; flex-wrap:wrap; }
  .nav a{ font:500 13px var(--sans); padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--muted); }
  .nav a.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .crumb{ font:12px var(--mono); color:var(--muted); margin:14px 0 4px; letter-spacing:.02em; }
  .crumb a{ color:var(--accent); }
  .crumb span{ margin:0 6px; color:var(--faint); }

  h1{ font:600 32px/1.15 var(--serif); margin:6px 0 4px; letter-spacing:-.01em; }
  h2{ font:600 20px/1.2 var(--serif); margin:30px 0 4px; }
  .sub{ color:var(--muted); margin:0 0 12px; max-width:760px; }
  .lbl{ font:500 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .note{ font-size:13px; color:var(--muted); }

  /* números */
  .kpis{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; margin:16px 0 4px; }
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; min-width:0; }
  .kpi .v{ font:600 28px/1.1 var(--sans); margin:6px 0 2px; letter-spacing:-.01em; }
  .kpi .h{ font-size:12px; color:var(--muted); }

  /* árvore do grupo */
  .tree{ margin:22px 0 4px; }
  .root{ display:flex; justify-content:center; }
  .root .node{ background:var(--text); color:var(--bg); border-radius:14px; padding:12px 22px; text-align:center; }
  .root .node b{ font:600 20px var(--serif); display:block; }
  .root .node span{ font:12px var(--mono); opacity:.75; }
  .stem{ width:2px; height:18px; background:var(--border); margin:0 auto; }
  .branches{ display:grid; grid-template-columns: 1.35fr 1fr; gap:14px; padding-top:22px; position:relative; }
  .branches:before{ content:""; position:absolute; top:0; left:28.5%; right:21%; height:16px; border:2px solid var(--border); border-bottom:none; border-radius:12px 12px 0 0; }
  .col-h{ display:flex; align-items:center; gap:8px; margin:0 0 10px; }
  .tag{ display:inline-flex; align-items:center; gap:6px; font:500 11px var(--mono); letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px;
        border:1px solid currentColor; }
  .tag.online{ color:var(--accent); } .tag.offline{ color:var(--a-offline); } .tag.new{ color:var(--good); } .tag.found{ color:var(--warn); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px 18px; display:block; position:relative; min-width:0; }
  a.card:hover{ border-color:var(--accent); box-shadow:0 2px 10px rgba(30,60,140,.08); }
  .num{ display:inline-block; font:500 12px var(--mono); color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 7px; }
  .card h3{ font:600 21px/1.2 var(--serif); margin:8px 0 2px; }
  .card .cat{ position:absolute; top:16px; right:18px; font:500 11px var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .lirio-big{ border:1.5px solid var(--accent); background:linear-gradient(180deg, var(--accent-soft), var(--surface) 55%); }
  .lirio-stats{ display:flex; gap:22px; margin:10px 0 12px; flex-wrap:wrap; }
  .lirio-stats div b{ font:600 22px var(--sans); display:block; }
  .lirio-stats div span{ font-size:12px; color:var(--muted); }
  .areas-mini{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; }
  .am{ border-radius:10px; padding:8px 10px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c); min-width:0; }
  .am b{ display:block; font:600 13px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .am span{ font:12px var(--mono); color:var(--muted); }
  .off-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .off-card h3{ font-size:18px; }
  .off-card .line{ font-size:12px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--off); display:inline-block; flex:none; }
  .dot.on{ background:var(--good); } .dot.late{ background:var(--warn); } .dot.off{ background:var(--bad); } .dot.plan{ background:transparent; border:1.5px solid var(--off); }

  /* gráficos simples */
  .two{ display:grid; grid-template-columns:1.25fr 1fr; gap:14px; }
  .bars{ display:flex; flex-direction:column; gap:9px; margin-top:10px; }
  .bar{ display:grid; grid-template-columns: 170px 1fr auto; align-items:center; gap:10px; font-size:13px; }
  .bar .n{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .t{ height:12px; background:var(--grid); border-radius:6px; overflow:hidden; }
  .bar .t i{ display:block; height:100%; border-radius:6px; background:var(--c, var(--accent)); min-width:2px; }
  .bar .v{ font:500 13px var(--mono); text-align:right; }
  .stack{ display:flex; height:16px; border-radius:8px; overflow:hidden; margin:12px 0 8px; background:var(--grid); }
  .stack i{ display:block; height:100%; }
  .legend{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .legend div{ display:flex; align-items:center; gap:8px; }
  .legend .sw{ width:10px; height:10px; border-radius:3px; flex:none; }
  .legend .v{ margin-left:auto; font:500 13px var(--mono); }

  .needs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .need{ display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px; }
  .need b{ display:block; font-weight:600; }

  /* agência */
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px; }
  .chip{ font:500 13px var(--sans); border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:6px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .chip .sw{ width:9px; height:9px; border-radius:50%; background:var(--c); }
  .chip.on{ border-color:var(--text); background:var(--text); color:var(--bg); }
  .area-h{ display:flex; align-items:baseline; gap:10px; margin:26px 0 10px; }
  .area-h h2{ margin:0; }
  .area-h .bar-c{ width:12px; height:12px; border-radius:4px; background:var(--c); align-self:center; }
  .proj-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .proj{ border-top:4px solid var(--c); padding-top:14px; }
  .proj h3{ font-size:19px; margin:2px 0 4px; padding-right:72px; }
  .st{ position:absolute; top:14px; right:14px; font:500 11px var(--mono); letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:999px; }
  .st.ativo{ color:var(--good); background:var(--good-soft); } .st.andamento{ color:var(--accent); background:var(--accent-soft); } .st.ideia{ color:var(--muted); background:var(--off-soft); }
  .big{ font:600 24px var(--sans); margin:8px 0 0; letter-spacing:-.01em; }
  .big small{ font:400 12px var(--sans); color:var(--muted); margin-left:4px; }
  .chans{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .ch{ display:inline-flex; align-items:center; gap:5px; font:12px var(--sans); color:var(--muted); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px 7px; }
  .ch svg{ width:13px; height:13px; }
  .meta{ display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px; border-top:1px dashed var(--border); padding-top:8px; }
  .meta b{ color:var(--text); font-weight:600; }

  /* projeto */
  .proj-head{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:2px; }
  .ch-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:12px; margin-top:12px; }
  .chan h3{ display:flex; align-items:center; gap:8px; font:600 17px var(--sans); margin:0 0 2px; }
  .chan h3 svg{ width:18px; height:18px; }
  .chan .src{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); margin-top:10px; padding-top:8px; border-top:1px dashed var(--border); }
  .mrow{ display:flex; gap:20px; flex-wrap:wrap; margin:8px 0 2px; }
  .mrow div b{ font:600 22px var(--sans); display:block; letter-spacing:-.01em; }
  .mrow div span{ font-size:12px; color:var(--muted); }
  .done{ margin:10px 0 0; padding:0; list-style:none; font-size:13px; }
  .done li{ padding-left:16px; position:relative; margin:4px 0; }
  .done li:before{ content:""; position:absolute; left:2px; top:8px; width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.6; }
  .todo{ margin-top:8px; font-size:12px; color:var(--bad); background:var(--bad-soft); border-radius:8px; padding:6px 9px; }
  .empty{ color:var(--muted); font-size:13px; font-style:italic; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--border); }
  td{ padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:top; }
  .tbl{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-top:10px; }
  .tbl-scroll{ overflow-x:auto; }

  /* offline */
  .split{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .slot{ border:1px dashed var(--border); border-radius:12px; padding:12px; display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-top:8px; background:var(--surface-2); }
  .slot b{ font:600 15px var(--sans); }
  .btn{ display:inline-flex; align-items:center; gap:6px; font:500 13px var(--sans); border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; }
  .btn.solid{ background:var(--accent); color:#fff; }

  .found-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:10px; margin-top:10px; }
  .found{ background:var(--surface); border:1px dashed var(--warn); border-radius:12px; padding:10px 12px; font-size:13px; }
  .found b{ display:block; font-size:14px; }
  .found .q{ margin-top:6px; font:500 12px var(--mono); color:var(--warn); }

  .arrow{ color:var(--faint); padding:0 6px; }
  .toplinks{ display:flex; gap:8px; flex-wrap:wrap; }
  .tl{ font:500 13px var(--sans); padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); }
  .tl:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.off{ opacity:.55; cursor:not-allowed; }
  .dl{ display:inline-flex; align-items:center; gap:3px; font:600 12px var(--mono); white-space:nowrap; vertical-align:middle; margin-left:6px; letter-spacing:0; }
  .dl.up{ color:var(--good); } .dl.down{ color:var(--bad); } .dl.flat{ color:var(--faint); }
  .dl small{ font:400 11px var(--sans); color:var(--faint); margin-left:3px; }
  .kpi .dl{ margin:4px 0 0; display:flex; }
  .spark{ display:block; width:100%; height:34px; margin-top:8px; }
  .charts{ display:grid; grid-template-columns:repeat(auto-fill, minmax(380px,1fr)); gap:12px; margin-top:12px; }
  .chart-card h3{ display:flex; align-items:center; gap:8px; font:600 15px var(--sans); margin:0; }
  .chart-card h3 svg{ width:16px; height:16px; }
  .chart-card .now{ font:600 24px var(--sans); margin:6px 0 0; }
  .chart{ display:block; width:100%; height:auto; margin-top:6px; overflow:visible; }
  .chart text{ font:11px var(--mono); fill:var(--faint); }
  .bar .v{ white-space:nowrap; }
  @media (max-width:560px){ .charts{ grid-template-columns:1fr; } .bar{ grid-template-columns: 104px 1fr auto; } }
  .dots-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:8px 0 0; }
  .dots-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .big.dom{ font:500 13px var(--mono); color:var(--muted); margin-top:10px; }
  .hint{ margin-top:28px; font-size:12px; color:var(--faint); text-align:center; }

  @media (max-width: 980px){
    .kpis{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .kpis .kpi:first-child{ grid-column:1 / -1; }
    .branches{ grid-template-columns:1fr; padding-top:0; }
    .branches:before{ display:none; }
    .two, .split, .needs{ grid-template-columns:1fr; }
    .areas-mini{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 560px){
    .wrap{ padding:16px 16px 48px; }
    h1{ font-size:26px; }
    .off-grid{ grid-template-columns:1fr; }
    .bar{ grid-template-columns: 112px 1fr 52px; }
    .ch-grid{ grid-template-columns:1fr; }
    .card .cat{ position:static; display:block; margin-top:6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">GRUPO <b>LISIEUX</b> <small>— painel do grupo</small></div>
    </div>
    <div class="toplinks"><a class="tl" href="escritorio/">🏢 Escritório</a><a class="tl" href="frentes/">Painel antigo (frentes)</a></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main id="view"></main>
  <p class="hint" id="hint">Carregando os números…</p>
</div>

<script>
(function(){
  "use strict";

  // ---------- ícones (traços simples, sem marcas) ----------
  var ICON = {
    youtube:'<rect x="1.5" y="3.5" width="13" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.6 6v4l3.6-2z" fill="currentColor"/>',
    instagram:'<rect x="2" y="2" width="12" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.6" cy="4.5" r=".9" fill="currentColor"/>',
    facebook:'<rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 14V8.3h1.8l.3-2H9V5.2c0-.6.2-1 1-1h1.1V2.4" fill="none" stroke="currentColor" stroke-width="1.3"/>',
    site:'<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.8 8h12.4M8 1.8c2 2 2 10.4 0 12.4M8 1.8c-2 2-2 10.4 0 12.4" fill="none" stroke="currentColor" stroke-width="1.2"/>',
    threads:'<circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 8v1.2c0 1.3 1.9 1.6 2.4.3.9-2.9-1-6.7-5-6.7a5.2 5.2 0 0 0 0 10.4c1 0 1.9-.2 2.7-.7" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    x:'<path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    substack:'<path d="M3 3h10M3 5.6h10M3 8.2h10v5.3l-5-2.6-5 2.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
    video:'<rect x="1.5" y="3.5" width="9" height="9" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 7l4-2.2v6.4l-4-2.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
    game:'<rect x="1.5" y="4.5" width="13" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 6.6v2.8M3.6 8h2.8" stroke="currentColor" stroke-width="1.3"/><circle cx="10.6" cy="7.2" r=".9" fill="currentColor"/><circle cx="12" cy="8.8" r=".9" fill="currentColor"/>',
    app:'<rect x="4" y="1.5" width="8" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 12.3h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    store:'<path d="M2.5 6h11l-1 7.5h-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 6V4.5a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/>'
  };
  var CH_NAME = { youtube:"YouTube", instagram:"Instagram", facebook:"Facebook", site:"Site", threads:"Threads", x:"X", substack:"Substack", video:"Vídeo", game:"Jogo", app:"App", store:"Loja" };
  var STATE_TXT = { on:"métrica conectada", late:"conectada, leitura atrasada", off:"sem métrica ainda", plan:"canal a criar ou começando" };
  function icon(t){ return '<svg viewBox="0 0 16 16" aria-hidden="true">'+(ICON[t]||ICON.site)+'</svg>'; }

  // ---------- dados (o que existe hoje, reorganizado) ----------
  var AREAS = [
    { id:"familia",  name:"Família",               short:"Família",  c:"var(--a-familia)" },
    { id:"fe",       name:"Fé",                    short:"Fé",       c:"var(--a-fe)" },
    { id:"esporte",  name:"Esporte e motivação",   short:"Esporte",  c:"var(--a-esporte)" },
    { id:"blogs",    name:"Blogs",                 short:"Blogs",    c:"var(--a-blogs)" },
    { id:"negocios", name:"Negócios e finanças",   short:"Negócios", c:"var(--a-negocios)" }
  ];
  var SITE_SRC = "Google Analytics + Search Console + AdSense: falta a credencial do Google";
  var P = [
    // Família
    { id:"vocacaodepai", name:"Vocação de Pai", area:"familia", status:"andamento", was:"Frente 01 · Vocação de Pai",
      blurb:"Paternidade católica: vídeos longos, cortes e textos.",
      parts:[{ name:"Contos de Fence", note:"parceria com o Ciro Forja, sócio do projeto" }],
      ch:[
        { t:"youtube", sr:"1.2", state:"on", m:[{ l:"Inscritos", v:8, d:"28/10" }], src:"YouTube Data API",
          done:["Vídeo “Vocação de Pai” v3 (18 min) e 2 cortes montados no editor de vídeos"] },

      '<h1>O que mudou de lugar</h1><p class="sub">As 9 frentes antigas viraram: Agência Lírio (online, por área e por projeto) e os negócios offline direto no grupo. O painel antigo continua em <a href="frentes/" style="color:var(--accent)">Painel antigo (frentes)</a>.</p>' +
      '<div class="tbl"><div class="tbl-scroll"><table><thead><tr><th>Antes</th><th>Agora</th><th>Obs.</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>' +
      '<h2>O que não muda</h2><ul class="done" style="font-size:14px"><li>Os números e o histórico que o painel já coleta.</li><li>As anotações e edições que você já fez no painel.</li><li>O escritório virtual (em breve vira o andar da Agência Lírio, com uma sala por área).</li></ul>';
  }

  // ---------- navegação ----------
  var TABS = [["#/", "Grupo"], ["#/lirio", "Agência Lírio"], ["#/apis", "Métricas e APIs"], ["#/mapa", "O que mudou"]];
  function route(keepScroll){
    var h0 = location.hash || "";
    var first = h0.replace(/^#\/?/, "").split("/")[0];
    if(h0 && ["", "lirio", "offline", "apis", "mapa"].indexOf(first)<0){ location.replace("frentes/" + h0); return; }   // endereço do painel antigo
    var h = h0 || "#/", parts = h.replace(/^#\/?/, "").split("/"), html;
    if(parts[0]==="lirio" && parts[1]) html = viewProject(parts[1]);
    else if(parts[0]==="lirio") html = viewLirio();
    else if(parts[0]==="offline") html = viewOffline(parts[1]);
    else if(parts[0]==="apis") html = viewApis();
    else if(parts[0]==="mapa") html = viewMap();
    else html = viewGroup();
    document.getElementById("view").innerHTML = html;
    var cur = "#/" + (parts[0]==="offline" ? "" : parts[0]);
    document.getElementById("nav").innerHTML = TABS.map(function(t){ return '<a href="'+t[0]+'" class="'+(t[0]===cur ? "on" : "")+'">'+t[1]+'</a>'; }).join("");
    var ch = document.getElementById("areaChips");
    if(ch) ch.addEventListener("click", function(e){ var c = e.target.closest(".chip"); if(!c) return; areaFilter = c.getAttribute("data-area"); route(); });
    if(keepScroll!==true) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function(){ route(); });
  route();
  fetch("data/metrics.json?t=" + Date.now(), { cache:"no-store" }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(m){
    bind(m); route(true);
    document.getElementById("hint").textContent = "Números do robô do painel" + (GEN ? ", atualizados em " + GEN.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "") + ". As setinhas comparam com 7 dias antes.";
  }).catch(function(){ document.getElementById("hint").textContent = "Não consegui ler os números agora; mostrando os últimos conhecidos."; });
})();
</script>
</body>
</html>
