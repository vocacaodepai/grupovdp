<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel VDP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --text:#161a22;
    --text-muted:#626b7a;
    --border:#dbe1ea;
    --accent:#2f5fd6;
    --accent-soft:#e3ebfd;
    --good:#1f8a55;
    --good-soft:#e1f3ea;
    --bad:#c1443a;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 8px 24px rgba(20,30,50,.08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0f14;
      --surface:#12161d;
      --surface-2:#1a2029;
      --text:#e8ebf0;
      --text-muted:#838d9c;
      --border:#232a35;
      --accent:#4d8dff;
      --accent-soft:#17233d;
      --good:#34b37a;
      --good-soft:#103524;
      --bad:#e2645a;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0f14;
    --surface:#12161d;
    --surface-2:#1a2029;
    --text:#e8ebf0;
    --text-muted:#838d9c;
    --border:#232a35;
    --accent:#4d8dff;
    --accent-soft:#17233d;
    --good:#34b37a;
    --good-soft:#103524;
    --bad:#e2645a;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:clamp(10px,2vh,22px) clamp(12px,2.4vw,28px);
    gap:clamp(6px,1vh,10px);
  }
  @media (max-width:720px){
    body{ height:auto; min-height:100dvh; overflow:auto; }
  }

  .top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:clamp(15px,1.9vw,20px);
    letter-spacing:.02em;
  }
  .wordmark b{ color:var(--accent); font-weight:700; }
  .top-right{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(10px,1.1vw,12px);
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:right;
  }
  .fresh-note{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(9px,1vw,10.5px);
    color:var(--text-muted);
    flex-shrink:0;
  }

  .graph-toggle{
    display:flex; align-items:center; gap:8px;
    border:none; background:none; cursor:pointer; padding:2px 0;
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--text-muted);
    flex-shrink:0;
  }
  .graph-toggle:hover{ color:var(--text); }
  .graph-toggle-track{
    width:34px; height:18px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--border); position:relative; flex-shrink:0; transition:background .15s ease;
  }
  .graph-toggle-thumb{
    position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%;
    background:var(--text-muted); transition:transform .15s ease, background .15s ease;
  }
  .graph-toggle[aria-pressed="true"] .graph-toggle-track{ background:var(--accent-soft); border-color:var(--accent); }
  .graph-toggle[aria-pressed="true"] .graph-toggle-thumb{ background:var(--accent); transform:translateX(16px); }

  .card-items-preview{
    font-size:clamp(9.5px,.9vw,11px); color:var(--text-muted); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    flex:1; min-height:0;
  }
  .card-chip-row{
    display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px;
    flex:1; min-height:0; overflow:hidden;
  }
  .card-chip{
    font-family:"IBM Plex Mono",monospace; font-size:clamp(8.5px,.82vw,10px);
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:3px 8px; cursor:pointer; line-height:1.3; white-space:nowrap;
  }
  .card-chip:hover{ border-color:var(--accent); color:var(--text); }
  .card-chip.has-detail{ border-color:var(--accent); color:var(--accent); }
  .card-chip.more{ cursor:default; opacity:.7; }
  .card-chip.more:hover{ border-color:var(--border); color:var(--text-muted); }
  .card-graph{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; min-height:0; }
  .card-graph svg{ color:var(--accent); width:100%; height:auto; display:block; }
  .card-graph-empty{ font-size:11px; color:var(--text-muted); font-style:italic; }
  .multi-chart{ width:100%; height:auto; display:block; flex:1; min-height:0; }
  .multi-chart .chart-hit{ cursor:default; pointer-events:stroke; }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:5px 10px; }
  .chart-legend-item{
    display:inline-flex; align-items:center; gap:4px;
    font-family:"IBM Plex Mono",monospace; font-size:8.5px; color:var(--text-muted);
  }
  .chart-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:clamp(8px,1.3vw,14px);
  }
  @media (max-width:720px){
    .grid{ grid-template-columns:1fr 1fr; grid-template-rows:none; height:auto; }
    .hub{ grid-column:1 / -1; }
  }
  @media (max-width:460px){
    .grid{ grid-template-columns:1fr; }
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:clamp(10px,1.3vw,16px);
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:0;
    overflow:hidden;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .num{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(10px,1vw,12px);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:1px 6px;
    flex-shrink:0;
  }
  .kicker{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(8.5px,.85vw,10px);
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-muted);
    text-align:right;
  }
  .name{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:clamp(13px,1.5vw,18px);
    line-height:1.15;
    text-wrap:balance;
  }
  .card-bottom{ margin-top:auto; display:flex; flex-direction:column; gap:5px; }
  .stage-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .stage-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .items-count{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .segbar{ display:flex; gap:3px; }
  .seg{ flex:1; height:5px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border); }
  .seg.on{ background:var(--accent); border-color:var(--accent); }
  .seg.on.done{ background:var(--good); border-color:var(--good); }

  .hub{
    background:radial-gradient(circle at 50% 35%, var(--accent-soft), var(--surface) 72%);
    border:1px solid var(--accent);
    align-items:center;
    text-align:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
  }
  .hub .wordmark2{
    font-family:"Fraunces",serif;
    font-weight:700;
    font-size:clamp(20px,3vw,32px);
    letter-spacing:.01em;
  }
  .hub .wordmark2 .vdp{ color:var(--accent); }
  .hub .sub{
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(9px,1vw,11px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .hub .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px;
    font-family:"IBM Plex Mono",monospace;
    font-size:clamp(9px,.85vw,10.5px);
    color:var(--text-muted);
  }
  .legend .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,20,.55);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .panel{
    width:min(560px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:clamp(18px,3vw,28px);
    box-shadow:var(--shadow);
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .panel-title{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel-title .num{ font-size:12px; }
  .panel-name{ font-family:"Fraunces",serif; font-weight:600; font-size:clamp(20px,3vw,26px); text-wrap:balance; }
  .panel-kicker{
    font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:.09em; color:var(--accent); margin-top:2px;
  }
  .close-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .close-btn:hover{ border-color:var(--accent); }

  .section-label{
    font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--text-muted); margin:18px 0 8px;
  }
  .section-label:first-of-type{ margin-top:4px; }

  .stages{ display:flex; gap:6px; }
  .stage-btn{
    flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:8px; padding:8px 4px; cursor:pointer; text-align:center;
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.5;
  }
  .stage-btn b{ display:block; font-family:"Fraunces",serif; font-size:14px; color:var(--text); font-weight:600; }
  .stage-btn.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .stage-btn.active b{ color:var(--accent); }
  .stage-btn:hover{ border-color:var(--accent); }

  .items{ display:flex; flex-direction:column; gap:8px; }
  .item-block{ display:flex; flex-direction:column; gap:2px; }
  .item-row{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--border); border-radius:8px; padding:7px 8px 7px 12px;
    background:var(--surface-2);
  }
  .item-label{ flex:1; font-size:13.5px; }
  .status-pill{
    font-family:"IBM Plex Mono",monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--border); border-radius:999px; padding:4px 10px; cursor:pointer; background:var(--surface);
    color:var(--text-muted); white-space:nowrap;
  }
  .status-pill[data-status="andamento"]{ border-color:var(--accent); color:var(--accent); }
  .status-pill[data-status="ativo"]{ border-color:var(--good); color:var(--good); }
  .item-del{
    border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 4px;
    opacity:.5;
  }
  .item-del:hover{ opacity:1; color:var(--accent); }
  .empty-items{ font-size:12.5px; color:var(--text-muted); font-style:italic; }

  .item-expand{
    border:none; background:none; color:var(--accent); cursor:pointer;
    font-size:14px; padding:2px 4px; opacity:.75; line-height:1;
  }
  .item-expand:hover{ opacity:1; }

  .metrics-block{ display:flex; flex-wrap:wrap; gap:8px; padding:1px 4px 4px 12px; }
  .metric-chip{
    display:flex; align-items:center; gap:6px;
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:3px 9px 3px 11px;
  }
  .metric-value{ color:var(--text); font-weight:600; }
  .metric-delta.up{ color:var(--good); }
  .metric-delta.down{ color:var(--bad); }
  .spark{ color:var(--accent); display:block; flex-shrink:0; }
  .metric-note{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--text-muted);
    font-style:italic; padding:1px 4px 4px 12px;
  }

  .back-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; width:32px; height:32px; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .back-btn:hover{ border-color:var(--accent); }
  .detail-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  .detail-tab{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:6px 12px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; cursor:pointer;
  }
  .detail-tab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .detail-tab:hover{ border-color:var(--accent); }
  .detail-stat{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .detail-stat .big{ font-family:"Fraunces",serif; font-weight:700; font-size:clamp(28px,4vw,38px); }
  .detail-stat .delta{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; }
  .detail-period{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--text-muted); margin-bottom:12px; }
  .chart-wrap{ width:100%; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }

  .add-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .add-row input, .add-row select{
    flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; padding:8px 10px; font-family:"Inter",sans-serif; font-size:13px;
  }
  .add-row input:focus, .add-row select:focus{ outline:none; border-color:var(--accent); }
  .add-row button{
    border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
    border-radius:8px; padding:8px 14px; font-family:"Inter",sans-serif; font-size:13px; font-weight:600; cursor:pointer;
  }
  .add-row button:hover{ filter:brightness(1.05); }
  .fin-add select{ flex:1 1 40%; }
  .fin-add input[type="month"]{ flex:1 1 30%; }
  .fin-add input[type="number"]{ flex:1 1 25%; }

  textarea.notes{
    width:100%; min-height:64px; resize:vertical;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; padding:10px; font-family:"Inter",sans-serif; font-size:13px; line-height:1.5;
  }
  textarea.notes:focus{ outline:none; border-color:var(--accent); }

  .updated{
    margin-top:16px; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--text-muted);
  }

  .overview-table{ display:flex; flex-direction:column; gap:6px; }
  .ov-row{
    display:grid; grid-template-columns:28px 1fr auto auto; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2);
    cursor:pointer;
  }
  .ov-row:hover{ border-color:var(--accent); }
  .ov-num{ font-family:"IBM Plex Mono",monospace; color:var(--accent); font-size:11px; }
  .ov-name{ font-family:"Fraunces",serif; font-weight:600; font-size:14px; }
  .ov-stage{ font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .ov-bar{ display:flex; gap:2px; width:64px; }
  .ov-bar .seg{ height:4px; }

  .fin-chart{ display:flex; align-items:flex-end; gap:10px; height:64px; margin-bottom:10px; padding:0 2px; }
  .fin-bar-col{ display:flex; flex-direction:column-reverse; align-items:center; gap:4px; flex:1; height:100%; }
  .fin-bar{ width:100%; max-width:28px; background:var(--accent); border-radius:4px 4px 0 0; }
  .fin-bar-label{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--text-muted); }
  .fin-list{ display:flex; flex-direction:column; gap:5px; margin-bottom:4px; max-height:130px; overflow-y:auto; }
  .fin-row{
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:8px;
    border:1px solid var(--border); border-radius:8px; padding:6px 8px 6px 12px; background:var(--surface-2);
    font-size:12.5px;
  }
  .fin-row-front{ font-weight:500; }
  .fin-row-month, .fin-row-amount{
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--text-muted);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .fin-row-amount{ color:var(--text); }

  .status-msg{
    display:flex; align-items:center; justify-content:center; height:100%;
    font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--text-muted);
  }

  .goal-line{
    font-family:"IBM Plex Mono",monospace; font-size:clamp(8.5px,.85vw,10px); color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .goal-row input[type="text"]{ flex:2; }
  .goal-row input[type="number"]{ flex:1; }
  .goal-progress{ display:flex; align-items:center; gap:8px; margin:8px 0 4px; }
  .goal-bar{ flex:1; height:6px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; }
  .goal-bar-fill{ height:100%; background:var(--accent); }
  .goal-bar-fill.complete{ background:var(--good); }
  .goal-pct{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--text-muted); white-space:nowrap; }

  .ov-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .ov-tab{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:6px 12px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; cursor:pointer;
  }
  .ov-tab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .ov-tab:hover{ border-color:var(--accent); }

  .evo-list{ display:flex; flex-direction:column; gap:6px; }
  .evo-row{
    display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2);
  }
  .evo-name{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .evo-front{
    font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .evo-item{ font-family:"Fraunces",serif; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evo-value{ font-family:"IBM Plex Mono",monospace; font-size:12px; text-align:right; white-space:nowrap; }
  .evo-spark{ color:var(--accent); }

  .reset-btn{
    margin-top:14px; border:none; background:none; color:var(--text-muted);
    font-family:"IBM Plex Mono",monospace; font-size:10px; text-decoration:underline; cursor:pointer; padding:0;
  }
  .reset-btn:hover{ color:var(--accent); }

  .panel.wide{ width:min(1040px,96vw); max-height:92vh; }
  .detail-grid{ display:flex; flex-direction:column; gap:24px; margin-top:4px; }
  @media (min-width:860px){
    .detail-grid{ display:grid; grid-template-columns:1.5fr 1fr; align-items:start; }
    .detail-grid.single{ display:block; }
  }
  .detail-side{ display:flex; flex-direction:column; gap:22px; }
  .leader-list{ display:flex; flex-direction:column; gap:8px; }
  .leader-row{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:6px; background:var(--surface-2);
    cursor:pointer; text-align:left; width:100%;
  }
  .leader-row:hover{ border-color:var(--accent); }

  .video-head{ display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>

<body>

<div class="top">
  <div class="wordmark">GRUPO <b>V.D.P.</b> <span style="color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:.7em; letter-spacing:.06em;">— painel de frentes</span></div>
  <div style="display:flex; align-items:center; gap:14px;">

<div class="overlay" id="overlay" hidden>

</div>

<script>
(function(){

  var STATUS_ORDER = ["pendente","andamento","ativo"];
  var STATUS_LABEL = {pendente:"Pendente", andamento:"Em andamento", ativo:"Ativo"};
  // Clockwise from top-left, so each card's number (01-08) reads in clock order:
  // 01 top-left, 02 top-center, 03 top-right, 04 right, 05 bottom-right,
  // 06 bottom-center, 07 bottom-left, 08 left, back to 01.
  var LAYOUT = ["f1","f2","f3","f8","hub","f4","f7","f6","f5"];
  var STORAGE_KEY = "vdp-painel-state-v1";

  var SEED_DATA = {
    updatedAt: 1757620000000,
    revenue: { entries: [] },
    fronts: {
      f1: { num:1, name:"Vocação de Pai", category:"Paternidade", stage:0, notes:"", goal:{text:"",target:null}, items:[

        {id:"1.2", label:"YouTube", status:"pendente", source:{provider:"youtube", channelId:"UCeQmuftGyoX8XFFcfsh5yHQ", metrics:[{field:"subscribers",label:"Inscritos YT"}]}},
        {id:"1.3", label:"Threads", status:"pendente"},
        {id:"1.4", label:"X", status:"pendente"},

        {id:"2.1", label:"Escrivá todo dia", status:"pendente", source:{provider:"metricool", metrics:[{field:"IGEV01",label:"Seguidores IG"}]}},
        {id:"2.2", label:"S.J.E. / Opus Dei", status:"pendente", source:{provider:"metricool", metrics:[
          {field:"IGEV01",label:"Seguidores IG"},

      ]},
      f5: { num:5, name:"Ateliê Lisieux", category:"Roupas", stage:0, notes:"", goal:{text:"",target:null}, items:[] },
      f6: { num:6, name:"Pequena Via", category:"Loja de brinquedos", stage:0, notes:"", goal:{text:"",target:null}, items:[] },
      f7: { num:7, name:"Flor de Lisieux", category:"Casa de festas", stage:0, notes:"", goal:{text:"",target:null}, items:[] },
      f8: { num:8, name:"Apostas", category:"Pessoal", stage:0, notes:"", goal:{text:"",target:null}, items:[
        {id:"8.1", label:"Futebol", status:"pendente", source:{provider:"metricool", metrics:[{field:"IGEV01",label:"Seguidores IG"}]}},
        {id:"8.2", label:"Tudo Sobre Vasco da Gama", status:"pendente", source:{provider:"metricool", metrics:[{field:"IGEV01",label:"Seguidores IG"}], detailMetrics:[
          {field:"IGEV01",label:"Seguidores"},
          {field:"IGEV06",label:"Alcance"},
          {field:"IGEV05",label:"Visualizações"},
          {field:"IGEV09",label:"Interações"},
          {field:"IGEV37",label:"Publicações"},
          {field:"IGEV9999",label:"Engajamento", isPercent:true}
        ]}},
        {id:"8.3", label:"Motivação", status:"pendente", source:{provider:"metricool", metrics:[{field:"IGEV01",label:"Seguidores IG"}]}}
      ]}
    }
  };

  // Real snapshots pulled from Metricool on 2026-09-11/12 (last 30 days).
  // Rows: [...values in the item's metrics order, dateYYYYMMDD]. Refreshed on request.
  // All of the below (SNAPSHOT_ROWS, DETAIL_ROWS, EXTRA_INFO, AUDIENCE_INFO,
  // ITEM_VIDEOS, VIDEO_DAILY) is fetched at runtime from data/metrics.json
  // instead of hardcoded here — that file is what the refresh automation
  // (.github/workflows/refresh-youtube.yml, every 5 min — the GitHub Actions
  // schedule floor) overwrites, so real
  // data flows in without ever touching this script.
  var SNAPSHOT_ROWS = {};
  var DETAIL_ROWS = {};
  var EXTRA_INFO = {};
  var AUDIENCE_INFO = {};
  var ITEM_VIDEOS = {};
  var VIDEO_DAILY = {};
  var metricsDataLoaded = false;
  var metricsGeneratedAt = null;

  function loadMetricsData(){
    return fetch("data/metrics.json", {cache:"no-store"}).then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }).then(function(data){
      SNAPSHOT_ROWS = data.snapshotRows || {};
      DETAIL_ROWS = data.detailRows || {};
      EXTRA_INFO = data.extraInfo || {};
      AUDIENCE_INFO = data.audience || {};
      ITEM_VIDEOS = data.itemVideos || {};
      VIDEO_DAILY = data.videoDaily || {};
      metricsGeneratedAt = data.generatedAt || null;
      metricsDataLoaded = true;
    }).catch(function(err){
      console.error("Falha ao carregar data/metrics.json", err);
      metricsDataLoaded = false;
    });
  }

  function topVideosByMetric(itemId, field, n){
    var list = ITEM_VIDEOS[itemId];
    if(!list) return [];
    return list.filter(function(v){ return v[field]!==undefined && v[field]!==null; })
      .slice().sort(function(a,b){ return b[field]-a[field]; })
      .slice(0, n||3);
  }

  var state = null;
  var metricsState = {};
  var GRAPH_MODE_KEY = "vdp-graph-mode-v1";
  var graphMode = false;
  try{ graphMode = localStorage.getItem(GRAPH_MODE_KEY) === "1"; }catch(e){}

  var grid = document.getElementById("grid");
  var overlay = document.getElementById("overlay");
  var panel = document.getElementById("panel");
  var topRight = document.getElementById("topRight");
  var graphToggle = document.getElementById("graphToggle");

  function fmtDate(ts){
    if(!ts) return "—";
    try{
      var d = new Date(ts);
      return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}) + " · " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return "—"; }
  }
  function fmtNumber(v){ return Math.round(v).toLocaleString("pt-BR"); }
  function fmtCurrency(v){ try{ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }catch(e){ return "R$ "+v; } }
  function monthLabel(m){
    try{
      var d = new Date(m+"-01T00:00:00");
      return d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".","");
    }catch(e){ return m; }
  }
  function formatMetricValue(def, v){
    if(v===null || v===undefined) return "—";
    if(def.currency) return fmtCurrency(v);
    if(def.isPercent) return v.toFixed(1).replace(".",",")+"%";
    return fmtNumber(v);
  }
  function fmtDateShort(yyyymmdd){ return yyyymmdd.slice(6,8)+"/"+yyyymmdd.slice(4,6); }

  function primaryMetricFor(f){
    var item = f.items.find(function(it){ return it.source && it.source.metrics && it.source.metrics.length; });
    if(!item) return null;
    var ms = metricsState[item.id];
    if(!ms || !ms.metrics.length) return null;
    return ms.metrics[0];
  }

  function goalProgress(f){
    if(!f.goal || f.goal.target==null || f.goal.target<=0) return null;
    var m = primaryMetricFor(f);
    if(!m || m.value==null) return null;
    var pct = Math.max(0, Math.min(100, Math.round(m.value/f.goal.target*100)));
    return { value:m.value, target:f.goal.target, pct:pct };
  }

  function segBar(stageIdx){
    var html = '<div class="segbar">';
    for(var i=0;i<STAGES.length;i++){
      var cls = "seg";
      if(i<=stageIdx) cls += stageIdx>=STAGES.length-1 ? " on done" : " on";
      html += '<div class="'+cls+'"></div>';
    }
    return html + '</div>';
  }

  function frontsAsArray(){
    var out = [];
    for(var k in (state.fronts||{})){
      var f = state.fronts[k];
      f.key = k;
      out.push(f);
    }
    out.sort(function(a,b){ return a.num-b.num; });
    return out;
  }

  function renderTopStats(){
    var arr = frontsAsArray();
    var counts = [0,0,0,0];
    arr.forEach(function(f){ counts[f.stage]++; });
    var parts = [];
    for(var i=0;i<STAGES.length;i++){ if(counts[i]) parts.push(counts[i]+" "+STAGES[i]); }
    topRight.textContent = parts.join(" · ") || "—";
  }

  function renderGrid(){
    grid.innerHTML = "";
    LAYOUT.forEach(function(key){
      if(key === "hub"){ grid.appendChild(renderHub()); return; }
      var f = state.fronts[key];
      if(!f) return;
      grid.appendChild(renderCard(key, f));
    });
    renderTopStats();
    if(graphToggle) graphToggle.setAttribute("aria-pressed", graphMode ? "true" : "false");
  }

  if(graphToggle){
    graphToggle.addEventListener("click", function(){
      graphMode = !graphMode;
      try{ localStorage.setItem(GRAPH_MODE_KEY, graphMode ? "1" : "0"); }catch(e){}
      renderGrid();
    });
  }

  function renderHub(){
    var el = document.createElement("div");
    el.className = "card hub";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.setAttribute("aria-label","Ver visão geral de todas as frentes");
    var arr = frontsAsArray();
    var counts = [0,0,0,0];
    arr.forEach(function(f){ counts[f.stage]++; });
    var legend = STAGES.map(function(s,i){
      var dotColor = i===0 ? "var(--border)" : (i===3 ? "var(--good)" : "var(--accent)");
      return '<span><span class="dot" style="background:'+dotColor+'"></span>'+counts[i]+' '+s+'</span>';
    }).join("");
    el.innerHTML =
      '<div class="wordmark2">GRUPO <span class="vdp">V.D.P.</span></div>' +
      '<div class="sub">'+arr.length+' frentes ativas no radar</div>' +
      '<div class="legend">'+legend+'</div>';
    el.addEventListener("click", function(){ openOverview(); });
    el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openOverview(); } });
    return el;
  }

  function renderCardBody(f){
    if(graphMode){
      var series = buildFrontSeries(f);
      if(!series.length){
        return '<div class="card-graph"><span class="card-graph-empty">sem dado conectado ainda</span></div>';
      }
      var legend = series.map(function(s){
        return '<span class="chart-legend-item"><span class="chart-dot" style="background:'+s.color+'"></span>'+s.label+'</span>';
      }).join("");
      return '<div class="card-graph">' +
        buildMultiChart(series, 220, 52) +
        '<div class="chart-legend">'+legend+'</div>' +
      '</div>';
    }
    if(f.items.length){
      var chips = f.items.map(function(it){
        var hasDetail = it.source && it.source.detailMetrics;
        return '<button type="button" class="card-chip'+(hasDetail?" has-detail":"")+'" data-item="'+it.id+'">'+it.label+(hasDetail?" 📈":"")+'</button>';
      }).join("");
      return '<div class="card-chip-row">'+chips+'</div>';
    }
    if(f.goal && f.goal.text){
      return '<div class="card-items-preview">🎯 '+f.goal.text+'</div>';
    }
    if(f.notes){
      return '<div class="card-items-preview">'+f.notes+'</div>';
    }
    return '<div class="card-items-preview">Nenhum item definido ainda.</div>';
  }

  function renderCard(key, f){
    var el = document.createElement("div");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.setAttribute("aria-label","Abrir "+f.name);
    var itemsCount = f.items.length;
    var activeCount = f.items.filter(function(it){ return it.status==="ativo"; }).length;
    var gp = goalProgress(f);
    var goalText = f.goal && f.goal.text ? f.goal.text : "";
    var goalLine = "";
    if(!graphMode && (goalText || gp)){
      goalLine = '<div class="goal-line">🎯 '+(goalText||"meta definida")+(gp?' · '+gp.pct+'%':'')+'</div>';
    }
    el.innerHTML =
      '<div class="card-top"><span class="num">'+String(f.num).padStart(2,"0")+'</span><span class="kicker">'+f.category+'</span></div>' +
      '<div class="name">'+f.name+'</div>' +
      renderCardBody(f) +
      '<div class="card-bottom">' +
        '<div class="stage-row"><span class="stage-label">'+STAGES[f.stage]+'</span>' +
        (itemsCount ? '<span class="items-count">'+activeCount+'/'+itemsCount+' ativos</span>' : '<span class="items-count">sem itens</span>') +
        '</div>' +
        segBar(f.stage) +
        goalLine +
      '</div>';
    el.addEventListener("click", function(){ openFront(key); });
    el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openFront(key); } });

    Array.prototype.forEach.call(el.querySelectorAll(".card-chip[data-item]"), function(chip){
      chip.addEventListener("click", function(e){
        e.stopPropagation();
        var itemId = chip.getAttribute("data-item");
        var item = f.items.find(function(it){ return it.id===itemId; });
        if(item && item.source && item.source.detailMetrics){
          openMetricDetail(key, itemId);
        } else {
          openFront(key);
        }
      });
    });

    return el;
  }

  function openModal(html, wide){
    panel.innerHTML = html;
    panel.className = "panel" + (wide ? " wide" : "");
    overlay.hidden = false;
    document.addEventListener("keydown", escClose);
  }
  function escClose(e){ if(e.key==="Escape") closeModal(); }
  function closeModal(){
    overlay.hidden = true;
    document.removeEventListener("keydown", escClose);
  }
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });

  // ---- metrics (static snapshot, refreshed on request) ----

  function parseMetricRows(rows, metricsDef){
    var series = metricsDef.map(function(){ return []; });
    rows.forEach(function(r){
      var dateStr = r[r.length-1];
      for(var i=0;i<metricsDef.length;i++){
        var v = r[i];
        if(v!==null && v!==undefined){
          series[i].push({date:dateStr, value:parseFloat(v)});
        }
      }
    });
    return metricsDef.map(function(def,i){
      var pts = series[i].slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
      var latest = pts.length ? pts[pts.length-1].value : null;
      var first = pts.length ? pts[0].value : null;
      var delta = (latest!==null && first!==null) ? (latest-first) : null;
      return { label:def.label, currency:!!def.currency, isPercent:!!def.isPercent, value:latest, delta:delta, points:pts };
    });
  }

  function sparkline(points, w, h){
    if(!points || points.length<2) return "";
    var vals = points.map(function(p){ return p.value; });
    var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
    var range = (max-min) || 1;
    w = w||72; h = h||20;
    var pad=2;
    var step = (w-2*pad)/(points.length-1);
    var coords = points.map(function(p,i){
      var x = pad+i*step;
      var y = pad+(1-(p.value-min)/range)*(h-2*pad);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'"><polyline points="'+coords+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // One base hue per sub-project (item); when an item plots more than one
  // metric (e.g. a channel's followers AND subscribers), those share the
  // hue as a gradient of lightness — a different item always gets a
  // distinctly different hue.
  var SERIES_HUES = [142, 28, 205, 335, 265, 180, 50, 0];

  function buildFrontSeries(f){
    var series = [];
    var sourceItems = f.items.filter(function(it){ return it.source && it.source.metrics && it.source.metrics.length; });
    sourceItems.forEach(function(it, itemIdx){
      var hue = SERIES_HUES[itemIdx % SERIES_HUES.length];
      var ms = metricsState[it.id];
      if(!ms) return;
      var plottable = it.source.metrics.filter(function(def){ return !def.currency && !def.isPercent; });
      plottable.forEach(function(def, mi){
        var metricIdx = it.source.metrics.indexOf(def);
        var m = ms.metrics[metricIdx];
        if(!m || !m.points || m.points.length<2) return;
        var lightness = [45,63,33][mi%3];
        series.push({
          label: it.label + (plottable.length>1 ? " · "+def.label : ""),
          color: "hsl("+hue+" 62% "+lightness+"%)",
          points: m.points
        });
      });
    });
    return series;
  }

  function escapeXml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function buildMultiChart(seriesList, w, h){
    w = w||220; h = h||52;
    var pad = 3;
    var paths = seriesList.map(function(s){
      var vals = s.points.map(function(p){ return p.value; });
      var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
      var range = (max-min) || 1;
      var step = (w-2*pad)/(s.points.length-1);
      var coords = s.points.map(function(p,i){
        var x = pad+i*step;
        var y = pad+(1-(p.value-min)/range)*(h-2*pad);
        return x.toFixed(1)+","+y.toFixed(1);
      }).join(" ");
      var title = "<title>"+escapeXml(s.label)+"</title>";
      // A wide invisible stroke carries the hover title and makes the thin
      // visible line easy to point at; the thin one underneath is just ink.
      return '<polyline points="'+coords+'" fill="none" stroke="'+s.color+'" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />' +
        '<polyline points="'+coords+'" fill="none" stroke="transparent" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" class="chart-hit">'+title+'</polyline>';
    }).join("");
    return '<svg class="multi-chart" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'+paths+'</svg>';
  }

  function renderMetricsBlock(itemId){
    var ms = metricsState[itemId];
    var inner;
    if(!ms || !ms.metrics.length){
      inner = '<span class="metric-note" style="padding:0;">sem dados no período</span>';
    } else {
      inner = ms.metrics.map(function(m){
        var valStr = m.value===null ? "—" : (m.currency ? fmtCurrency(m.value) : (m.isPercent ? formatMetricValue(m,m.value) : fmtNumber(m.value)));
        var deltaStr = "";
        if(m.delta!==null && m.delta!==0){
          var cls = m.delta>=0 ? "up" : "down";
          var sign = m.delta>=0 ? "+" : "";
          deltaStr = ' <span class="metric-delta '+cls+'">'+sign+(m.currency||m.isPercent?formatMetricValue(m,m.delta):fmtNumber(m.delta))+'</span>';
        }
        return '<div class="metric-chip"><span>'+m.label+'</span><span class="metric-value">'+valStr+'</span>'+deltaStr+sparkline(m.points)+'</div>';
      }).join("");
    }
    return '<div class="metrics-block" id="metrics-'+itemId+'">'+inner+'</div>';
  }

  function initMetrics(){
    frontsAsArray().forEach(function(f){
      f.items.forEach(function(it){
        if(!it.source) return;
        var rows = SNAPSHOT_ROWS[it.id] || [];
        metricsState[it.id] = { metrics: parseMetricRows(rows, it.source.metrics) };
      });
    });
  }

  // ---- full metric detail (chart per metric, one item at a time) ----

  function buildChart(points, def){
    if(!points.length) return '<div class="empty-items">Sem dados no período.</div>';
    var w=320,h=150,left=38,right=10,top=12,bottom=20;
    var plotW=w-left-right, plotH=h-top-bottom;
    var vals = points.map(function(p){ return p.value; });
    var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
    if(min===max){ min-=1; max+=1; }
    var pad = (max-min)*0.1;
    var lo = min-pad, hi = max+pad;
    function sx(i){ return points.length>1 ? left+i*(plotW/(points.length-1)) : left+plotW/2; }
    function sy(v){ return top+(1-(v-lo)/(hi-lo))*plotH; }
    var coords = points.map(function(p,i){ return sx(i).toFixed(1)+","+sy(p.value).toFixed(1); });
    var lineD = "M"+coords.join(" L");
    var areaD = lineD+" L"+sx(points.length-1).toFixed(1)+","+(top+plotH)+" L"+sx(0).toFixed(1)+","+(top+plotH)+" Z";
    var gridVals = [hi, (lo+hi)/2, lo];
    var gridLines = gridVals.map(function(v){
      var y = sy(v).toFixed(1);
      return '<line x1="'+left+'" x2="'+(w-right)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--border);stroke-width:1" />' +
        '<text x="'+(left-5)+'" y="'+y+'" text-anchor="end" dominant-baseline="middle" style="fill:var(--text-muted);font-family:\'IBM Plex Mono\',monospace;font-size:7.5px;">'+formatMetricValue(def,v)+'</text>';
    }).join("");
    var lastX = sx(points.length-1), lastY = sy(points[points.length-1].value);
    var xLabels =
      '<text x="'+left+'" y="'+(h-4)+'" style="fill:var(--text-muted);font-family:\'IBM Plex Mono\',monospace;font-size:8px;">'+fmtDateShort(points[0].date)+'</text>' +
      '<text x="'+(w-right)+'" y="'+(h-4)+'" text-anchor="end" style="fill:var(--text-muted);font-family:\'IBM Plex Mono\',monospace;font-size:8px;">'+fmtDateShort(points[points.length-1].date)+'</text>';
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" role="img" aria-label="Gráfico de evolução">' +
      '<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" style="stop-color:var(--accent);stop-opacity:.35" />' +
        '<stop offset="100%" style="stop-color:var(--accent);stop-opacity:0" />' +
      '</linearGradient></defs>' +
      gridLines +
      '<path d="'+areaD+'" style="fill:url(#chartGrad);stroke:none" />' +
      '<path d="'+lineD+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round" />' +
      '<circle cx="'+lastX.toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="3" style="fill:var(--accent)" />' +
      xLabels +
    '</svg>';
  }

  function renderLeaderboard(itemId, field, label){
    var top = topVideosByMetric(itemId, field, 3);
    if(!top.length) return "";
    var rows = top.map(function(v){
      return '<button class="leader-row" data-video="'+v.id+'">' +
        '<img class="leader-thumb" src="'+v.thumb+'" alt="" loading="lazy" />' +
        '<span class="leader-info"><span class="leader-title">'+v.title+'</span><span class="leader-value">'+fmtNumber(v[field])+' · '+label+'</span></span>' +
      '</button>';
    }).join("");
    return '<div><div class="section-label" style="margin-top:0;">Destaque nessa métrica</div><div class="leader-list">'+rows+'</div></div>';
  }

  function renderTrafficSide(itemId){
    var info = EXTRA_INFO[itemId];
    if(!info) return "";
    var rows = info.traffic.map(function(t){
      return '<div class="evo-row" style="grid-template-columns:1fr auto;"><span class="evo-item">'+t.label+'</span><span class="evo-value">'+fmtNumber(t.views)+'</span></div>';
    }).join("");
    return '<div><div class="section-label" style="margin-top:0;">Origem das visualizações (30 dias)</div><div class="evo-list">'+rows+'</div></div>';
  }

  function renderAudienceGroup(rows, valueFmt){
    return rows.map(function(r){
      var val = valueFmt(r);
      return '<div class="evo-row" style="grid-template-columns:1fr auto;"><span class="evo-item">'+r.label+'</span><span class="evo-value">'+val+'</span></div>';
    }).join("");
  }

  function renderAudienceSide(itemId){
    var a = AUDIENCE_INFO[itemId];
    if(!a) return "";
    var blocks = [];
    if(a.ageGender && a.ageGender.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Público (idade e gênero)</div><div class="evo-list">' +
        renderAudienceGroup(a.ageGender, function(r){ return r.pct.toFixed(1).replace(".",",")+"%"; }) + '</div></div>');
    }
    if(a.countries && a.countries.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Países</div><div class="evo-list">' +
        renderAudienceGroup(a.countries, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    if(a.device && a.device.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Dispositivo</div><div class="evo-list">' +
        renderAudienceGroup(a.device, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    if(a.playbackLocation && a.playbackLocation.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Onde assistiram</div><div class="evo-list">' +
        renderAudienceGroup(a.playbackLocation, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    if(a.subscriptionStatus && a.subscriptionStatus.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Inscritos x não inscritos</div><div class="evo-list">' +
        renderAudienceGroup(a.subscriptionStatus, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    return blocks.join("");
  }

  function renderDetailPanel(item, metricsDef, parsed, activeIdx){
    var tabs = metricsDef.map(function(def,i){
      return '<button class="detail-tab'+(i===activeIdx?" active":"")+'" data-idx="'+i+'">'+def.label+'</button>';
    }).join("");
    var def = metricsDef[activeIdx];
    var m = parsed[activeIdx];
    var deltaHtml = "";
    if(m.delta!==null && m.delta!==0){
      var cls = m.delta>=0 ? "up" : "down";
      var sign = m.delta>=0 ? "+" : "";
      deltaHtml = '<span class="delta metric-delta '+cls+'">'+sign+formatMetricValue(def, m.delta)+' em 30 dias</span>';
    }
    var mainCol =
      '<div><div class="detail-stat"><span class="big">'+formatMetricValue(def, m.value)+'</span>'+deltaHtml+'</div>' +
      '<div class="detail-period">'+(m.points.length ? fmtDateShort(m.points[0].date)+' – '+fmtDateShort(m.points[m.points.length-1].date) : "sem histórico no período")+'</div>' +
      '<div class="chart-wrap">'+buildChart(m.points, def)+'</div></div>';

    var sideParts = [renderLeaderboard(item.id, def.field, def.label), renderTrafficSide(item.id), renderAudienceSide(item.id)].filter(Boolean);
    var sideCol = sideParts.length ? '<div class="detail-side">'+sideParts.join("")+'</div>' : "";

    var sourceLabel = (item.source && item.source.detailSourceLabel) || "Metricool";
    return '<div class="panel-head">' +
      '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
        '<button class="back-btn" id="backBtn" aria-label="Voltar">←</button>' +
        '<div style="min-width:0;"><div class="panel-name">'+item.label+'</div><div class="panel-kicker">'+item.id+' · via '+sourceLabel+'</div></div>' +
      '</div>' +
      '<button class="close-btn" id="closeBtn">×</button>' +
    '</div>' +
    '<div class="detail-tabs">'+tabs+'</div>' +
    '<div class="detail-grid'+(sideCol?"":" single")+'" id="detailBody">'+mainCol+sideCol+'</div>';
  }

  function wireDetail(frontKey, item, metricsDef, parsed, activeIdx){
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("backBtn").addEventListener("click", function(){ openFront(frontKey); });
    Array.prototype.forEach.call(panel.querySelectorAll(".detail-tab"), function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-idx"),10);
        openModal(renderDetailPanel(item, metricsDef, parsed, idx), true);
        wireDetail(frontKey, item, metricsDef, parsed, idx);
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".leader-row"), function(btn){
      btn.addEventListener("click", function(){
        openVideoDetail(frontKey, item, metricsDef, parsed, activeIdx, btn.getAttribute("data-video"));
      });
    });
  }

  function openMetricDetail(frontKey, itemId){
    var f = state.fronts[frontKey];
    var item = f.items.find(function(x){ return x.id===itemId; });
    if(!item || !item.source) return;
    var metricsDef = item.source.detailMetrics || item.source.metrics;
    var rows = DETAIL_ROWS[itemId] || SNAPSHOT_ROWS[itemId] || [];
    var parsed = parseMetricRows(rows, metricsDef);
    openModal(renderDetailPanel(item, metricsDef, parsed, 0), true);
    wireDetail(frontKey, item, metricsDef, parsed, 0);
  }

  // ---- individual video view (from a leaderboard click) ----

      {label:"Duração média (s)", value:video.avgDuration}
    ].map(function(c){

      '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +

  function openVideoDetail(frontKey, item, metricsDef, parsed, activeIdx, videoId){
    var video = (ITEM_VIDEOS[item.id]||[]).find(function(v){ return v.id===videoId; });
    if(!video) return;
    openModal(renderVideoPanel(video, item.id), true);
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    document.getElementById("backBtn").addEventListener("click", function(){
      openModal(renderDetailPanel(item, metricsDef, parsed, activeIdx), true);
      wireDetail(frontKey, item, metricsDef, parsed, activeIdx);

  // ---- overview: frentes / evolução / financeiro (tabbed) ----

  var OVERVIEW_TABS = [
    {key:"fronts", label:"Frentes"},
    {key:"evo", label:"Evolução"},
    {key:"fin", label:"Financeiro"}
  ];

  function renderFrontsTab(){
    var arr = frontsAsArray();
    return '<div class="overview-table">' + arr.map(function(f){
      var bar = '<div class="ov-bar">' + STAGES.map(function(s,i){
        var on = i<=f.stage;
        return '<div class="seg '+(on?"on "+(f.stage>=3?"done":""):"")+'"></div>';
      }).join("") + '</div>';
      return '<div class="ov-row" data-key="'+f.key+'">' +
        '<span class="ov-num">'+String(f.num).padStart(2,"0")+'</span>' +
        '<span class="ov-name">'+f.name+'</span>' +
        bar +
        '<span class="ov-stage">'+STAGES[f.stage]+'</span>' +
      '</div>';
    }).join("") + '</div>';
  }

  function renderEvoTab(){
    var rows = [];
    frontsAsArray().forEach(function(f){
      f.items.forEach(function(it){
        if(!it.source) return;
        var ms = metricsState[it.id];
        if(!ms || !ms.metrics.length) return;
        var m = ms.metrics[0];
        var valStr = m.value===null ? "—" : (m.currency||m.isPercent ? formatMetricValue(m,m.value) : fmtNumber(m.value));
        var deltaStr = "";
        if(m.delta!==null && m.delta!==0){
          var cls = m.delta>=0 ? "up" : "down";
          var sign = m.delta>=0 ? "+" : "";
          deltaStr = ' <span class="metric-delta '+cls+'">'+sign+(m.currency||m.isPercent?formatMetricValue(m,m.delta):fmtNumber(m.delta))+'</span>';
        }
        rows.push(
          '<div class="evo-row" data-key="'+f.key+'">' +
            '<div class="evo-name"><span class="evo-front">'+String(f.num).padStart(2,"0")+' · '+f.name+'</span><span class="evo-item">'+it.label+'</span></div>' +
            '<div class="evo-value">'+valStr+deltaStr+'</div>' +
            '<div class="evo-spark">'+sparkline(m.points,120,28)+'</div>' +
          '</div>'
        );
      });
    });
    if(!rows.length) return '<div class="empty-items">Nenhuma conta com dado real conectado ainda.</div>';
    return '<div class="evo-list">'+rows.join("")+'</div>';
  }

  function renderFinTab(){
    var arr = frontsAsArray();
    var revenue = state.revenue || {entries:[]};
    var byMonth = {};
    revenue.entries.forEach(function(e){ byMonth[e.month] = (byMonth[e.month]||0) + Number(e.amount); });
    var months = Object.keys(byMonth).sort().slice(-6);
    var max = Math.max.apply(null, months.map(function(m){ return byMonth[m]; }).concat([1]));
    var bars = months.map(function(m){
      var v = byMonth[m];
      var h = Math.max(4, Math.round(v/max*48));
      return '<div class="fin-bar-col"><div class="fin-bar" style="height:'+h+'px" title="'+fmtCurrency(v)+'"></div><span class="fin-bar-label">'+monthLabel(m)+'</span></div>';
    }).join("");

    var entriesRows = revenue.entries.slice().sort(function(a,b){ return b.month.localeCompare(a.month); }).map(function(e){
      var fr = state.fronts[e.frontKey];
      var frName = fr ? fr.name : e.frontKey;
      return '<div class="fin-row" data-id="'+e.id+'"><span class="fin-row-front">'+frName+'</span><span class="fin-row-month">'+monthLabel(e.month)+'</span><span class="fin-row-amount">'+fmtCurrency(e.amount)+'</span><button class="item-del fin-del" aria-label="Remover">×</button></div>';
    }).join("") || '<div class="empty-items">Nenhum lançamento ainda — comece pelo mês atual.</div>';

    var frontOptions = arr.map(function(f){ return '<option value="'+f.key+'">'+String(f.num).padStart(2,"0")+' · '+f.name+'</option>'; }).join("");

    return (months.length ? '<div class="fin-chart">'+bars+'</div>' : '<div class="empty-items">Ainda sem lançamentos — registre a receita mensal de cada negócio abaixo.</div>') +
      '<div class="fin-list">'+entriesRows+'</div>' +
      '<div class="add-row fin-add">' +
        '<select id="revFront">'+frontOptions+'</select>' +
        '<input type="month" id="revMonth" />' +
        '<input type="number" id="revAmount" placeholder="Valor R$" min="0" step="0.01" />' +
        '<button id="revAddBtn">Adicionar</button>' +
      '</div>';
  }

  function renderOverview(tabKey){
    var tabsHtml = OVERVIEW_TABS.map(function(t){
      return '<button class="ov-tab'+(t.key===tabKey?" active":"")+'" data-tab="'+t.key+'">'+t.label+'</button>';
    }).join("");
    var body = tabKey==="evo" ? renderEvoTab() : (tabKey==="fin" ? renderFinTab() : renderFrontsTab());
    return '<div class="panel-head"><div class="panel-title"><div><div class="panel-name">Visão geral</div>' +
      '<div class="panel-kicker">Grupo V.D.P.</div></div></div>' +
      '<button class="close-btn" id="closeBtn">×</button></div>' +
      '<div class="ov-tabs">'+tabsHtml+'</div>' +
      '<div id="ovBody">'+body+'</div>' +
      '<div class="updated">Atualizado em '+fmtDate(state.updatedAt)+'</div>' +
      '<button class="reset-btn" id="resetLocalBtn">Restaurar versão publicada (desfaz edições feitas neste navegador)</button>';
  }

  function wireOverview(tabKey){
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    Array.prototype.forEach.call(panel.querySelectorAll(".ov-tab"), function(btn){
      btn.addEventListener("click", function(){ openOverview(btn.getAttribute("data-tab")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".ov-row"), function(row){
      row.addEventListener("click", function(){ openFront(row.getAttribute("data-key")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".evo-row"), function(row){
      row.addEventListener("click", function(){ openFront(row.getAttribute("data-key")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".fin-del"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.closest(".fin-row").getAttribute("data-id");
        state.revenue.entries = state.revenue.entries.filter(function(e){ return e.id!==id; });
        persistState();
        openOverview("fin");
      });
    });
    var revAddBtn = document.getElementById("revAddBtn");
    if(revAddBtn){
      revAddBtn.addEventListener("click", function(){
        var frontKey = document.getElementById("revFront").value;
        var month = document.getElementById("revMonth").value;
        var amount = parseFloat(document.getElementById("revAmount").value);
        if(!frontKey || !month || !(amount>=0)) return;
        state.revenue = state.revenue || {entries:[]};
        state.revenue.entries.push({ id:"r"+Date.now()+Math.floor(Math.random()*1000), frontKey:frontKey, month:month, amount:amount });
        persistState();
        openOverview("fin");
      });
    }
    document.getElementById("resetLocalBtn").addEventListener("click", function(){
      if(!window.confirm("Isso vai apagar as edições feitas só neste navegador e voltar para a versão publicada. Continuar?")) return;
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = JSON.parse(JSON.stringify(SEED_DATA));
      initMetrics();
      renderGrid();
      openOverview(tabKey);
    });
  }

  function openOverview(tabKey){
    tabKey = tabKey || "fronts";
    openModal(renderOverview(tabKey));
    wireOverview(tabKey);
  }

  function openFront(key){
    var f = state.fronts[key];
    if(!f) return;

    var stagesHtml = STAGES.map(function(s,i){
      return '<button class="stage-btn'+(i===f.stage?" active":"")+'" data-stage="'+i+'"><b>'+(i+1)+'</b>'+s+'</button>';
    }).join("");

    var itemsHtml = f.items.length ? f.items.map(function(it){
      var extra = it.source ? renderMetricsBlock(it.id) : (it.note ? '<div class="metric-note">'+it.note+'</div>' : "");
      var expandBtn = (it.source && it.source.detailMetrics) ? '<button class="item-expand" data-detail="'+it.id+'" aria-label="Ver gráfico completo">📈</button>' : "";
      return '<div class="item-block">' +
        '<div class="item-row" data-item="'+it.id+'">' +
          '<span class="item-label">'+it.id+' · '+it.label+'</span>' +
          expandBtn +
          '<button class="status-pill" data-status="'+it.status+'">'+STATUS_LABEL[it.status]+'</button>' +
          '<button class="item-del" aria-label="Remover">×</button>' +
        '</div>' +
        extra +
      '</div>';
    }).join("") : '<div class="empty-items">Nenhum item ainda — adicione abaixo.</div>';

    var html =
      '<div class="panel-head"><div class="panel-title"><span class="num">'+String(f.num).padStart(2,"0")+'</span>' +
      '<div><div class="panel-name">'+f.name+'</div><div class="panel-kicker">'+f.category+'</div></div></div>' +
      '<button class="close-btn" id="closeBtn">×</button></div>' +

      '<div class="section-label">Estágio</div>' +
      '<div class="stages">'+stagesHtml+'</div>' +

      '<div class="section-label">Meta</div>' +
      '<div class="add-row goal-row">' +
        '<input type="text" id="goalText" placeholder="Ex.: chegar a 1.000 seguidores até dez/26" value="'+((f.goal&&f.goal.text)||"").replace(/"/g,"&quot;")+'" />' +
        '<input type="number" id="goalTarget" placeholder="Alvo (nº)" value="'+((f.goal&&f.goal.target!=null)?f.goal.target:"")+'" />' +
      '</div>' +
      (function(){
        var gp = goalProgress(f);
        if(!gp) return "";
        return '<div class="goal-progress"><div class="goal-bar"><div class="goal-bar-fill'+(gp.pct>=100?" complete":"")+'" style="width:'+gp.pct+'%"></div></div>' +
          '<span class="goal-pct">'+fmtNumber(gp.value)+' / '+fmtNumber(gp.target)+' · '+gp.pct+'%</span></div>';
      })() +

      '<div class="section-label">Itens</div>' +
      '<div class="items" id="itemsWrap">'+itemsHtml+'</div>' +
      '<div class="add-row"><input type="text" id="newItemInput" placeholder="Novo item…" /><button id="addItemBtn">Adicionar</button></div>' +

      '<div class="section-label">Notas</div>' +
      '<textarea class="notes" id="notesArea" placeholder="Observações, próximos passos…">'+(f.notes||"")+'</textarea>' +

      '<div class="updated">Atualizado em '+fmtDate(f.updatedAt)+'</div>';

    openModal(html);
    document.getElementById("closeBtn").addEventListener("click", closeModal);

    Array.prototype.forEach.call(panel.querySelectorAll(".stage-btn"), function(btn){
      btn.addEventListener("click", function(){
        f.stage = parseInt(btn.getAttribute("data-stage"),10);
        persistFront(key, f);
        openFront(key);
      });
    });

    Array.prototype.forEach.call(panel.querySelectorAll(".item-row"), function(row){
      var id = row.getAttribute("data-item");
      row.querySelector(".status-pill").addEventListener("click", function(){
        var item = f.items.find(function(it){ return it.id===id; });
        var idx = STATUS_ORDER.indexOf(item.status);
        item.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
        persistFront(key, f);
        openFront(key);
      });
      row.querySelector(".item-del").addEventListener("click", function(){
        f.items = f.items.filter(function(it){ return it.id!==id; });
        persistFront(key, f);
        openFront(key);
      });
      var expandBtn = row.querySelector(".item-expand");
      if(expandBtn){
        expandBtn.addEventListener("click", function(e){
          e.stopPropagation();
          openMetricDetail(key, id);
        });
      }
    });

    var addBtn = document.getElementById("addItemBtn");
    var addInput = document.getElementById("newItemInput");
    function doAdd(){
      var val = addInput.value.trim();
      if(!val) return;
      var nextN = f.items.length ? Math.max.apply(null, f.items.map(function(it){
        var parts = it.id.split(".");
        return parseInt(parts[1]||"0",10);
      })) + 1 : 1;
      f.items.push({id:f.num+"."+nextN, label:val, status:"pendente"});
      persistFront(key, f);
      openFront(key);
    }
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } });

    var notesArea = document.getElementById("notesArea");
    notesArea.addEventListener("blur", function(){
      f.notes = notesArea.value;
      persistFront(key, f);
    });

    var goalTextInput = document.getElementById("goalText");
    var goalTargetInput = document.getElementById("goalTarget");
    function saveGoal(){
      var targetVal = goalTargetInput.value.trim();
      f.goal = {
        text: goalTextInput.value.trim(),
        target: targetVal ? parseFloat(targetVal) : null
      };
      persistFront(key, f);
    }
    goalTextInput.addEventListener("blur", saveGoal);
    goalTargetInput.addEventListener("blur", saveGoal);
  }

  function persistState(){
    state.updatedAt = Date.now();
    renderGrid();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* private mode / storage full: edits stay in-memory only */ }
  }
  function persistFront(key, f){
    f.updatedAt = Date.now();
    state.fronts[key] = f;
    persistState();
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* fall through to seed */ }
    return JSON.parse(JSON.stringify(SEED_DATA));
  }

  function renderFreshNote(){
    var note = document.getElementById("freshNote");
    if(!note) return;
    if(!metricsDataLoaded){
      note.textContent = "não consegui carregar os dados atualizados — mostrando o painel sem métricas";
      return;
    }
    var when = "—";
    try{ when = new Date(metricsGeneratedAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){}
    note.textContent = "YouTube atualizado automaticamente a cada 5 min · última vez: "+when+" · Instagram/Metricool ainda é manual";
  }

  function boot(){
    state = loadState();
    loadMetricsData().then(function(){
      initMetrics();
      renderGrid();
      renderFreshNote();
    });
  }

  boot();
})();
</script>
</body>
</html>
