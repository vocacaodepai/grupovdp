<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel VDP</title>
<link rel="icon" href="data:," />
<script data-theme-boot>(function(){try{var m=localStorage.getItem("vdp-theme-v1");if(m==="light"||m==="dark"){document.documentElement.setAttribute("data-theme",m);}else{document.documentElement.removeAttribute("data-theme");}}catch(e){}})();</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light dark;
    /* pilhas de fonte (§5): Fraunces nunca em número; Inter proporcional em valores */
    --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"Fraunces",Georgia,serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    /* superfícies e texto (§4.1) */
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --text:#161a22;
    --text-2:#3f4757;
    --text-muted:#626b7a;
    --border:#dbe1ea;
    --grid:#e6eaf0;
    --axis:#c9d1dc;
    --accent:#2f5fd6;
    --accent-soft:#e3ebfd;
    --good:#1f8a55;
    --good-soft:#e1f3ea;
    --bad:#c1443a;
    --deemph:#c3c9d3;
    --tip-bg:#ffffff;
    --flash:rgba(47,95,214,.16);
    --ring:var(--surface);
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 8px 24px rgba(20,30,50,.08);
    /* slots categóricos (§4.2) — identidade fixa por item (SERIES_SLOT), só marcas, nunca texto */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --s1-lt:#6da7ec;
    /* rampa sequencial (heatmap, baixo→alto) e ordinal (faixas etárias 45–54 → 65+) (§4.4) */
    --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
    --ord-1:#86b6ef; --ord-2:#3987e5; --ord-3:#184f95;
    /* status (fixos, nunca temáticos, sempre com ícone + rótulo) e delta (texto, sempre com glifo) */
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-critical:#d03b3b;
    --delta-up:#006300; --delta-down:#b3261e;
    --seq-ink:#ffffff; --ink-on-deemph:#161a22; --ink-on-s1:#0c0f14;
    /* raios, durações, curva (§4.4 / §14) */
    --r-sm:6px; --r:10px; --r-lg:14px;
    --d-micro:120ms; --d-std:180ms; --d-draw:520ms; --d-flash:900ms;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{ color-scheme:dark; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0f14;
      --surface:#12161d;
      --surface-2:#1a2029;
      --text:#e8ebf0;
      --text-2:#b4bcc9;
      --text-muted:#838d9c;
      --border:#232a35;
      --grid:#1f2630;
      --axis:#2c3441;
      --accent:#4d8dff;
      --accent-soft:#17233d;
      --good:#34b37a;
      --good-soft:#103524;
      --bad:#e2645a;
      --deemph:#3a4352;
      --tip-bg:#1a2029;
      --flash:rgba(77,141,255,.22);
      --ring:var(--surface);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      --s1-lt:#86b6ef;
      --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
      --ord-1:#184f95; --ord-2:#3987e5; --ord-3:#86b6ef;
      --delta-up:#0ca30c; --delta-down:#e66767;
      --seq-ink:#0c0f14; --ink-on-deemph:#e8ebf0; --ink-on-s1:#ffffff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0f14;
    --surface:#12161d;
    --surface-2:#1a2029;
    --text:#e8ebf0;
    --text-2:#b4bcc9;
    --text-muted:#838d9c;
    --border:#232a35;
    --grid:#1f2630;
    --axis:#2c3441;
    --accent:#4d8dff;
    --accent-soft:#17233d;
    --good:#34b37a;
    --good-soft:#103524;
    --bad:#e2645a;
    --deemph:#3a4352;
    --tip-bg:#1a2029;
    --flash:rgba(77,141,255,.22);
    --ring:var(--surface);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --s1-lt:#86b6ef;
    --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
    --ord-1:#184f95; --ord-2:#3987e5; --ord-3:#86b6ef;
    --delta-up:#0ca30c; --delta-down:#e66767;
    --seq-ink:#0c0f14; --ink-on-deemph:#e8ebf0; --ink-on-s1:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:clamp(10px,2vh,22px) clamp(12px,2.4vw,28px);
    gap:clamp(6px,1vh,10px);
  }
  @media (max-width:720px){
    body{ height:auto; min-height:100dvh; overflow:auto; }
  }

  /* chrome global (§6): linha 1 = wordmark · ferramentas · contagem de estágios; linha 2 = chips de frescor */
  .top{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .wordmark{
    margin:0;
    font-family:var(--font-serif);
    font-weight:600;
    font-size:clamp(15px,1.9vw,20px);
    letter-spacing:.02em;
  }
  .wordmark b{ color:var(--accent); font-weight:700; }
  .wordmark-sub{ color:var(--text-muted); font-family:var(--font-mono); font-size:.7em; letter-spacing:.06em; font-weight:400; }
  .top-right{
    font-family:var(--font-mono);
    font-size:clamp(10px,1.1vw,12px);
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:right;
  }
  /* ⌘K (§6): botão existe desde já (a paleta chega na camada 5); ≤720px vira lupa de 44px */
  .palette-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); border-radius:999px;
    padding:3px 10px; min-height:24px; cursor:pointer; font-family:var(--font-mono); font-size:10.5px; line-height:1.4;
  }
  .palette-btn:hover{ color:var(--text); border-color:var(--accent); }
  .palette-btn kbd{ font:inherit; }
  .palette-btn .palette-ico{ display:none; width:18px; height:18px; }
  @media (max-width:720px){
    .palette-btn{ width:44px; height:44px; min-height:44px; padding:0; border-radius:50%; }
    .palette-btn kbd{ display:none; }
    .palette-btn .palette-ico{ display:block; }
  }
  /* chips de frescor (§6): ao vivo / atrasado / offline (botão = atualizar agora) · YouTube Analytics · Instagram (Metricool) */
  .fresh{
    list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; min-height:16px;
    font-family:var(--font-mono); font-size:10.5px; line-height:1.5; color:var(--text-muted);
  }
  .fresh li{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; min-width:0; }
  .fresh-btn{
    border:none; background:none; padding:1px 0; margin:0; color:inherit; font:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-sm);
  }
  .fresh-btn:hover{ color:var(--text); }
  .live-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--st-good); flex-shrink:0; animation:vdp-live 2s ease-in-out infinite; }
  .live-dot.off{ background:var(--text-muted); animation:none; }
  .st-warn{ color:var(--st-warn); }
  .fresh-warn{ color:var(--text-2); }                             /* palavras do alerta em cor de texto; só o ⚠ fica em --st-warn (§17) */
  .st-critical{ color:var(--st-critical); }
  .fresh-error{ color:var(--text-2); }
  .fresh-retry{ border:1px solid var(--st-critical); background:none; color:var(--st-critical); border-radius:999px; padding:2px 9px; font:inherit; cursor:pointer; margin-left:4px; min-height:22px; }
  .fresh-retry:hover{ background:var(--surface-2); }
  @keyframes vdp-live{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  @media (max-width:720px){ .fresh li{ white-space:normal; } }

  .graph-toggle{
    display:flex; align-items:center; gap:8px;
    border:none; background:none; cursor:pointer; padding:2px 0;
    font-family:var(--font-mono); font-size:11px; color:var(--text-muted);
    flex-shrink:0;
  }
  .graph-toggle:hover{ color:var(--text); }
  .graph-toggle-track{
    width:34px; height:18px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--border); position:relative; flex-shrink:0; transition:background .15s ease;
  }
  .graph-toggle-thumb{
    position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%;
    background:var(--text-muted); transition:transform .15s ease, background .15s ease;
  }
  .graph-toggle[aria-pressed="true"] .graph-toggle-track{ background:var(--accent-soft); border-color:var(--accent); }
  .graph-toggle[aria-pressed="true"] .graph-toggle-thumb{ background:var(--accent); transform:translateX(16px); }

  .top-tools{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; order:1; }
  .top-right{ order:2; }
  @media (max-width:720px){
    .top-right{ order:0; margin-left:auto; }                       /* contagem na linha do wordmark; ferramentas na 2ª linha */
    .top-tools{ flex-basis:100%; margin-left:0; order:3; }
  }

  /* Tema: segmented Auto / Claro / Escuro (§6) — role=radiogroup, 3 role=radio */
  .theme-toggle{
    display:inline-flex; align-items:center; gap:2px; padding:2px;
    border:1px solid var(--border); border-radius:999px; background:var(--surface-2); flex-shrink:0;
  }
  .theme-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    border:none; background:none; color:var(--text-muted); cursor:pointer;
    font-family:var(--font-mono); font-size:10.5px; line-height:1.4; padding:3px 9px; border-radius:999px;
    min-height:24px; transition:background var(--d-micro) var(--ease), color var(--d-micro) var(--ease);
  }
  .theme-btn:hover{ color:var(--text); }
  .theme-btn[aria-checked="true"]{ background:var(--accent-soft); color:var(--accent); }
  .theme-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  @media (max-width:720px){
    .theme-btn .theme-txt{ display:none; }
    .theme-btn{ padding:5px 8px; }
    .theme-btn > span[aria-hidden]{ font-size:15px; line-height:1; }   /* ◐ ☀ ☾ legíveis a 1× (alvo de 44px definido abaixo) */
  }

  .card-items-preview{
    font-size:clamp(9.5px,.9vw,11px); color:var(--text-muted); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    flex:1; min-height:0;
  }
  .card-chip-row{
    --chip-lines:2;
    display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px;
    flex:1; min-height:0; overflow:hidden;
  }
  .card-chip{
    font-family:var(--font-mono); font-size:clamp(8.5px,.82vw,10px);
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:3px 8px; cursor:pointer; line-height:1.3; white-space:nowrap;
  }
  .card-chip:hover{ border-color:var(--accent); color:var(--text); }
  .card-chip.has-detail{ border-color:var(--accent); color:var(--accent); }
  .card-chip.more{ cursor:default; opacity:.7; }
  .card-chip.more:hover{ border-color:var(--border); color:var(--text-muted); }
  .card-chip{ display:inline-flex; align-items:center; }
  .card-chip[hidden]{ display:none; }
  .chip-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--k, var(--deemph)); margin-right:5px; flex-shrink:0; }
  .chip-ico{ width:10px; height:10px; margin-left:4px; flex-shrink:0; }
  /* linha-stat do card (§7.1): valor Inter 600 · delta mono em --delta-* · sparkline 72×18; rótulo da métrica com data (+ ⚠) */
  .card-stat{ display:flex; align-items:center; gap:8px; min-height:20px; }
  .card-stat-value{ font-family:var(--font-sans); font-weight:600; font-size:clamp(16px,1.6vw,20px); letter-spacing:-.01em; line-height:1.1; color:var(--text); white-space:nowrap; }
  .card-stat-delta{ font-family:var(--font-mono); font-size:clamp(9px,.85vw,10.5px); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .card-stat-delta.up{ color:var(--delta-up); }
  .card-stat-delta.down{ color:var(--delta-down); }
  .card-stat-spark{ margin-left:auto; line-height:0; flex-shrink:0; }
  .card-stat-empty{ font-size:clamp(10px,.9vw,11.5px); color:var(--text-muted); line-height:1.3; }
  .card-metric{ font-family:var(--font-mono); font-size:clamp(8.5px,.8vw,9.5px); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-pulse{ font-family:var(--font-sans); font-weight:500; font-size:clamp(10.5px,.85vw,11.5px); line-height:1.3; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-pulse b{ font-weight:700; }
  .card-pulse[hidden]{ display:none; }
  .pulse-glyph.up{ color:var(--delta-up); }
  .pulse-glyph.down{ color:var(--delta-down); }
  .pulse-glyph.warn{ color:var(--st-warn); }
  .pulse-glyph.zero{ color:var(--text-muted); }
  .card-graph{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; min-height:0; }
  .card-graph svg{ color:var(--accent); width:100%; height:auto; display:block; }
  .card-graph-empty{ font-size:11px; color:var(--text-muted); font-style:italic; }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:5px 10px; }
  .chart-legend-item{
    display:inline-flex; align-items:center; gap:4px;
    font-family:var(--font-mono); font-size:8.5px; color:var(--text-muted);
  }
  .chart-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:clamp(8px,1.3vw,14px);
  }
  @media (max-width:720px){
    .grid{ grid-template-columns:1fr 1fr; grid-template-rows:none; height:auto; }
    .grid > .card{ order:var(--num, 0); min-height:150px; }   /* decisão consciente (§16): hub primeiro, cartas 01→08 em ordem numérica */
    .grid > .hub{ grid-column:1 / -1; order:-1; }
  }
  @media (max-width:460px){
    .grid{ grid-template-columns:1fr; }
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:clamp(10px,1.3vw,16px);
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:0;
    overflow:hidden;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .num{
    font-family:var(--font-mono);
    font-size:clamp(10px,1vw,12px);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:1px 6px;
    flex-shrink:0;
  }
  .kicker{
    font-family:var(--font-mono);
    font-size:clamp(8.5px,.85vw,10px);
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-muted);
    text-align:right;
  }
  .name{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:clamp(13px,1.5vw,18px);
    line-height:1.15;
    text-wrap:balance;
  }
  .card-bottom{ margin-top:auto; display:flex; flex-direction:column; gap:5px; }
  .stage-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .stage-label{
    font-family:var(--font-mono);
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .items-count{
    font-family:var(--font-mono);
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .segbar{ display:flex; gap:3px; }
  .seg{ flex:1; height:5px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border); }
  .seg.on{ background:var(--accent); border-color:var(--accent); }
  .seg.on.done{ background:var(--good); border-color:var(--good); }

  .hub{
    background:radial-gradient(circle at 50% 35%, var(--accent-soft), var(--surface) 72%);
    border:1px solid var(--accent);
    align-items:center;
    text-align:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
  }
  .hub .wordmark2{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:clamp(20px,3vw,32px);
    letter-spacing:.01em;
  }
  .hub .wordmark2 .vdp{ color:var(--accent); }
  .hub .sub{
    font-family:var(--font-mono);
    font-size:clamp(9px,1vw,11px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .hub .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px;
    font-family:var(--font-mono);
    font-size:clamp(9px,.85vw,10.5px);
    color:var(--text-muted);
  }
  .legend .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,20,.55);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .panel{
    width:min(560px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:clamp(18px,3vw,28px);
    box-shadow:var(--shadow);
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .panel-title{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel-title .num{ font-size:12px; }
  .panel-name{ font-family:var(--font-serif); font-weight:600; font-size:clamp(20px,3vw,26px); text-wrap:balance; }
  .panel-kicker{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.09em; color:var(--accent); margin-top:2px;
  }
  .close-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .close-btn:hover{ border-color:var(--accent); }

  .section-label{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--text-muted); margin:18px 0 8px;
  }
  .section-label:first-of-type{ margin-top:4px; }

  .stages{ display:flex; gap:6px; }

  .back-btn{

  .detail-stat .delta{ font-family:var(--font-mono); font-size:12.5px; }

  .chart-wrap{ width:100%; }

  .fin-chart{ display:flex; align-items:flex-end; gap:10px; height:64px; margin-bottom:10px; padding:0 2px; }
  .fin-bar-col{ display:flex; flex-direction:column-reverse; align-items:center; gap:4px; flex:1; height:100%; }
  .fin-bar{ width:100%; max-width:28px; background:var(--accent); border-radius:4px 4px 0 0; }
  .fin-bar-label{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  .fin-list{ display:flex; flex-direction:column; gap:5px; margin-bottom:4px; max-height:220px; overflow-y:auto; }
  .fin-row{
    display:grid; grid-template-columns:1fr auto auto auto; align-items:center; gap:8px;

  }
  .fin-row-amount{ color:var(--text); font-family:var(--font-sans); font-weight:600; font-size:12.5px; }

  .status-msg{
    display:flex; align-items:center; justify-content:center; height:100%;
    font-family:var(--font-mono); font-size:12px; color:var(--text-muted);
  }

  .goal-line{
    font-family:var(--font-mono); font-size:clamp(8.5px,.85vw,10px); color:var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .goal-row input[type="text"]{ flex:2; }
  .goal-row input[type="number"]{ flex:1; }
  .goal-progress{ display:flex; align-items:center; gap:8px; margin:8px 0 4px; }
  .goal-bar{ flex:1; height:6px; border-radius:4px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; }
  .goal-bar-fill{ height:100%; background:var(--accent); }
  .goal-bar-fill.complete{ background:var(--good); }
  .goal-pct{ font-family:var(--font-sans); font-weight:600; font-size:11.5px; color:var(--text-2); white-space:nowrap; }

  .ov-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .ov-tab{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:6px 12px; font-family:var(--font-mono); font-size:10.5px; cursor:pointer;
  }
  .ov-tab.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .ov-tab:hover{ border-color:var(--accent); }

  .evo-list{ display:flex; flex-direction:column; gap:6px; }
  .evo-row{
    display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2);
  }

  .evo-front{
    font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .evo-item{ font-family:var(--font-serif); font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evo-value{ font-family:var(--font-sans); font-weight:600; font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .evo-spark{ color:var(--accent); }

  .reset-btn{
    margin-top:14px; border:none; background:none; color:var(--text-muted);
    font-family:var(--font-mono); font-size:10px; text-decoration:underline; cursor:pointer; padding:0;
  }
  .reset-btn:hover{ color:var(--accent); }

  .panel.wide{ width:min(1040px,96vw); max-height:92vh; }
  .overlay.full-page{ padding:0; align-items:stretch; justify-content:stretch; }
  .panel.full{
    width:100%; max-width:100%; height:100%; max-height:100%;
    border-radius:0; padding:clamp(18px,3vw,40px) clamp(16px,5vw,64px);
  }
  .breadcrumb{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-bottom:16px;
  }
  .breadcrumb button{
    background:none; border:none; color:var(--accent); cursor:pointer;
    font-family:inherit; font-size:inherit; padding:0;
  }
  .breadcrumb button:hover{ text-decoration:underline; }
  .breadcrumb .sep{ opacity:.5; }
  .breadcrumb .current{ color:var(--text); }

  .kpi-row{ display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 22px; }
  .kpi-tile{
    flex:1 1 130px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px;
  }
  .kpi-label{
    font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-muted); display:block; margin-bottom:4px;
  }
  .kpi-value{ font-family:var(--font-sans); font-weight:600; font-size:22px; letter-spacing:-.01em; }
  .project-chart-wrap{ margin-bottom:22px; }
  .detail-grid{ display:flex; flex-direction:column; gap:24px; margin-top:4px; }
  @media (min-width:860px){
    .detail-grid{ display:grid; grid-template-columns:1.5fr 1fr; align-items:start; }
    .detail-grid.single{ display:block; }
  }
  .detail-side{ display:flex; flex-direction:column; gap:22px; }
  .leader-list{ display:flex; flex-direction:column; gap:8px; }
  .leader-row{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:6px; background:var(--surface-2);
    cursor:pointer; text-align:left; width:100%;
  }
  .leader-row:hover{ border-color:var(--accent); }
  .leader-thumb{ width:64px; height:36px; object-fit:cover; border-radius:6px; flex-shrink:0; background:var(--border); display:block; }
  .leader-info{ min-width:0; flex:1; display:flex; flex-direction:column; gap:2px; }
  .leader-title{
    font-size:12px; font-weight:500; line-height:1.3; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .leader-value{ font-family:var(--font-sans); font-size:11.5px; color:var(--accent); font-weight:600; white-space:nowrap; }

  .video-head{ display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }
  .video-thumb{ width:min(200px,40%); border-radius:10px; flex-shrink:0; display:block; }
  .video-title{ font-family:var(--font-serif); font-weight:600; font-size:17px; line-height:1.35; text-wrap:balance; }
  .video-stats{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }

  /* ==== motor de gráficos (§12) ==== */
  .tip{
    position:fixed; z-index:200; pointer-events:none; max-width:min(320px,calc(100vw - 16px));
    background:var(--tip-bg); border:1px solid var(--border); border-radius:var(--r-sm); box-shadow:var(--shadow);
    padding:7px 9px; font-family:var(--font-mono); font-size:10px; line-height:1.45; color:var(--text);
  }
  .tip[hidden]{ display:none; }
  .tip.is-anchored{ max-width:none; }
  .tip-date{ color:var(--text-muted); margin-bottom:2px; white-space:nowrap; }
  .tip-row{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tip-key{ display:inline-block; width:12px; height:0; border-top:2px solid var(--k, var(--s1)); flex-shrink:0; }
  .tip-key.dash{ border-top-style:dashed; }
  .tip-key.none{ width:0; border:0; }
  .tip-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); }
  .tip-lbl{ color:var(--text-2); }
  .tip-grid{ display:grid; grid-template-columns:auto auto; gap:1px 10px; margin-top:5px; padding-top:5px; border-top:1px solid var(--grid); color:var(--text-muted); }
  .tip-gv{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-2); }
  .tip-note{ color:var(--text-2); margin-top:3px; white-space:pre-line; }
  .tip.is-anchored .tip-row{ white-space:normal; }

  .fig{ margin:0; padding:0; min-width:0; border-radius:var(--r); }
  .fig:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }
  .fig.is-cited{ box-shadow:0 0 0 2px var(--accent); transition:box-shadow var(--d-std) var(--ease); }
  .fig-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .fig-titles{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .fig-title{ font-family:var(--font-serif); font-weight:600; font-size:15.5px; line-height:1.2; color:var(--text); }
  .fig-kicker{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); }
  .fig-tools{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .fig-table-btn, .fig-tool-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer;
    border-radius:999px; padding:4px 10px; font-family:var(--font-mono); font-size:10px; min-height:24px;
  }
  .fig-table-btn:hover, .fig-tool-btn:hover{ border-color:var(--accent); color:var(--text); }
  .fig-table-btn[aria-pressed="true"], .fig-tool-btn[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .fig-chart{ min-width:0; }
  .fig-chart svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
  .fig-table-scroll{ overflow-x:auto; max-width:100%; }
  .fig-cap{ margin-top:8px; font-family:var(--font-sans); font-size:12.5px; line-height:1.45; color:var(--text-2); }
  .fig-cap b{ color:var(--text); font-weight:700; }
  .fig-foot{ margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .fig-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; padding:8px 0; }
  .fig-chart[hidden], .fig-table[hidden], .fig-cap[hidden]{ display:none; }

  /* marcas SVG: linhas 2px round, grade/eixo 1px sólidos, texto em tokens de texto (nunca a cor da série) */
  svg.chart text{ font-family:var(--font-mono); font-size:10px; fill:var(--text-muted); }
  svg.chart .tick{ font-family:var(--font-mono); font-size:10px; fill:var(--text-muted); font-variant-numeric:tabular-nums; }
  svg.chart .dlabel{ font-family:var(--font-sans); font-size:11px; font-weight:500; fill:var(--text-2); }
  svg.chart .gl{ stroke:var(--grid); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .axis{ stroke:var(--axis); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .guide{ stroke:var(--axis); stroke-width:1; }
  svg.chart .bracket{ stroke:var(--axis); stroke-width:1; fill:none; }
  svg.chart .mkr{ stroke:var(--ring); stroke-width:2; }
  svg.chart .col{ opacity:.9; }
  svg.chart .col.is-hover{ opacity:1; }                           /* coluna hovered/focada sobe a 100% (§12.0) */
  svg.chart .mk.hit{ outline:none; cursor:pointer; }
  svg.chart .mk.hit:focus-visible{ outline:2px solid var(--accent); }
  svg.chart .hit-col{ cursor:crosshair; }
  svg.chart .xh{ display:none; pointer-events:none; }
  svg.chart.is-xh .xh{ display:block; }
  svg.chart .xh-line{ stroke:var(--axis); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .xh-dot{ stroke:var(--ring); stroke-width:2; }
  svg.chart .ln.draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:vdp-draw var(--d-draw) ease-out forwards; }
  svg.chart .wash.wash-in{ opacity:0; animation:vdp-fade var(--d-std) ease-out 200ms forwards; }
  svg.chart .ln.fade-in{ opacity:0; animation:vdp-fade var(--d-draw) ease-out forwards; }
  @keyframes vdp-draw{ to{ stroke-dashoffset:0; } }
  @keyframes vdp-fade{ to{ opacity:1; } }
  .legend{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-family:var(--font-mono); font-size:10px; color:var(--text-2); }
  .lg{ display:inline-flex; align-items:center; gap:6px; }
  .lg b{ font-family:var(--font-sans); font-weight:600; color:var(--text); }
  .lg-line{ display:inline-block; width:14px; height:0; border-top:2px solid var(--k, var(--s1)); }
  .lg-line.dash{ border-top-style:dashed; }
  .lg-rect{ display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--k, var(--s1)); background:color-mix(in srgb, var(--k, var(--s1)) var(--mix, 100%), var(--surface)); }
  .lg-rect.faded{ --mix:55%; }
  .lg-rect.faded2{ --mix:32%; }

  /* tabela-gêmea */
  table.tw{ border-collapse:collapse; width:100%; font-family:var(--font-sans); font-size:12.5px; }
  table.tw caption{ text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:0 0 6px; }
  table.tw th, table.tw td{ padding:5px 8px; border-bottom:1px solid var(--grid); text-align:left; vertical-align:middle; }
  table.tw thead th{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:500; border-bottom:1px solid var(--axis); }
  table.tw tbody th{ font-weight:500; color:var(--text); }
  table.tw .tnum{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* C0 StatTile */
  .tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px 9px; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .tile-label{ font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .tile-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .tile-value{ font-family:var(--font-sans); font-weight:600; font-size:22px; letter-spacing:-.01em; line-height:1.1; color:var(--text); }
  .tile-trend{ display:block; line-height:0; flex-shrink:0; }
  .tile-delta{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); }
  .tile-delta.up{ color:var(--delta-up); }
  .tile-delta.down{ color:var(--delta-down); }
  .tile-delta-sfx{ color:var(--text-muted); }
  .tile-foot{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  .tile-foot.warn{ color:var(--text-2); }
  .tile-foot.warn::before{ content:"⚠ "; color:var(--st-warn); }
  .spark{ display:block; overflow:visible; }

  /* C2 SparkRows (card em modo gráfico) */
  .spark-rows{ gap:3px; justify-content:flex-start; }
  .spark-row{
    display:grid; grid-template-columns:12px minmax(0,1fr) auto auto 72px; align-items:center; gap:6px;
    width:100%; border:none; background:none; padding:2px 0; cursor:pointer; text-align:left; color:inherit; font:inherit; border-radius:var(--r-sm); min-height:24px;
  }
  .spark-row:hover .spark-lbl{ color:var(--text); }
  .spark-key{ display:inline-block; width:10px; height:0; border-top:2px solid var(--k, var(--s1)); }
  .spark-key.dash{ border-top-style:dashed; }
  .spark-lbl{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .spark-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); white-space:nowrap; }
  .spark-delta{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .spark-delta.up{ color:var(--delta-up); }
  .spark-delta.down{ color:var(--delta-down); }
  .spark-svg{ line-height:0; justify-self:end; }
  .spark-more{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  @media (max-width:720px){ .spark-row{ grid-template-columns:12px minmax(0,1fr) auto auto 56px; } }

  /* C3 SmallMultiples */
  .sm-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .sm-grid-mini{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .sm-panel{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); padding:10px 10px 8px; min-width:0; display:flex; flex-direction:column; gap:4px; color:inherit; text-decoration:none; }
  .sm-panel svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
  .sm-panel.sm-mini{ cursor:pointer; }
  .sm-panel.sm-mini:hover{ border-color:var(--accent); }
  .sm-panel.sm-mini:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sm-head{ display:flex; align-items:center; gap:6px; min-width:0; }
  .sm-title{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  .sm-mini .sm-title{ font-family:var(--font-sans); font-size:11.5px; font-weight:500; color:var(--text); white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.3; }
  .sm-val{ font-family:var(--font-sans); font-weight:600; font-size:12.5px; color:var(--text); white-space:nowrap; }
  .sm-delta{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .sm-delta.up{ color:var(--delta-up); }
  .sm-delta.down{ color:var(--delta-down); }
  .sm-foot{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  .sm-foot .warn::after{ content:" ⚠"; color:var(--st-warn); }
  .sm-note{ font-style:italic; }
  .sm-empty{ font-size:12px; color:var(--text-muted); font-style:italic; padding:12px 0; }

  /* C5 Heatmap */
  .hm{ display:flex; flex-direction:column; gap:2px; }
  .hm-row{ display:grid; grid-template-columns:minmax(64px,auto) repeat(7,minmax(36px,1fr)); gap:2px; align-items:stretch; }
  .hm-head .hm-d{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); text-align:center; padding-bottom:2px; }
  .hm-wk{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); display:flex; align-items:center; padding-right:6px; white-space:nowrap; }
  .hm-cell{
    display:flex; align-items:center; justify-content:center; min-height:36px; border-radius:4px; border:none; padding:0;
    font-family:var(--font-sans); font-size:11px; font-weight:600; color:var(--seq-ink); cursor:pointer;
    opacity:0; animation:vdp-fade 200ms ease-out both; animation-delay:calc(var(--i,0) * 12ms);
  }
  .hm-cell.is-hover, .hm-cell:hover{ outline:2px solid var(--text); outline-offset:-2px; }
  .hm-cell:focus-visible{ outline:2px solid var(--text); outline-offset:-2px; }
  .hm-cell.hm-null{ background:var(--surface-2); border:1px solid var(--border); }
  .hm-legend{ display:flex; align-items:center; gap:3px; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .hm-legend span{ margin:0 4px; }
  .hm-step{ display:inline-block; width:14px; height:8px; border-radius:2px; }
  .hm-wk-short{ display:none; }
  @media (max-width:720px){ .hm-row{ grid-template-columns:auto repeat(7,minmax(28px,1fr)); } .hm-wk-full{ display:none; } .hm-wk-short{ display:inline; } }

  /* C7 HBars · C8 AgeGender · C9 Composition100 */
  .hb{ display:flex; flex-direction:column; gap:4px; }
  .hb-row{ display:grid; grid-template-columns:minmax(90px,170px) 1fr auto; align-items:center; gap:10px; padding:2px 0; border-radius:var(--r-sm); }
  .hb-row.mk{ cursor:default; }
  .hb-row.mk:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .hb-head{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); border-bottom:1px solid var(--grid); padding-bottom:4px; margin-bottom:2px; }
  .hb-lbl{ font-family:var(--font-sans); font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hb-bar{ display:block; height:16px; border-left:1px solid var(--axis); min-width:0; }
  .hb-bar i{ display:block; height:100%; border-radius:0 4px 4px 0; opacity:.9; }
  .hb-head .hb-bar{ border-left:0; height:auto; }                 /* cabeçalho sem a linha de base solta */
  .hb-row.is-hover .hb-bar i, .hb-row:hover .hb-bar i{ opacity:1; }
  .hb-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .hb-pct{ font-family:var(--font-mono); font-weight:400; font-size:10px; color:var(--text-muted); }
  @media (max-width:520px){ .hb-row{ grid-template-columns:1fr auto; } .hb-lbl{ grid-column:1/-1; } .hb-head .hb-lbl{ grid-column:auto; } .hb-head .hb-bar{ display:none; } }

  .ag{ display:flex; flex-direction:column; gap:10px; }
  .ag-band{ display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:center; }
  .ag-band-lbl{ font-family:var(--font-sans); font-size:12px; font-weight:500; color:var(--text-2); }
  .ag-bars{ display:flex; flex-direction:column; gap:2px; }
  .ag-bar{ display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:8px; border-radius:var(--r-sm); }
  .ag-bar:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .ag-g{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .ag-track{ display:block; height:12px; border-left:1px solid var(--axis); }
  .ag-track i{ display:block; height:100%; border-radius:0 4px 4px 0; opacity:.9; }
  .ag-bar.is-hover .ag-track i{ opacity:1; }
  .ag-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ag-legend{ display:flex; align-items:center; gap:3px; margin-top:8px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .ag-legend span{ margin-right:6px; }

  .c100{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .c100-title{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .c100-bar{ display:flex; gap:2px; height:14px; width:100%; }
  /* segmento: repouso = 80% da cor sobre a superfície (nunca opacity no elemento: a tinta do rótulo não esmaece, §17); hover/foco → 100%; 3ª fatia 55%, 4ª+ 32% */
  .c100-seg{ display:flex; align-items:center; justify-content:center; min-width:2px; height:100%; overflow:visible; position:relative; --fill:var(--deemph); --mix:80%; background:var(--fill); background:color-mix(in srgb, var(--fill) var(--mix), var(--surface)); }
  .c100-seg:last-child{ border-radius:0 4px 4px 0; }               /* só a ponta de dado é arredondada; base quadrada (§12 C9) */
  .c100-seg.faded{ --mix:55%; }
  .c100-seg.faded2{ --mix:32%; }
  .c100-seg.is-hover, .c100-seg:hover{ --mix:100%; }
  .c100-seg.faded.is-hover, .c100-seg.faded:hover{ --mix:75%; }
  .c100-seg.faded2.is-hover, .c100-seg.faded2:hover{ --mix:52%; }
  .c100-seg:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .c100-in{ font-family:var(--font-sans); font-size:10px; font-weight:600; white-space:nowrap; line-height:1; }
  .c100-in.ink-on-s1{ color:var(--ink-on-s1); }                    /* tinta escura no claro (≈6:1 sobre --s1 a 80%), branca no escuro (≈5:1) */
  .c100-in.ink-on-lt{ color:#0c0f14; }
  .c100-in.ink-on-deemph{ color:var(--ink-on-deemph); }
  .c100-in.is-hidden{ visibility:hidden; }
  .c100-legend{ display:flex; flex-wrap:wrap; gap:3px 12px; font-family:var(--font-mono); font-size:10px; color:var(--text-2); }
  .c100-legend .lg b{ font-family:var(--font-sans); font-size:11px; }
  .c100-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px 20px; }

  /* C10 VideosTable */
  .vt-sort{ display:none; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-bottom:8px; }
  .vt-select{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--r-sm); padding:6px 8px; font-family:var(--font-sans); font-size:13px; margin-left:6px; min-height:32px; }
  .vt-scroll{ overflow-x:auto; max-width:100%; }
  .vt-table{ min-width:640px; }
  .vt-table th.vt-sortable{ padding:0; }
  .vt-sort-btn{ border:none; background:none; color:inherit; font:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer; padding:5px 8px; width:100%; text-align:right; border-radius:var(--r-sm); }
  .vt-sort-btn:hover{ color:var(--text); }
  .vt-table th[aria-sort="descending"] .vt-sort-btn::after{ content:" ▾"; }
  .vt-table th[aria-sort="ascending"] .vt-sort-btn::after{ content:" ▴"; }
  .vt-table th.is-sorted .vt-sort-btn{ color:var(--accent); }
  .vt-table tbody tr{ cursor:pointer; }
  .vt-table tbody tr:hover{ background:var(--surface-2); }
  .vt-table tbody tr:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .vt-thumb{ width:64px; }
  .vt-thumb img, .vt-nothumb{ display:block; width:64px; height:36px; object-fit:cover; border-radius:4px; background:var(--border); }
  .vt-title{ max-width:360px; }
  .vt-title-txt{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:500; font-size:12.5px; line-height:1.3; }
  .vt-inline{ display:block; height:4px; width:100%; max-width:120px; margin-left:auto; margin-bottom:3px; border-radius:0 2px 2px 0; background:var(--surface-2); }
  .vt-inline i{ display:block; height:100%; background:var(--s1); border-radius:0 2px 2px 0; }
  .vt-spark{ width:80px; }
  .vt-nospark{ color:var(--text-muted); }
  .vt-cards{ display:none; flex-direction:column; gap:6px; }
  .vt-card{ display:flex; gap:10px; align-items:center; border:1px solid var(--border); background:var(--surface-2); border-radius:var(--r-sm); padding:6px; cursor:pointer; text-align:left; color:inherit; font:inherit; width:100%; }
  .vt-card-thumb{ width:56px; height:32px; object-fit:cover; border-radius:4px; flex-shrink:0; background:var(--border); display:block; }
  .vt-card-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .vt-card-title{ font-size:12px; font-weight:500; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .vt-card-nums{ display:flex; flex-wrap:wrap; gap:4px 10px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .vt-card-nums b{ font-family:var(--font-sans); font-weight:600; color:var(--text); font-size:11.5px; }
  .vt-more{ margin-top:8px; }
  .vt-more-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer; border-radius:999px; padding:5px 12px; font-family:var(--font-mono); font-size:10px; }
  .vt-more-btn:hover{ border-color:var(--accent); color:var(--text); }
  @media (max-width:720px){ .vt-sort{ display:block; } .vt-scroll{ display:none; } .vt-cards{ display:flex; } }

  /* C13 Meter */
  .meter{ display:flex; align-items:center; gap:10px; margin:8px 0 4px; }
  .meter-track{ flex:1; height:8px; border-radius:4px; background:var(--s1-lt); opacity:1; position:relative; overflow:hidden; }
  .meter-track::before{ content:""; position:absolute; inset:0; background:var(--surface); opacity:.65; }
  .meter-fill{ position:relative; height:100%; background:var(--s1); border-radius:4px; }
  .meter.done .meter-fill{ background:var(--st-good); }
  .meter-text{ font-family:var(--font-sans); font-weight:600; font-size:11.5px; color:var(--text-2); white-space:nowrap; }
  .meter-done{ color:var(--delta-up); }                            /* "✓ meta atingida" em verde de texto (≥4,5:1); --st-good fica no preenchimento do medidor */

  /* C14 Orbit + hub (§7.3) */
  .hub{ align-items:stretch; text-align:left; justify-content:space-between; gap:4px; padding:clamp(8px,1vw,12px) clamp(10px,1.3vw,16px); }
  .hub-top{ display:flex; justify-content:space-between; gap:8px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); flex-shrink:0; }
  .hub-top span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hub-orbit{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .hub-orbit svg{ width:100%; height:100%; overflow:visible; display:block; }
  .hub-headline{ font-family:var(--font-sans); font-weight:500; font-size:clamp(12px,1vw,13.5px); line-height:1.4; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex-shrink:0; }
  .hub-headline b{ font-weight:700; }
  .orbit .orb-link{ cursor:pointer; outline:none; }
  .orbit .orb-link:focus-visible .orb-body, .orbit .orb-link:focus-visible .orb-center-body{ outline:2px solid var(--accent); outline-offset:3px; }
  .orbit .orb-link:hover .orb-body, .orbit .orb-link.is-hover .orb-body{ fill-opacity:.32; }
  .orbit .orb-link:hover .orb-center-body, .orbit .orb-link.is-hover .orb-center-body{ stroke-width:1.5; }
  .orbit .orb-num{ font-family:var(--font-mono); font-size:9px; fill:var(--text-muted); }
  .orbit .orb-vdp{ font-family:var(--font-serif); font-weight:600; font-size:13px; fill:var(--text); }
  .orbit .orb-vdp-sm{ font-family:var(--font-serif); font-weight:600; font-size:7px; fill:var(--text); }
  .orbit .orb-aud{ font-family:var(--font-sans); font-weight:600; font-size:13px; fill:var(--text); }
  .orbit .orb-pub{ font-family:var(--font-mono); font-size:6.5px; letter-spacing:.1em; fill:var(--text-muted); }
  .orbit .orb-cur{ font-family:var(--font-mono); font-size:8px; fill:var(--surface); pointer-events:none; }
  .orbit-sm .dim{ opacity:.45; transition:opacity 200ms var(--ease); }
  .orbit-sm .orb-link:hover, .orbit-sm .orb-link:focus-visible{ opacity:1; }
  .orbit-sm{ width:84px; height:84px; display:block; overflow:visible; }
  .orbit .orb-node, .orbit .orb-center{ transform-box:fill-box; transform-origin:center; }
  .orbit .orb-spoke.anim{ stroke-dasharray:1; stroke-dashoffset:1; animation:vdp-draw 380ms var(--ease) forwards; }
  .orbit .orb-node.anim{ opacity:0; transform:scale(.4); animation:vdp-pop 260ms var(--ease) forwards; }
  .orbit .orb-center.anim{ opacity:0; transform:scale(.85); animation:vdp-pop 300ms var(--ease) forwards; }
  .orbit .orb-num.anim{ opacity:0; animation:vdp-fade 200ms ease-out forwards; }
  @keyframes vdp-pop{ to{ opacity:1; transform:scale(1); } }
  @media (min-width:721px) and (max-height:780px){
    .hub-top{ display:none; } .hub-headline{ -webkit-line-clamp:1; }
    .card{ padding:10px 14px; gap:4px; }
    .card-pulse{ display:none; }
    .card-chip-row{ --chip-lines:1; }
  }
  @media (min-width:721px) and (max-height:660px){ .hub-headline{ display:none; } .card-metric{ display:none; } }
  @media (max-width:720px){ .orbit-hub .orb-hit{ r:18; } }

  /* pulso ao vivo (§13.3 / §14): render anterior a 55% enquanto o refetch corre; flash no valor que mudou (estático com reduced-motion) */
  [data-mk], figure.fig, .hub-orbit{ transition:opacity 200ms var(--ease); }
  .is-refetching [data-mk], .is-refetching figure.fig, .is-refetching .hub-orbit{ opacity:.55; }
  .flash{ animation:vdp-flash var(--d-flash) ease-out; border-radius:3px; }
  .flash-static{ background:var(--flash); box-shadow:0 0 0 3px var(--flash); border-radius:3px; }
  svg text.flash{ animation:vdp-flash-fill var(--d-flash) ease-out; }
  @keyframes vdp-flash{ from{ background:var(--flash); box-shadow:0 0 0 3px var(--flash); } to{ background:transparent; box-shadow:0 0 0 3px transparent; } }
  @keyframes vdp-flash-fill{ from{ fill:var(--accent); } to{ fill:var(--text); } }
  @media (max-width:720px){ .hub-orbit{ height:clamp(200px,56vw,260px); flex:none; } .hub-top{ flex-direction:column; gap:1px; } .hub-top span{ white-space:normal; } }

  /* ==== Camada 4 — páginas (§8 visão geral · §9 projeto · §10 subprojeto · §11 vídeo) ==== */
  .page-head{ align-items:flex-start; }
  .page-head .panel-title{ flex-wrap:nowrap; align-items:flex-start; min-width:0; flex:1; }
  .page-head .panel-title > .num, .page-head .panel-title > .back-btn, .page-head .panel-title > .item-dot{ margin-top:4px; }
  .page-head .panel-title > .item-dot.lg{ margin-top:12px; }
  .page-titles{ min-width:0; }
  h1.panel-name{ margin:0; font-size:clamp(22px,3vw,30px); line-height:1.1; width:fit-content; max-width:100%; }   /* anel de foco só em volta do texto */
  h1.panel-name:focus-visible{ outline-offset:3px; border-radius:4px; }
  .panel-kicker{ line-height:1.5; }
  .page-titles .panel-kicker{ margin-top:6px; }                    /* folga para o anel de foco do h1 (2px + offset 3px) não cruzar o kicker */
  .head-tools{ display:flex; align-items:flex-start; gap:10px; flex-shrink:0; }
  .mini-orbit{ position:relative; width:84px; height:84px; }
  .mini-orbit svg.orbit-sm{ width:84px; height:84px; }
  .sub-chip{ position:absolute; right:-8px; bottom:-2px; font-family:var(--font-mono); font-size:9px; color:var(--accent); border:1px solid var(--accent); background:var(--surface); border-radius:4px; padding:0 4px; line-height:1.5; }
  @media (max-width:400px){ .mini-orbit{ display:none; } }
  .item-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--k, var(--deemph)); flex-shrink:0; }
  .item-dot.off{ background:transparent; border:1px solid var(--text-muted); }
  .item-dot.lg{ width:10px; height:10px; }

  /* lede + âncoras (§3) */
  .lede{ font-family:var(--font-sans); font-weight:500; font-size:clamp(14.5px,1.2vw,16px); line-height:1.45; color:var(--text); margin:0 0 16px; max-width:80ch; }
  .lede b{ font-weight:700; }
  .lede[hidden]{ display:none; }
  .lede-empty{ color:var(--text-2); font-weight:400; }
  .cite{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; padding:0; margin-left:2px; vertical-align:middle;
    border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--accent); font-family:var(--font-mono); font-size:11px; cursor:pointer;
  }
  .cite:hover{ border-color:var(--accent); }
  .is-cited{ box-shadow:0 0 0 2px var(--accent); border-radius:var(--r-sm); transition:box-shadow var(--d-std) var(--ease); }

  /* KPI row do projeto (C0) */
  .kpi-row .tile{ flex:1 1 150px; }
  .tile-value{ white-space:nowrap; }
  .tile-row{ flex-wrap:wrap; }
  .tile-trend{ margin-left:auto; }

  /* itens com linhas de métrica */
  .item-label{ min-width:0; overflow-wrap:anywhere; }
  .item-open{ font-family:var(--font-mono); font-size:10.5px; color:var(--accent); text-decoration:none; white-space:nowrap; padding:4px 6px; border-radius:var(--r-sm); }
  .item-open:hover{ text-decoration:underline; }
  @media (max-width:720px){
    .item-row{ flex-wrap:wrap; row-gap:4px; }
    .item-row .item-label{ flex:1 1 calc(100% - 16px); }           /* rótulo ocupa a 1ª linha (ao lado do ponto); "abrir painel →", pílula e × na 2ª */
    .item-row .status-pill{ margin-left:auto; }
  }
  .item-metrics{ display:flex; flex-direction:column; gap:3px; padding:2px 4px 4px 12px; }
  .mline{ display:grid; grid-template-columns:minmax(0,1fr) auto auto 72px auto; align-items:center; gap:8px; min-height:22px; }
  .mline-lbl{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mline-val{ font-family:var(--font-sans); font-weight:600; font-size:12.5px; color:var(--text); white-space:nowrap; }
  .mline-delta{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .mline-delta.up{ color:var(--delta-up); }
  .mline-delta.down{ color:var(--delta-down); }
  .mline-spark{ line-height:0; }

  /* lateral do projeto */
  .side-block{ display:flex; flex-direction:column; }

  .goal-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:6px; }
  .link-btn{
    align-self:flex-start; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:7px 12px;
    font-family:var(--font-sans); font-size:12.5px; font-weight:600; cursor:pointer; margin-top:8px;
  }

  .fin-row-proj{ grid-template-columns:1fr auto; }
  .fin-total{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); margin-top:4px; }

  .first-steps{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .step-btn{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; padding:8px 10px; font-family:var(--font-sans); font-size:12.5px; cursor:pointer;
  }
  .step-btn:hover{ border-color:var(--accent); }
  .step-btn.done{ color:var(--text-muted); }
  .step-mark{ font-family:var(--font-mono); color:var(--accent); width:14px; text-align:center; flex-shrink:0; }
  .step-btn.done .step-mark{ color:var(--st-good); }

  /* visão geral: tiles + tabela de frentes + ranking + leitura */
  .ov-tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .fin-tiles{ grid-template-columns:minmax(150px,300px); }
  .ov-table tbody tr{ cursor:pointer; }
  .ov-table tbody tr:hover{ background:var(--surface-2); }
  .ov-table tbody tr:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .ov-table .ov-num{ font-family:var(--font-mono); color:var(--accent); font-size:11px; }
  .ov-table th.ov-name{ font-family:var(--font-serif); font-weight:600; font-size:14px; }
  .ov-cat{ display:block; font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:400; margin-top:1px; }
  .ov-stage-cell{ white-space:nowrap; }
  .ov-bar{ display:inline-block; width:64px; vertical-align:middle; margin-right:8px; }
  .ov-bar .seg{ height:4px; }
  .ov-stage{ vertical-align:middle; }
  .ov-delta{ font-family:var(--font-mono); font-size:11px; }
  .ov-delta.up{ color:var(--delta-up); }
  .ov-delta.down{ color:var(--delta-down); }
  .ov-read{ font-family:var(--font-mono); font-size:11px; white-space:nowrap; }
  .ov-table .muted{ color:var(--text-muted); }
  table.tw tfoot th, table.tw tfoot td{ border-top:1px solid var(--axis); border-bottom:none; font-weight:600; color:var(--text); }
  table.tw tfoot th{ text-align:left; }
  @media (max-width:720px){
    table.ov-table thead{ display:none; }
    table.ov-table, table.ov-table tbody, table.ov-table tfoot{ display:block; }
    table.ov-table tr{ display:flex; flex-wrap:wrap; align-items:center; gap:3px 10px; padding:8px 0; border-bottom:1px solid var(--grid); }
    table.ov-table tr::after{ content:""; flex-basis:100%; height:0; order:1; }
    table.ov-table td, table.ov-table th{ display:block; padding:0; border:none; }
    table.ov-table th.ov-name{ flex:1 1 auto; order:0; }
    table.ov-table .ov-num, table.ov-table .ov-stage-cell{ order:0; }
    table.ov-table td[data-l]:not(.ov-num):not(.ov-stage-cell){ order:2; font-size:11.5px; }
    table.ov-table td[data-l]:not(.ov-num):not(.ov-stage-cell)::before{ content:attr(data-l) " "; font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
    table.ov-table td:empty{ display:none; }
    table.ov-table tfoot tr{ border-bottom:none; }
    table.ov-table .ov-bar{ width:48px; }
  }
  .rank-list{ display:flex; flex-direction:column; gap:6px; }
  .rank-row{
    display:grid; grid-template-columns:14px minmax(0,1fr) auto auto auto 120px auto; align-items:center; gap:10px; width:100%; text-align:left;
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2); color:inherit; font:inherit; cursor:pointer;
  }
  .rank-row:hover{ border-color:var(--accent); }
  .rank-key{ display:inline-block; width:12px; height:0; border-top:2px solid var(--k, var(--s1)); }
  .rank-key.dash{ border-top-style:dashed; }
  .rank-name{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rank-item{ font-family:var(--font-serif); font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-front{ font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-plat{ font-family:var(--font-mono); font-size:9.5px; border:1px solid var(--border); border-radius:4px; padding:1px 5px; color:var(--text-muted); }
  .rank-val{ font-family:var(--font-sans); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .rank-delta{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .rank-delta.up{ color:var(--delta-up); }
  .rank-delta.down{ color:var(--delta-down); }
  .rank-spark{ line-height:0; }
  .rank-read{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .rank-read.warn{ color:var(--text-2); }
  @media (max-width:720px){
    .rank-row{ grid-template-columns:14px minmax(0,1fr) auto; row-gap:2px; }
    .rank-spark, .rank-plat{ display:none; }
    .rank-delta{ grid-column:2; }
    .rank-read{ grid-column:3; text-align:right; }
  }
  .reading{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; counter-reset:reading; }
  .reading-item{
    display:grid; grid-template-columns:18px minmax(0,1fr) auto; gap:3px 12px; align-items:start; counter-increment:reading;
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:var(--surface-2);
  }
  .reading-item::before{ content:counter(reading); grid-row:1 / span 2; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); padding-top:2px; }
  .reading-kicker{ grid-column:2; font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); }
  .reading-text{ grid-column:2; font-family:var(--font-sans); font-size:13.5px; line-height:1.45; color:var(--text); }
  .reading-text b{ font-weight:700; }
  .reading-status{ color:var(--text-2); font-family:var(--font-mono); font-size:10.5px; white-space:nowrap; }   /* "atenção" em cor de texto; só o ⚠ interno fica em --st-warn (§17) */
  .reading-open{ grid-column:3; grid-row:1 / span 2; align-self:center; margin-top:0; white-space:nowrap; }
  @media (max-width:520px){ .reading-item{ grid-template-columns:18px minmax(0,1fr); } .reading-open{ grid-column:2; grid-row:auto; justify-self:start; margin-top:4px; } }
  .sources{ margin-top:22px; }
  .sources .section-label{ display:block; }
  .sources p{ margin:0; font-family:var(--font-mono); font-size:10.5px; line-height:1.55; color:var(--text-muted); max-width:90ch; }
  .fin-mini{ margin-top:14px; }

  /* subprojeto: herói · período · KPI strip · por dia · panorama */
  .hero{ margin:4px 0 14px; }
  .hero-row{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .hero-value{ font-family:var(--font-sans); font-weight:700; font-size:clamp(40px,5vw,52px); line-height:1; letter-spacing:-.02em; color:var(--text); }
  .hero-unit{ font-family:var(--font-sans); font-size:15px; color:var(--text-2); }
  .live-pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; border:1px solid var(--border); border-radius:999px; padding:3px 9px; color:var(--text-2); align-self:center; }
  .live-pill[data-live="live"]{ border-color:var(--st-good); }
  .hero-delta{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); margin-top:6px; }
  .hero-delta.up{ color:var(--delta-up); }
  .hero-delta.down{ color:var(--delta-down); }
  .hero-foot{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); margin-top:3px; }
  .hero-empty{ font-size:13px; }
  .period-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:18px 0 12px; }
  .period{ display:inline-flex; gap:2px; padding:2px; border:1px solid var(--border); border-radius:999px; background:var(--surface-2); }
  .period-btn{ border:none; background:none; color:var(--text-muted); cursor:pointer; font-family:var(--font-mono); font-size:10.5px; padding:5px 12px; border-radius:999px; min-height:28px; }
  .period-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .period-btn:hover{ color:var(--text); }
  .period-note{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  @media (max-width:720px){ .period{ width:100%; display:flex; } .period-btn{ flex:1; text-align:center; } }
  .kpi-strip{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  @media (max-width:900px){ .kpi-strip{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:360px){ .kpi-strip{ grid-template-columns:1fr; } }
  .scoped, #dailyWrap{ transition:opacity 160ms var(--ease); }
  .scoped.is-fading, #dailyWrap.is-fading{ opacity:0; }
  .detail-tabs{ margin:0 0 10px; }
  .panorama{
    display:flex; align-items:center; gap:8px; margin:26px 0 14px; padding-top:14px; border-top:1px solid var(--axis);
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-muted);
  }
  .panorama-title{ font-weight:500; color:var(--text); }
  .ig-tail{ margin-top:26px; padding-top:14px; border-top:1px solid var(--axis); }   /* variante Instagram: mesma divisória/ritmo do panorama */
  .block{ margin:0 0 22px; min-width:0; }
  .section-head{ margin-bottom:8px; }
  .section-title{ font-family:var(--font-serif); font-weight:600; font-size:15.5px; }
  .block-note{ margin:0 0 14px; font-size:12.5px; color:var(--text-muted); font-style:italic; }
  .two-col{ display:grid; grid-template-columns:1.5fr 1fr; gap:18px 24px; align-items:start; }
  .two-col.even{ grid-template-columns:1fr 1fr; }
  @media (max-width:860px){ .two-col, .two-col.even{ grid-template-columns:1fr; } }
  .c100-stack{ grid-template-columns:1fr; }

  /* vídeo */
  .video-head{ align-items:flex-start; }
  .video-info{ min-width:0; display:flex; flex-direction:column; gap:6px; flex:1; }
  h1.video-title{ font-size:clamp(17px,2vw,22px); line-height:1.3; }
  .video-hero{ display:flex; align-items:baseline; gap:8px; }
  .video-derived{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); line-height:1.5; }
  .video-stats .tile{ flex:1 1 130px; }
  .ext-link{ display:inline-block; margin-top:6px; font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--accent); text-decoration:none; }
  .ext-link:hover{ text-decoration:underline; }
  @media (max-width:720px){ .video-head{ flex-direction:column; } .video-thumb{ width:100%; max-width:320px; } }

  /* mobile (§16): folha de tela cheia, cabeçalho sticky */
  @media (max-width:720px){
    .panel.full{ padding:0 16px 18px; }                            /* sem padding-top: o cabeçalho sticky (contido no content-box) gruda no topo real da folha */
    .panel.full .page-head{ position:sticky; top:0; background:var(--surface); z-index:3; padding:12px 0 6px; margin-bottom:8px; }
  }


  /* ==== Camada 5 — paleta ⌘K (§13.4) · sheet "Atalhos de teclado" · dica da home · alvos de toque (§16/§17) ==== */
  .home-hint{ margin:0; flex-shrink:0; text-align:center; font-family:var(--font-mono); font-size:10px; line-height:1.3; color:var(--text-muted); letter-spacing:.02em; }
  .home-hint kbd, .pal-hint kbd, .pal-foot kbd, .sc-keys kbd{ font:inherit; border:1px solid var(--border); border-radius:4px; padding:0 5px; background:var(--surface-2); color:var(--text-2); }
  .hint-btn{ border:none; background:none; color:inherit; font:inherit; cursor:pointer; padding:2px 4px; border-radius:var(--r-sm); }
  .hint-btn:hover{ color:var(--text); }
  @media (max-width:720px), (max-height:700px){ .home-hint{ display:none; } }

  /* folhas (paleta e atalhos): centradas no desktop, sheet inferior 70dvh no mobile; fade + scale .98→1 em 120ms (§14) */
  .sheet-backdrop{ position:fixed; inset:0; z-index:300; background:rgba(10,13,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:min(12vh,110px) 16px 16px; }
  .sheet-backdrop[hidden]{ display:none; }
  .sheet{
    width:min(560px,100%); max-height:min(72vh,600px); display:flex; flex-direction:column; overflow:hidden;
    background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow);
    animation:vdp-sheet-in var(--d-micro) var(--ease);
  }
  @keyframes vdp-sheet-in{ from{ opacity:0; transform:scale(.98); } to{ opacity:1; transform:none; } }
  .sheet-close{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0; }
  .sheet-close:hover{ border-color:var(--accent); }
  .pal-head{ display:flex; align-items:center; gap:8px; padding:8px 10px 8px 12px; border-bottom:1px solid var(--border); }
  .pal-head:focus-within{ box-shadow:inset 0 -2px 0 var(--accent); }        /* substitui o outline do input (o campo é a própria cabeça da folha) */
  .pal-search-ico{ color:var(--text-muted); line-height:0; flex-shrink:0; }
  .pal-input{ flex:1; min-width:0; border:none; background:transparent; color:var(--text); font-family:var(--font-sans); font-size:15px; padding:8px 2px; min-height:40px; outline:none; }
  .pal-input::placeholder{ color:var(--text-muted); }
  .pal-list{ flex:1; min-height:0; overflow-y:auto; padding:6px; }
  .pal-group{ font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); padding:8px 10px 4px; }
  .pal-opt{ display:flex; align-items:center; gap:10px; padding:7px 10px; min-height:36px; border-radius:var(--r-sm); cursor:pointer; font-family:var(--font-sans); font-size:13.5px; color:var(--text); }
  .pal-opt[aria-selected="true"]{ background:var(--accent-soft); }
  .pal-ico{ width:14px; height:14px; line-height:0; color:var(--text-muted); flex-shrink:0; }
  .pal-opt[aria-selected="true"] .pal-ico{ color:var(--accent); }
  .pal-lbl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pal-hint{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; flex-shrink:0; }
  .pal-empty{ padding:18px 12px 20px; font-size:13px; line-height:1.45; color:var(--text-2); }
  .pal-foot{ display:flex; flex-wrap:wrap; gap:4px 14px; padding:6px 12px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  .sc-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 12px 10px 16px; border-bottom:1px solid var(--border); }
  .sc-title{ margin:0; font-family:var(--font-serif); font-weight:600; font-size:17px; }
  .sc-title:focus-visible{ outline-offset:3px; border-radius:4px; }
  .sc-body{ overflow-y:auto; padding:8px 12px; display:flex; flex-direction:column; gap:2px; min-height:0; }
  .sc-row{ display:grid; grid-template-columns:minmax(110px,auto) 1fr; gap:10px; align-items:baseline; padding:6px 4px; border-bottom:1px solid var(--grid); font-size:12.5px; line-height:1.4; }
  .sc-row:last-child{ border-bottom:none; }
  .sc-keys{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); white-space:nowrap; }
  .sc-desc{ color:var(--text-2); }
  .sc-foot{ padding:8px 16px 12px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); border-top:1px solid var(--border); }
  @media (max-width:720px){
    .sheet-backdrop{ align-items:flex-end; padding:0; }
    .sheet{ width:100%; max-height:none; height:70vh; height:70dvh; border-radius:var(--r-lg) var(--r-lg) 0 0; border-bottom:none; }
    .sheet-close{ width:44px; height:44px; }
    .pal-opt{ min-height:44px; }
    .pal-foot{ display:none; }
    .sc-row{ grid-template-columns:1fr; gap:2px; padding:8px 4px; }
  }

  .head-search{ display:inline-flex; align-items:center; justify-content:center; color:var(--text-muted); }
  .head-search:hover{ color:var(--text); }
  .breadcrumb button{ padding:6px 4px; margin:-6px -4px; border-radius:var(--r-sm); }        /* alvo ≥24px sem mexer no layout */
  .item-open{ display:inline-flex; align-items:center; min-height:24px; }
  .ext-link{ display:inline-flex; align-items:center; min-height:24px; }
  .c100-seg::before{ content:""; position:absolute; left:0; right:0; top:-6px; bottom:-6px; }   /* C9: alvo ≥24px sem engrossar a barra de 14px (§17 "hit = célula inteira") */

  /* alvos ≥24px no desktop (§17) — sem mudar a marca: linhas C8 ganham área de toque por pseudo-elemento */
  .cite{ width:24px; height:24px; }
  .item-del{ min-width:24px; min-height:24px; }
  .hint-btn{ padding:5px 4px; }
  .reset-btn{ padding:6px 0; }
  .fresh-btn, .graph-toggle, .card-chip, .vt-sort-btn, .status-pill, .hb-row{ min-height:24px; }
  .ag-bar{ position:relative; }
  .ag-bar::before{ content:""; position:absolute; left:0; right:0; top:-5px; bottom:-5px; }

  /* alvos de toque no mobile (§17: 44px) — botões de página, abas, pílulas, chips; o card em si continua compacto */
  @media (max-width:720px){
    .close-btn, .back-btn{ width:44px; height:44px; }
    .fig-table-btn, .fig-tool-btn, .detail-tab, .ov-tab, .status-pill, .vt-more-btn, .link-btn, .step-btn, .fresh-retry, .add-row button, .reset-btn, .rank-row, .reading-open, .vt-sort-btn, .vt-select{ min-height:44px; }
    .card-chip{ min-height:32px; padding:5px 10px; }
    .item-del{ min-width:44px; min-height:44px; }
    .cite{ width:30px; height:30px; }
    .theme-btn{ min-height:44px; min-width:44px; } .graph-toggle{ min-height:44px; }
    .fresh-btn{ min-height:36px; }
    .mini-orbit, .mini-orbit svg.orbit-sm{ width:84px; height:84px; }               /* na linha de ferramentas há espaço: 84px mantém os nós ≥24px */
    .spark-row{ min-height:36px; }
    .hm-cell{ min-height:44px; }
    .period-btn{ min-height:44px; }
    .add-row input, .add-row select{ min-height:44px; }
    .ag-bar{ min-height:28px; }                                              /* C8: a barra continua 12px; a linha vira alvo de 28px */
    .breadcrumb{ min-height:44px; align-items:center; margin-bottom:8px; }
    .breadcrumb button{ min-height:44px; display:inline-flex; align-items:center; padding:0 6px; margin:0 -6px; }
    .item-open, .ext-link{ min-height:44px; }
  }

  /* §16 mobile: todo painel é folha de tela cheia; cabeçalho sticky em faixa compacta — no topo, ferramentas (lupa · ×) numa linha
     e o título com o kicker em largura total; depois de rolar (.is-scrolled, JS), uma só linha: ← · título · lupa · × */
  @media (max-width:720px){

  // ITEM_VIDEOS, VIDEO_DAILY) is fetched at runtime from data/metrics.json

  // schedule floor) overwrites, so real
  // data flows in without ever touching this script.

  var DETAIL_ROWS = {};
  var EXTRA_INFO = {};
  var AUDIENCE_INFO = {};

  // ---- utilidades: DOM seguro, formatação pt-BR (§2 "Formatação"), datas YYYYMMDD, escalas ----

  // h(tag, attrs, children): cria DOM sem innerHTML. "svg:circle" cria no namespace SVG.
  // attrs: class/className, style (string|objeto), text (textContent), dataset ({k:v}), onXxx (listener),
  //        true → atributo vazio, false/null/undefined → omitido (aria-* false vira "false").
  var SVG_NS = "http://www.w3.org/2000/svg";
  function h(tag, attrs, children){
    var isSvg = false;
    if(tag.indexOf("svg:")===0){ isSvg = true; tag = tag.slice(4); }
    var el = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
    if(attrs){
      for(var k in attrs){
        var v = attrs[k];
        if(v===null || v===undefined) continue;
        if(v===false){ if(k.indexOf("aria-")===0) el.setAttribute(k,"false"); continue; }
        if(k==="class" || k==="className"){ el.setAttribute("class", v); }
        else if(k==="style" && typeof v==="object"){ for(var p in v){ if(p.indexOf("--")===0) el.style.setProperty(p, String(v[p])); else el.style[p]=v[p]; } }
        else if(k==="text"){ el.textContent = v; }
        else if(k==="dataset" && typeof v==="object"){ for(var dk in v){ if(v[dk]!==null && v[dk]!==undefined) el.dataset[dk]=v[dk]; } }
        else if(k.indexOf("on")===0 && typeof v==="function"){ el.addEventListener(k.slice(2).toLowerCase(), v); }
        else if(v===true){ el.setAttribute(k, ""); }
        else { el.setAttribute(k, String(v)); }
      }
    }
    appendChildren(el, children);
    return el;
  }
  function appendChildren(el, children){
    if(children===null || children===undefined || children===false) return el;
    if(Array.isArray(children)){ children.forEach(function(c){ appendChildren(el, c); }); return el; }
    if(typeof Node!=="undefined" && children instanceof Node){ el.appendChild(children); return el; }
    el.appendChild(document.createTextNode(String(children)));
    return el;
  }
  function frag(children){ var f = document.createDocumentFragment(); appendChildren(f, children); return f; }
  // t`texto ${valor}` → DocumentFragment; valores viram nós de texto (nunca HTML), Nodes são anexados.
  function t(strings){
    var f = document.createDocumentFragment();
    for(var i=0;i<strings.length;i++){
      if(strings[i]) f.appendChild(document.createTextNode(strings[i]));
      if(i+1<arguments.length) appendChildren(f, arguments[i+1]);
    }
    return f;
  }
  function b(v){ return h("b", null, String(v)); }                 // número em negrito (textContent)
  function vtitle(title, max){                                     // «título de vídeo» truncado (48 + "…")
    var s = String(title||"").trim(); max = max||48;
    if(s.length>max) s = s.slice(0,max).replace(/\s+$/,"")+"…";

  function textOf(node){ var d = document.createElement("div"); d.appendChild(node.cloneNode(true)); return d.textContent; }
  function esc(s){ return (s===null || s===undefined) ? "" : escapeXml(s); }   // para templates mantidos por conveniência
  function safeThumb(url){ return (typeof url==="string" && /^https:\/\/i\.ytimg\.com\//.test(url)) ? url : ""; }   // miniatura só do YouTube
