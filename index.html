<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel VDP</title>
<link rel="icon" href="data:," />
<script data-theme-boot>(function(){try{var m=localStorage.getItem("vdp-theme-v1");if(m==="light"||m==="dark"){document.documentElement.setAttribute("data-theme",m);}else{document.documentElement.removeAttribute("data-theme");}}catch(e){}})();</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    color-scheme: light dark;
    /* pilhas de fonte (§5): Fraunces nunca em número; Inter proporcional em valores */
    --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:"Fraunces",Georgia,serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    /* superfícies e texto (§4.1) */
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-2:#eef1f6;
    --text:#161a22;
    --text-2:#3f4757;
    --text-muted:#626b7a;
    --border:#dbe1ea;
    --grid:#e6eaf0;
    --axis:#c9d1dc;
    --accent:#2f5fd6;
    --accent-soft:#e3ebfd;
    --good:#1f8a55;
    --good-soft:#e1f3ea;
    --bad:#c1443a;
    --deemph:#c3c9d3;
    --tip-bg:#ffffff;
    --flash:rgba(47,95,214,.16);
    --ring:var(--surface);
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 8px 24px rgba(20,30,50,.08);
    /* slots categóricos (§4.2) — identidade fixa por item (SERIES_SLOT), só marcas, nunca texto */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --s1-lt:#6da7ec;
    /* rampa sequencial (heatmap, baixo→alto) e ordinal (faixas etárias 45–54 → 65+) (§4.4) */
    --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
    --ord-1:#86b6ef; --ord-2:#3987e5; --ord-3:#184f95;
    /* status (fixos, nunca temáticos, sempre com ícone + rótulo) e delta (texto, sempre com glifo) */
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-critical:#d03b3b;
    --delta-up:#006300; --delta-down:#b3261e;
    --seq-ink:#ffffff; --ink-on-deemph:#161a22;
    /* raios, durações, curva (§4.4 / §14) */
    --r-sm:6px; --r:10px; --r-lg:14px;
    --d-micro:120ms; --d-std:180ms; --d-draw:520ms; --d-flash:900ms;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{ color-scheme:dark; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0f14;
      --surface:#12161d;
      --surface-2:#1a2029;
      --text:#e8ebf0;
      --text-2:#b4bcc9;
      --text-muted:#838d9c;
      --border:#232a35;
      --grid:#1f2630;
      --axis:#2c3441;
      --accent:#4d8dff;
      --accent-soft:#17233d;
      --good:#34b37a;
      --good-soft:#103524;
      --bad:#e2645a;
      --deemph:#3a4352;
      --tip-bg:#1a2029;
      --flash:rgba(77,141,255,.22);
      --ring:var(--surface);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
      --s1-lt:#86b6ef;
      --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
      --ord-1:#184f95; --ord-2:#3987e5; --ord-3:#86b6ef;
      --delta-up:#0ca30c; --delta-down:#e66767;
      --seq-ink:#0c0f14; --ink-on-deemph:#e8ebf0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0f14;
    --surface:#12161d;
    --surface-2:#1a2029;
    --text:#e8ebf0;
    --text-2:#b4bcc9;
    --text-muted:#838d9c;
    --border:#232a35;
    --grid:#1f2630;
    --axis:#2c3441;
    --accent:#4d8dff;
    --accent-soft:#17233d;
    --good:#34b37a;
    --good-soft:#103524;
    --bad:#e2645a;
    --deemph:#3a4352;
    --tip-bg:#1a2029;
    --flash:rgba(77,141,255,.22);
    --ring:var(--surface);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.4);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --s1-lt:#86b6ef;
    --seq-1:#184f95; --seq-2:#1c5cab; --seq-3:#256abf; --seq-4:#2a78d6; --seq-5:#3987e5; --seq-6:#5598e7; --seq-7:#86b6ef;
    --ord-1:#184f95; --ord-2:#3987e5; --ord-3:#86b6ef;
    --delta-up:#0ca30c; --delta-down:#e66767;
    --seq-ink:#0c0f14; --ink-on-deemph:#e8ebf0;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:clamp(10px,2vh,22px) clamp(12px,2.4vw,28px);
    gap:clamp(6px,1vh,10px);
  }
  @media (max-width:720px){
    body{ height:auto; min-height:100dvh; overflow:auto; }
  }

  /* chrome global (§6): linha 1 = wordmark · ferramentas · contagem de estágios; linha 2 = chips de frescor */
  .top{ display:flex; flex-direction:column; gap:3px; flex-shrink:0; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .wordmark{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:clamp(15px,1.9vw,20px);
    letter-spacing:.02em;
  }
  .wordmark b{ color:var(--accent); font-weight:700; }
  .wordmark-sub{ color:var(--text-muted); font-family:var(--font-mono); font-size:.7em; letter-spacing:.06em; font-weight:400; }
  .top-right{
    font-family:var(--font-mono);
    font-size:clamp(10px,1.1vw,12px);
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:right;
  }
  /* ⌘K (§6): botão existe desde já (a paleta chega na camada 5); ≤720px vira lupa de 44px */
  .palette-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); border-radius:999px;
    padding:3px 10px; min-height:24px; cursor:pointer; font-family:var(--font-mono); font-size:10.5px; line-height:1.4;
  }
  .palette-btn:hover{ color:var(--text); border-color:var(--accent); }
  .palette-btn kbd{ font:inherit; }
  .palette-btn .palette-ico{ display:none; width:18px; height:18px; }
  @media (max-width:720px){
    .palette-btn{ width:44px; height:44px; min-height:44px; padding:0; border-radius:50%; }
    .palette-btn kbd{ display:none; }
    .palette-btn .palette-ico{ display:block; }
  }
  /* chips de frescor (§6): ao vivo / atrasado / offline (botão = atualizar agora) · YouTube Analytics · Instagram (Metricool) */
  .fresh{
    list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; min-height:16px;
    font-family:var(--font-mono); font-size:10.5px; line-height:1.5; color:var(--text-muted);
  }
  .fresh li{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; min-width:0; }
  .fresh-btn{
    border:none; background:none; padding:1px 0; margin:0; color:inherit; font:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-sm);
  }
  .fresh-btn:hover{ color:var(--text); }
  .live-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--st-good); flex-shrink:0; animation:vdp-live 2s ease-in-out infinite; }
  .live-dot.off{ background:var(--text-muted); animation:none; }
  .st-warn{ color:var(--st-warn); }
  .st-critical{ color:var(--st-critical); }
  .fresh-error{ color:var(--text-2); }
  .fresh-retry{ border:1px solid var(--st-critical); background:none; color:var(--st-critical); border-radius:999px; padding:2px 9px; font:inherit; cursor:pointer; margin-left:4px; min-height:22px; }
  .fresh-retry:hover{ background:var(--surface-2); }
  @keyframes vdp-live{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  @media (max-width:720px){ .fresh li{ white-space:normal; } }

  .graph-toggle{
    display:flex; align-items:center; gap:8px;
    border:none; background:none; cursor:pointer; padding:2px 0;
    font-family:var(--font-mono); font-size:11px; color:var(--text-muted);
    flex-shrink:0;
  }
  .graph-toggle:hover{ color:var(--text); }
  .graph-toggle-track{
    width:34px; height:18px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--border); position:relative; flex-shrink:0; transition:background .15s ease;
  }
  .graph-toggle-thumb{
    position:absolute; top:1px; left:1px; width:14px; height:14px; border-radius:50%;
    background:var(--text-muted); transition:transform .15s ease, background .15s ease;
  }
  .graph-toggle[aria-pressed="true"] .graph-toggle-track{ background:var(--accent-soft); border-color:var(--accent); }
  .graph-toggle[aria-pressed="true"] .graph-toggle-thumb{ background:var(--accent); transform:translateX(16px); }

  .top-tools{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-left:auto; order:1; }
  .top-right{ order:2; }
  @media (max-width:720px){
    .top-right{ order:0; margin-left:auto; }                       /* contagem na linha do wordmark; ferramentas na 2ª linha */
    .top-tools{ flex-basis:100%; margin-left:0; order:3; }
  }

  /* Tema: segmented Auto / Claro / Escuro (§6) — role=radiogroup, 3 role=radio */
  .theme-toggle{
    display:inline-flex; align-items:center; gap:2px; padding:2px;
    border:1px solid var(--border); border-radius:999px; background:var(--surface-2); flex-shrink:0;
  }
  .theme-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    border:none; background:none; color:var(--text-muted); cursor:pointer;
    font-family:var(--font-mono); font-size:10.5px; line-height:1.4; padding:3px 9px; border-radius:999px;
    min-height:24px; transition:background var(--d-micro) var(--ease), color var(--d-micro) var(--ease);
  }
  .theme-btn:hover{ color:var(--text); }
  .theme-btn[aria-checked="true"]{ background:var(--accent-soft); color:var(--accent); }
  .theme-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  @media (max-width:720px){
    .theme-btn .theme-txt{ display:none; }
    .theme-btn{ padding:5px 8px; min-width:30px; min-height:28px; }
  }

  .card-items-preview{
    font-size:clamp(9.5px,.9vw,11px); color:var(--text-muted); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    flex:1; min-height:0;
  }
  .card-chip-row{
    --chip-lines:2;
    display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px;
    flex:1; min-height:0; overflow:hidden;
  }
  .card-chip{
    font-family:var(--font-mono); font-size:clamp(8.5px,.82vw,10px);
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:999px; padding:3px 8px; cursor:pointer; line-height:1.3; white-space:nowrap;
  }
  .card-chip:hover{ border-color:var(--accent); color:var(--text); }
  .card-chip.has-detail{ border-color:var(--accent); color:var(--accent); }
  .card-chip.more{ cursor:default; opacity:.7; }
  .card-chip.more:hover{ border-color:var(--border); color:var(--text-muted); }
  .card-chip{ display:inline-flex; align-items:center; }
  .card-chip[hidden]{ display:none; }
  .chip-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--k, var(--deemph)); margin-right:5px; flex-shrink:0; }
  .chip-ico{ width:10px; height:10px; margin-left:4px; flex-shrink:0; }
  /* linha-stat do card (§7.1): valor Inter 600 · delta mono em --delta-* · sparkline 72×18; rótulo da métrica com data (+ ⚠) */
  .card-stat{ display:flex; align-items:center; gap:8px; min-height:20px; }
  .card-stat-value{ font-family:var(--font-sans); font-weight:600; font-size:clamp(16px,1.6vw,20px); letter-spacing:-.01em; line-height:1.1; color:var(--text); white-space:nowrap; }
  .card-stat-delta{ font-family:var(--font-mono); font-size:clamp(9px,.85vw,10.5px); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .card-stat-delta.up{ color:var(--delta-up); }
  .card-stat-delta.down{ color:var(--delta-down); }
  .card-stat-spark{ margin-left:auto; line-height:0; flex-shrink:0; }
  .card-stat-empty{ font-size:clamp(10px,.9vw,11.5px); color:var(--text-muted); line-height:1.3; }
  .card-metric{ font-family:var(--font-mono); font-size:clamp(8.5px,.8vw,9.5px); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-pulse{ font-family:var(--font-sans); font-weight:500; font-size:clamp(10.5px,.85vw,11.5px); line-height:1.3; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-pulse b{ font-weight:700; }
  .card-pulse[hidden]{ display:none; }
  .pulse-glyph.up{ color:var(--delta-up); }
  .pulse-glyph.down{ color:var(--delta-down); }
  .pulse-glyph.warn{ color:var(--st-warn); }
  .pulse-glyph.zero{ color:var(--text-muted); }
  .card-graph{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px; min-height:0; }
  .card-graph svg{ color:var(--accent); width:100%; height:auto; display:block; }
  .card-graph-empty{ font-size:11px; color:var(--text-muted); font-style:italic; }
  .chart-legend{ display:flex; flex-wrap:wrap; gap:5px 10px; }
  .chart-legend-item{
    display:inline-flex; align-items:center; gap:4px;
    font-family:var(--font-mono); font-size:8.5px; color:var(--text-muted);
  }
  .chart-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:clamp(8px,1.3vw,14px);
  }
  @media (max-width:720px){
    .grid{ grid-template-columns:1fr 1fr; grid-template-rows:none; height:auto; }
    .grid > .card{ order:var(--num, 0); min-height:150px; }   /* decisão consciente (§16): hub primeiro, cartas 01→08 em ordem numérica */
    .grid > .hub{ grid-column:1 / -1; order:-1; }
  }
  @media (max-width:460px){
    .grid{ grid-template-columns:1fr; }
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:clamp(10px,1.3vw,16px);
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:0;
    overflow:hidden;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .num{
    font-family:var(--font-mono);
    font-size:clamp(10px,1vw,12px);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:4px;
    padding:1px 6px;
    flex-shrink:0;
  }
  .kicker{
    font-family:var(--font-mono);
    font-size:clamp(8.5px,.85vw,10px);
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-muted);
    text-align:right;
  }
  .name{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:clamp(13px,1.5vw,18px);
    line-height:1.15;
    text-wrap:balance;
  }
  .card-bottom{ margin-top:auto; display:flex; flex-direction:column; gap:5px; }
  .stage-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .stage-label{
    font-family:var(--font-mono);
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .items-count{
    font-family:var(--font-mono);
    font-size:clamp(9px,.9vw,11px);
    color:var(--text-muted);
  }
  .segbar{ display:flex; gap:3px; }
  .seg{ flex:1; height:5px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border); }
  .seg.on{ background:var(--accent); border-color:var(--accent); }
  .seg.on.done{ background:var(--good); border-color:var(--good); }

  .hub{
    background:radial-gradient(circle at 50% 35%, var(--accent-soft), var(--surface) 72%);
    border:1px solid var(--accent);
    align-items:center;
    text-align:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
  }
  .hub .wordmark2{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:clamp(20px,3vw,32px);
    letter-spacing:.01em;
  }
  .hub .wordmark2 .vdp{ color:var(--accent); }
  .hub .sub{
    font-family:var(--font-mono);
    font-size:clamp(9px,1vw,11px);
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .hub .legend{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px;
    font-family:var(--font-mono);
    font-size:clamp(9px,.85vw,10.5px);
    color:var(--text-muted);
  }
  .legend .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,20,.55);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .panel{
    width:min(560px,100%);
    max-height:88vh;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:clamp(18px,3vw,28px);
    box-shadow:var(--shadow);
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .panel-title{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .panel-title .num{ font-size:12px; }
  .panel-name{ font-family:var(--font-serif); font-weight:600; font-size:clamp(20px,3vw,26px); text-wrap:balance; }
  .panel-kicker{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase;
    letter-spacing:.09em; color:var(--accent); margin-top:2px;
  }
  .close-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .close-btn:hover{ border-color:var(--accent); }

  .section-label{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
    letter-spacing:.1em; color:var(--text-muted); margin:18px 0 8px;
  }
  .section-label:first-of-type{ margin-top:4px; }

  .stages{ display:flex; gap:6px; }
  .stage-btn{
    flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted);
    border-radius:8px; padding:8px 4px; cursor:pointer; text-align:center;
    font-family:var(--font-mono); font-size:10.5px; line-height:1.5;
  }

  /* ==== motor de gráficos (§12) ==== */
  .tip{
    position:fixed; z-index:200; pointer-events:none; max-width:min(320px,calc(100vw - 16px));
    background:var(--tip-bg); border:1px solid var(--border); border-radius:var(--r-sm); box-shadow:var(--shadow);
    padding:7px 9px; font-family:var(--font-mono); font-size:10px; line-height:1.45; color:var(--text);
  }
  .tip[hidden]{ display:none; }
  .tip.is-anchored{ max-width:none; }
  .tip-date{ color:var(--text-muted); margin-bottom:2px; white-space:nowrap; }
  .tip-row{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tip-key{ display:inline-block; width:12px; height:0; border-top:2px solid var(--k, var(--s1)); flex-shrink:0; }
  .tip-key.dash{ border-top-style:dashed; }
  .tip-key.none{ width:0; border:0; }
  .tip-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); }
  .tip-lbl{ color:var(--text-2); }
  .tip-grid{ display:grid; grid-template-columns:auto auto; gap:1px 10px; margin-top:5px; padding-top:5px; border-top:1px solid var(--grid); color:var(--text-muted); }
  .tip-gv{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-2); }
  .tip-note{ color:var(--text-2); margin-top:3px; white-space:pre-line; }
  .tip.is-anchored .tip-row{ white-space:normal; }

  .fig{ margin:0; padding:0; min-width:0; border-radius:var(--r); }
  .fig:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }
  .fig.is-cited{ box-shadow:0 0 0 2px var(--accent); transition:box-shadow var(--d-std) var(--ease); }
  .fig-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .fig-titles{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .fig-title{ font-family:var(--font-serif); font-weight:600; font-size:15.5px; line-height:1.2; color:var(--text); }
  .fig-kicker{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); }
  .fig-tools{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .fig-table-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); cursor:pointer;
    border-radius:999px; padding:4px 10px; font-family:var(--font-mono); font-size:10px; min-height:24px;
  }
  .fig-table-btn:hover{ border-color:var(--accent); color:var(--text); }
  .fig-table-btn[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .fig-chart{ min-width:0; }
  .fig-chart svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
  .fig-table-scroll{ overflow-x:auto; max-width:100%; }
  .fig-cap{ margin-top:8px; font-family:var(--font-sans); font-size:12.5px; line-height:1.45; color:var(--text-2); }
  .fig-cap b{ color:var(--text); font-weight:700; }
  .fig-foot{ margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .fig-empty{ font-size:12.5px; color:var(--text-muted); font-style:italic; padding:8px 0; }
  .fig-chart[hidden], .fig-table[hidden], .fig-cap[hidden]{ display:none; }

  /* marcas SVG: linhas 2px round, grade/eixo 1px sólidos, texto em tokens de texto (nunca a cor da série) */
  svg.chart text{ font-family:var(--font-mono); font-size:10px; fill:var(--text-muted); }
  svg.chart .tick{ font-family:var(--font-mono); font-size:10px; fill:var(--text-muted); font-variant-numeric:tabular-nums; }
  svg.chart .dlabel{ font-family:var(--font-sans); font-size:11px; font-weight:500; fill:var(--text-2); }
  svg.chart .gl{ stroke:var(--grid); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .axis{ stroke:var(--axis); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .guide{ stroke:var(--axis); stroke-width:1; }
  svg.chart .bracket{ stroke:var(--axis); stroke-width:1; fill:none; }
  svg.chart .mkr{ stroke:var(--ring); stroke-width:2; }
  svg.chart .col{ opacity:.9; }
  svg.chart .mk.hit{ outline:none; cursor:pointer; }
  svg.chart .mk.hit:focus-visible{ outline:2px solid var(--accent); }
  svg.chart .hit-col{ cursor:crosshair; }
  svg.chart .xh{ display:none; pointer-events:none; }
  svg.chart.is-xh .xh{ display:block; }
  svg.chart .xh-line{ stroke:var(--axis); stroke-width:1; shape-rendering:crispEdges; }
  svg.chart .xh-dot{ stroke:var(--ring); stroke-width:2; }
  svg.chart .ln.draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:vdp-draw var(--d-draw) ease-out forwards; }
  svg.chart .wash.wash-in{ opacity:0; animation:vdp-fade var(--d-std) ease-out 200ms forwards; }
  svg.chart .ln.fade-in{ opacity:0; animation:vdp-fade var(--d-draw) ease-out forwards; }
  @keyframes vdp-draw{ to{ stroke-dashoffset:0; } }
  @keyframes vdp-fade{ to{ opacity:1; } }
  .legend{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-family:var(--font-mono); font-size:10px; color:var(--text-2); }
  .lg{ display:inline-flex; align-items:center; gap:6px; }

  /* tabela-gêmea */

  /* C0 StatTile */
  .tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px 9px; display:flex; flex-direction:column; gap:3px; min-width:0; }

  .tile-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }

  .tile-trend{ display:block; line-height:0; flex-shrink:0; }
  .tile-delta{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); }
  .tile-delta.up{ color:var(--delta-up); }
  .tile-delta.down{ color:var(--delta-down); }
  .tile-delta-sfx{ color:var(--text-muted); }
  .tile-foot{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); }
  .tile-foot.warn{ color:var(--text-2); }
  .tile-foot.warn::before{ content:"⚠ "; color:var(--st-warn); }
  .spark{ display:block; overflow:visible; }

  /* C2 SparkRows (card em modo gráfico) */
  .spark-rows{ gap:3px; justify-content:flex-start; }
  .spark-row{
    display:grid; grid-template-columns:12px minmax(0,1fr) auto auto 72px; align-items:center; gap:6px;
    width:100%; border:none; background:none; padding:2px 0; cursor:pointer; text-align:left; color:inherit; font:inherit; border-radius:var(--r-sm); min-height:24px;
  }
  .spark-row:hover .spark-lbl{ color:var(--text); }
  .spark-key{ display:inline-block; width:10px; height:0; border-top:2px solid var(--k, var(--s1)); }
  .spark-key.dash{ border-top-style:dashed; }
  .spark-lbl{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .spark-val{ font-family:var(--font-sans); font-weight:600; font-size:12px; color:var(--text); white-space:nowrap; }
  .spark-delta{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); white-space:nowrap; }
  .spark-delta.up{ color:var(--delta-up); }

  var SNAPSHOT_ROWS = {};

  // ---- utilidades: DOM seguro, formatação pt-BR (§2 "Formatação"), datas YYYYMMDD, escalas ----

  // h(tag, attrs, children): cria DOM sem innerHTML. "svg:circle" cria no namespace SVG.
  // attrs: class/className, style (string|objeto), text (textContent), dataset ({k:v}), onXxx (listener),
  //        true → atributo vazio, false/null/undefined → omitido (aria-* false vira "false").
  var SVG_NS = "http://www.w3.org/2000/svg";
  function h(tag, attrs, children){
    var isSvg = false;
    if(tag.indexOf("svg:")===0){ isSvg = true; tag = tag.slice(4); }
    var el = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
    if(attrs){
      for(var k in attrs){
        var v = attrs[k];
        if(v===null || v===undefined) continue;
        if(v===false){ if(k.indexOf("aria-")===0) el.setAttribute(k,"false"); continue; }
        if(k==="class" || k==="className"){ el.setAttribute("class", v); }
        else if(k==="style" && typeof v==="object"){ for(var p in v){ el.style[p]=v[p]; } }
        else if(k==="text"){ el.textContent = v; }
        else if(k==="dataset" && typeof v==="object"){ for(var dk in v){ if(v[dk]!==null && v[dk]!==undefined) el.dataset[dk]=v[dk]; } }
        else if(k.indexOf("on")===0 && typeof v==="function"){ el.addEventListener(k.slice(2).toLowerCase(), v); }
        else if(v===true){ el.setAttribute(k, ""); }
        else { el.setAttribute(k, String(v)); }
      }
    }
    appendChildren(el, children);
    return el;
  }
  function appendChildren(el, children){
    if(children===null || children===undefined || children===false) return el;
    if(Array.isArray(children)){ children.forEach(function(c){ appendChildren(el, c); }); return el; }
    if(typeof Node!=="undefined" && children instanceof Node){ el.appendChild(children); return el; }
    el.appendChild(document.createTextNode(String(children)));
    return el;
  }
  function frag(children){ var f = document.createDocumentFragment(); appendChildren(f, children); return f; }
  // t`texto ${valor}` → DocumentFragment; valores viram nós de texto (nunca HTML), Nodes são anexados.
  function t(strings){
    var f = document.createDocumentFragment();
    for(var i=0;i<strings.length;i++){
      if(strings[i]) f.appendChild(document.createTextNode(strings[i]));
      if(i+1<arguments.length) appendChildren(f, arguments[i+1]);
    }
    return f;
  }
  function b(v){ return h("b", null, String(v)); }                 // número em negrito (textContent)
  function vtitle(title, max){                                     // «título de vídeo» truncado (48 + "…")
    var s = String(title||"").trim(); max = max||48;
    if(s.length>max) s = s.slice(0,max).replace(/\s+$/,"")+"…";
    return document.createTextNode("«"+s+"»");
  }
  function textOf(node){ var d = document.createElement("div"); d.appendChild(node.cloneNode(true)); return d.textContent; }
  function esc(s){ return (s===null || s===undefined) ? "" : escapeXml(s); }   // para templates mantidos por conveniência
  function safeThumb(url){ return (typeof url==="string" && /^https:\/\/i\.ytimg\.com\//.test(url)) ? url : ""; }   // miniatura só do YouTube
  function thumbHtml(url, cls){

  function isNum(v){ return typeof v==="number" && isFinite(v); }
  function toNum(v){ if(typeof v==="string" && v.trim()!=="") v = parseFloat(v); return isNum(v) ? v : null; }
  function fmtDate(ts){
    if(!ts) return "—";
    try{
      var d = new Date(ts);
      return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}) + " · " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return "—"; }
  }
  function fmtNumber(v){ v = toNum(v); if(v===null) return "—"; return Math.round(v).toLocaleString("pt-BR"); }
  function fmtDec(v, places){
    v = toNum(v); if(v===null) return "—";
    return v.toLocaleString("pt-BR",{minimumFractionDigits:places, maximumFractionDigits:places});
  }
  function trimDec(s){ return String(s).replace(/,0$/,""); }
  function fmtCompact(v){                                          // ≥100.000 → "128,4 mil" · ≥1.000.000 → "1,2 mi" (tiles/herói/frases)
    v = toNum(v); if(v===null) return "—";
    var a = Math.abs(v);
    if(a>=1e6) return trimDec(fmtDec(v/1e6,1))+" mi";
    if(a>=1e5) return trimDec(fmtDec(v/1e3,1))+" mil";
    return fmtNumber(v);
  }
  function fmtPct(ratio, places){ ratio = toNum(ratio); if(ratio===null) return "—"; return fmtDec(ratio*100, places==null?1:places)+"%"; }   // 0.619 → "61,9%"
  function fmtPctSentence(ratio){                                  // ≥10 sem decimal ("62%"), <10 uma casa ("8,3%")
    ratio = toNum(ratio); if(ratio===null) return "—";
    var p = ratio*100;
    return (Math.abs(p)>=10 ? fmtDec(p,0) : fmtDec(p,1))+"%";
  }
  function fmtMinutes(min){ min = toNum(min); if(min===null) return "—"; return min>=600 ? trimDec(fmtDec(min/60,1))+" h" : fmtNumber(min)+" min"; }
  function fmtSeconds(s){ s = toNum(s); if(s===null) return "—"; return fmtNumber(s)+" s"; }
  function fmtCurrency(v){ try{ return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }catch(e){ return "R$ "+v; } }
  function fmtRatioX(v){ v = toNum(v); if(v===null) return "—"; return fmtDec(v,1)+"×"; }
  function deltaDir(v){ v = toNum(v); return (v===null || v===0) ? "zero" : (v>0 ? "up" : "down"); }
  function deltaGlyph(v){ var d = deltaDir(v); return d==="up" ? "▲" : (d==="down" ? "▼" : "•"); }
  function fmtSigned(v, fmt){                                      // "+26" · "−3" · "0"
    v = toNum(v); if(v===null) return "—";
    var s = (fmt||fmtNumber)(Math.abs(v));
    return v>0 ? "+"+s : (v<0 ? "−"+s : s);
  }
  function fmtDelta(v, fmt){ v = toNum(v); if(v===null) return "—"; return deltaGlyph(v)+" "+fmtSigned(v, fmt); }   // "▲ +26" · "▼ −3" · "• 0"
  function fmtDeltaNamed(d, opts){                                 // d = deltaNamed(...) → "▲ +26 (+3,6%) desde 11/09" · "sem variação desde 21/09"
    if(!d) return "• sem histórico ainda";
    if(d.abs===0) return "sem variação desde "+fmtDateDM(d.since);
    var s = fmtDelta(d.abs, opts && opts.fmt);
    if(d.pct!==null && d.pct!==undefined && !(opts && opts.noPct)) s += " ("+fmtSigned(d.pct*100, function(x){ return fmtDec(x,1); })+"%)";
    return s+" desde "+fmtDateDM(d.since);
  }
  function formatMetricValue(def, v){
    if(v===null || v===undefined) return "—";
    if(def.currency) return fmtCurrency(v);
    if(def.isPercent) return fmtDec(v,1)+"%";
    return fmtNumber(v);
  }

  // datas: o JSON traz "YYYYMMDD"; "hoje" = data local do navegador
  var MONTHS_SHORT   = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var WEEKDAY_SHORT  = ["seg","ter","qua","qui","sex","sáb","dom"];                         // índice ISO: 0=seg … 6=dom
  var WEEKDAY_LONG   = ["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
  var WEEKDAY_PLURAL = ["segundas","terças","quartas","quintas","sextas","sábados","domingos"];
  var WEEKDAY_ART    = ["a","a","a","a","a","o","o"];                                        // "a terça" · "o domingo"
  function pad2(n){ return (n<10?"0":"")+n; }
  function ymdParts(ymd){ ymd = String(ymd); return { y:+ymd.slice(0,4), m:+ymd.slice(4,6), d:+ymd.slice(6,8) }; }
  function ymdToDate(ymd){ var p = ymdParts(ymd); return new Date(p.y, p.m-1, p.d); }
  function dateToYmd(d){ return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
  function ymdToDays(ymd){ var p = ymdParts(ymd); return Math.round(Date.UTC(p.y, p.m-1, p.d)/864e5); }
  function daysToYmd(days){ var d = new Date(days*864e5); return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate()); }
  function addDays(ymd, n){ return daysToYmd(ymdToDays(ymd)+n); }
  function daysBetween(a, b){ return ymdToDays(b)-ymdToDays(a); }                            // b − a (em dias)
  function todayYmd(){ return dateToYmd(new Date()); }
  function isoWeekday(ymd){ return (ymdToDate(ymd).getDay()+6)%7; }                          // 0=seg … 6=dom
  function fmtDateDM(ymd){ if(!ymd) return "—"; ymd = String(ymd); return ymd.slice(6,8)+"/"+ymd.slice(4,6); }
  function fmtDateShort(ymd){ return fmtDateDM(ymd); }
  function fmtDateRange(a, b){                                     // "13 a 19/09" · "27/08 a 02/09"
    if(!a || !b) return "—";
    if(a===b) return fmtDateDM(a);
    a = String(a); b = String(b);
    return (a.slice(4,6)===b.slice(4,6) ? a.slice(6,8) : fmtDateDM(a))+" a "+fmtDateDM(b);
  }
  function fmtWeekLabel(a, b){                                     // "24–30/08" · "31/08–06/09"
    a = String(a); b = String(b);
    if(a===b) return fmtDateDM(a);
    return (a.slice(4,6)===b.slice(4,6) ? a.slice(6,8) : fmtDateDM(a))+"–"+fmtDateDM(b);
  }
  function fmtMonth(m){                                            // "2026-09" → "set/26"
    var mm = String(m||"").match(/^(\d{4})-(\d{2})/);
    if(!mm) return String(m||"—");
    return MONTHS_SHORT[+mm[2]-1]+"/"+mm[1].slice(2);
  }
  function monthLabel(m){ return fmtMonth(m); }
  function weekdayName(iso, style){                                // style: "short" (padrão) | "long" | "plural"
    var arr = style==="long" ? WEEKDAY_LONG : (style==="plural" ? WEEKDAY_PLURAL : WEEKDAY_SHORT);
    return arr[((iso%7)+7)%7];
  }
  function capFirst(s){ s = String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
  function hhmm(iso){ try{ var d = new Date(iso); if(isNaN(d.getTime())) return "—"; return pad2(d.getHours())+":"+pad2(d.getMinutes()); }catch(e){ return "—"; } }
  function fmtStamp(iso){                                          // "22/09 17:00"
    try{ var d = new Date(iso); if(isNaN(d.getTime())) return "—"; return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" "+hhmm(iso); }catch(e){ return "—"; }
  }
  function median(arr){ var a = arr.slice().sort(function(x,y){ return x-y; }); if(!a.length) return null; var m = a.length>>1; return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }

  // ticks "bonitos" 1/2/5×10^k, no máximo n (padrão 4)
  function niceStep(raw){
    if(!(raw>0)) return 1;
    var exp = Math.floor(Math.log10(raw)), base = Math.pow(10, exp), f = raw/base;
    return (f<=1 ? 1 : (f<=2 ? 2 : (f<=5 ? 5 : 10)))*base;
  }
  function nextNice(step){
    var exp = Math.floor(Math.log10(step)+1e-9), base = Math.pow(10, exp), m = Math.round(step/base);
    return (m===1 ? 2 : (m===2 ? 5 : 10))*base;
  }
  function niceTicks(min, max, n){
    n = n||4;
    min = toNum(min); max = toNum(max);
    if(min===null || max===null) return [];
    if(max<min){ var tmp = min; min = max; max = tmp; }
    if(max===min) return [min];
    var step = niceStep((max-min)/(n*2)), ticks = [];
    for(var guard=0; guard<14; guard++){
      ticks = [];
      var start = Math.ceil(min/step-1e-9)*step, end = Math.floor(max/step+1e-9)*step;
      for(var v=start; v<=end+step*1e-9; v+=step) ticks.push(+(Math.round(v/step)*step).toFixed(10));
      if(ticks.length<=n) break;
      step = nextNice(step);
    }
    return ticks;
  }
  // escala X por data (§12.0): x = padL + (dias(d) − dias(min))/(dias(max) − dias(min)) · plotW; max===min → centro
  function xScaleByDate(minYmd, maxYmd, padL, plotW){
    var d0 = ymdToDays(minYmd), d1 = ymdToDays(maxYmd), span = d1-d0;
    return function(ymd){ return span>0 ? padL+(ymdToDays(ymd)-d0)/span*plotW : padL+plotW/2; };
  }
  // reamostra n índices igualmente espaçados incluindo o primeiro e o último (sparklines C1)
  function resample(points, n){
    if(!points || points.length<=n) return (points||[]).slice();
    var out = [], last = points.length-1;
    for(var i=0;i<n;i++) out.push(points[Math.round(i*last/(n-1))]);
    return out;
  }

  // ---- home (§7): grade 3×3 em ordem de relógio (LAYOUT); a grade re-renderiza inteira (edição, refetch, modo gráfico) mantendo o foco ----

  function renderGrid(){

  // chip de item (§7.1): ponto 6px na cor do slot quando conectado; has-detail = ícone SVG (linha com marcador) + aria-label "Abrir painel de …"

  function fmtBRLCard(v){                                          // "R$ 1.200" (inteiro) · "R$ 1.234,50" — só na linha-stat do card

  function frontLatestRevenue(key){                                // {month, total} do mês mais recente com lançamento, ou null

  function chipLines(row){ var v = parseInt(getComputedStyle(row).getPropertyValue("--chip-lines"), 10); return (isFinite(v) && v>0) ? v : 2; }
  function fitChips(row){
    var chips = Array.prototype.slice.call(row.querySelectorAll(".card-chip[data-item]"));
    var more = row.querySelector(".card-chip.more"); if(more) more.remove();
    chips.forEach(function(c){ c.hidden = false; });
    if(!chips.length) return;
    var maxLines = chipLines(row), hidden = [], rowTop = row.offsetTop, avail = row.clientHeight;
    function top(c){ return c.offsetTop-rowTop; }
    var lines = []; chips.forEach(function(c){ var t0 = top(c); if(lines.indexOf(t0)<0) lines.push(t0); }); lines.sort(function(a, b){ return a-b; });
    var limitTop = lines[Math.min(maxLines, lines.length)-1];
    function overflowing(c){ return top(c)>limitTop+1 || top(c)+c.offsetHeight>avail+1; }
    for(var i=chips.length-1;i>=0;i--){ if(overflowing(chips[i])){ chips[i].hidden = true; hidden.unshift(chips[i]); } }
    if(!hidden.length) return;
    more = h("span", { class:"card-chip more" }); row.appendChild(more);
    function label(){ var names = hidden.map(function(c){ return c.textContent.trim(); }).join(", "); more.textContent = "+"+hidden.length; more.title = names; more.setAttribute("aria-label", "mais "+hidden.length+(hidden.length===1 ? " item: " : " itens: ")+names); }

    }

  // Slot categórico FIXO por item (§4.2). Nunca calculado por posição/filtro/ordem.

  var SERIES_SLOT = { "2.2":1, "2.1":2, "1.2":3, "8.1":4, "8.2":5, "8.3":6 };
  function slotFor(itemId){ return SERIES_SLOT[itemId] || null; }

  function seqStep(v, min, max){ return Math.min(6, Math.floor((v-min)/(max-min+1e-9)*7)); }   // heatmap: 0..6

  function deltaNamed(pts, days){                                  // ref = último ponto com d ≤ last.d − days; senão o primeiro

  function flowWindow(rows, N){                                    // cur = (lastDate−N, lastDate] · prev = (lastDate−2N, lastDate−N]

  // ---- C1 Sparkline: 72×18 (cards/linhas) ou 120×28 (ranking); 1,6px; 12 pontos reamostrados; sem eixos, sem tooltip ----
  function sparklineSvg(points, o){                                // o: {w,h,color,windowFrom,dash,dotR,stroke}
    o = o||{};

        body += svgEl("polyline", Object.assign({ points:pl(xy), stroke:"var(--deemph)" }, lineAttrs));
        if(wi>0) body += svgEl("polyline", Object.assign({ points:pl(xy.slice(wi-1)), stroke:color }, lineAttrs));

  }

  // ---- C2 SparkRows (card em modo gráfico, §7.2): uma linha por série de frontSeries(f), máx. 4; cada linha é um botão → rota do item ----

  // ---- C3 SmallMultiples: "mini+" 260×110 (2 ticks Y à direita, 3 ticks X, rótulo de fim, crosshair sincronizado) · "mini" 200×70 (rótulo no pico) ----

  // ---- C4 DailyChart (§12 C4): 1 série --s1 + wash; período anterior --deemph 1,5px deslocado N dias; ticks X a cada ceil(dias/6); máximo anotado; lacunas ----
  // o: {id, title, kicker, source, points, prev (pontos crus da janela anterior), N, label, unit, fmt, stock, showPrev, grid(date)→[{label,value}], w, h, caption, table, prevRange, curRange, drawIn, minHit}

      var days = daysBetween(xd[0], xd[1])+1, nx = mob ? 3 : Math.min(7, Math.max(2, Math.ceil(days/Math.max(1, Math.ceil(days/6)))+1));

      var lc = lineChartSvg({ w:w, h:hh, padL:padL, padR:padR, padT:o.stock ? 16 : 26, padB:22, xDomain:xd, series:series, zero:!o.stock, yTicks:"left", xTicks:nx, fmt:fmt, drawIn:o.drawIn, minHit:o.minHit,
        annotateMax: !o.stock && pts.length>1 ? { text:null } : null,

      rows:pts.map(function(p){ var pv = prevByDate[p.date]; return [weekdayName(isoWeekday(p.date))+" "+fmtDateDM(p.date), fmt(p.value)].concat(prevPts.length ? [pv ? fmt(pv.value)+" ("+fmtDateDM(pv.orig)+")" : ""] : []); }) });

  // ---- C11 VideoDaily: C4 de 1 série com pico anotado + colchete 1px --axis com serifas do 1º dia até day90 ("90% das views em N dias") ----

  // ---- C5 Heatmap (grade CSS, não SVG): 7 colunas × N semanas; rampa --seq-1..7; rótulo SÓ na célula máxima; null = --surface-2 + borda; legenda 7 degraus ----

    if(!first || !last){ weeks.forEach(function(wk){ wk.cells.forEach(function(v, i){ if(v===null) return; var d = addDays(wk.start, i); if(!first || d<first) first = d; if(!last || d>last) last = d; }); }); }

    var body = weeks.map(function(wk){

      }).join("");

    }).join("");

    return figure({ id:o.id, title:o.title, kicker:o.kicker, source:o.source, body:grid, table:table, caption:o.caption, showTitle:o.showTitle, cls:"fig-heat" });

  // ---- C6 WeekdayColumns: 7 colunas ≤20px, ponta arredondada; melhor dia --s1, demais --deemph; valor só na ponta da máxima; sem legenda ----

    o = o||{};
    var w = o.w || 300, hh = o.h || 150, fmt = o.fmt || fmtNumber, padL = 8, padR = 8, padT = 22, padB = 22, plotW = w-padL-padR, plotH = hh-padT-padB, base = padT+plotH;

  // ---- C12 MonthlyColumns: colunas ≤24px --s1, ponta arredondada, meses com lançamento (até 12), valor só na última, ticks Y em R$ curtos, tooltip com breakdown por frente ----
  function fmtBRLShort(v){ v = toNum(v); if(v===null) return "—"; var a = Math.abs(v); if(a>=1e6) return "R$ "+trimDec(fmtDec(v/1e6, 1))+" mi"; if(a>=1e3) return "R$ "+trimDec(fmtDec(v/1e3, 1))+" mil"; return "R$ "+fmtDec(v, 0); }

    if(!hubLiveEl){ hubLiveEl = h("div", { class:"sr-only", "aria-live":"polite", id:"hubLive" }); document.body.appendChild(hubLiveEl); }
    return announceEl;
  }
  function announce(msg){ var el = ensureAnnounce(); el.textContent = ""; el.textContent = msg; clearTimeout(announceTimer); announceTimer = setTimeout(function(){ el.textContent = ""; }, 5000); }
  function simulateRefetch(data){                                  // testes: mesmo caminho do refetch, com dados fornecidos (null/Error → falha)
    return refreshMetrics(true, function(){ return (data===null || data===undefined || data instanceof Error) ? Promise.reject(data || new Error("simulated")) : Promise.resolve(data); });
  }
  document.addEventListener("visibilitychange", function(){         // aba oculta: pausa; ao voltar, atualiza se a última checagem tem > 60 s
    if(document.hidden){ clearTimeout(pollTimer); pollTimer = null; return; }
    var since = Date.now()-lastCheck;
    if(!metricsGeneratedAt || since>60000) refreshMetrics(false); else schedule(Math.max(1000, pollDelay()-since));
  });

  // ---- chips de frescor (§6): estado ao vivo (botão = atualizar agora) · YouTube Analytics · Instagram (Metricool); boot sem JSON → chip crítico ----
  function currentLiveState(){ return liveOverride || liveState(); }
  function stampFor(iso){ try{ return dateToYmd(new Date(iso))===todayYmd() ? hhmm(iso) : fmtStamp(iso); }catch(e){ return fmtStamp(iso); } }
  function renderFreshChips(){
    var ul = document.getElementById("fresh"); if(!ul) return;
    var hadFocus = !!(document.activeElement && ul.contains(document.activeElement));   // o botão é reconstruído: devolve o foco
    ul.textContent = "";
    var checked = lastCheck ? " · checado "+hhmm(new Date(lastCheck)) : "";
    if(!metricsGeneratedAt){
      ul.appendChild(h("li", { class:"fresh-error", title:"O painel tentou ler data/metrics.json e não conseguiu"+checked+". Os números aparecem assim que a leitura funcionar." }, [
        h("span", { class:"st-critical", "aria-hidden":"true", text:"⚠" }),
        h("span", { text:metricsDataLoaded ? "data/metrics.json sem leitura do bot — mostrando o painel sem métricas" : "não consegui carregar data/metrics.json — mostrando o painel sem métricas" }),
        h("button", { type:"button", class:"fresh-retry", text:"tentar de novo", onClick:function(){ refreshMetrics(true); } })
      ]));
      if(hadFocus){ try{ ul.querySelector(".fresh-retry").focus({ preventScroll:true }); }catch(e){} }
      return;
    }
    var st = currentLiveState(), fr = freshness(), gen = metricsGeneratedAt, stamp = stampFor(gen), full = fmtStamp(gen);
    var btn = h("button", { type:"button", class:"fresh-btn", id:"freshLive", "data-live":st });
    if(st==="live"){ btn.appendChild(h("i", { class:"live-dot", "aria-hidden":"true" })); btn.appendChild(document.createTextNode("ao vivo "+hhmm(gen)+" · bot a cada 5 min")); }
    else if(st==="late"){ btn.appendChild(h("span", { class:"st-warn", "aria-hidden":"true", text:"▲" })); btn.appendChild(document.createTextNode("atrasado · dados de "+stamp)); }
    else { btn.appendChild(h("i", { class:"live-dot off", "aria-hidden":"true" })); btn.appendChild(document.createTextNode("offline · última leitura "+stamp)); }
    btn.appendChild(h("span", { class:"sr-only", text:" · atualizar agora" }));
    var why = st==="live" ? "O bot leu os inscritos há menos de 15 min."
      : (st==="late" ? "A última leitura do bot tem mais de 15 min. O bot grava a cada 5 min, mas o CDN do GitHub Pages pode segurar até ~10 min."
      : "Não consegui buscar data/metrics.json agora; os números são da última leitura que funcionou.");
    btn.title = "Última leitura do bot: "+full+checked+". "+why+" Clique para atualizar agora.";
    btn.addEventListener("click", function(){ refreshMetrics(true); });
    ul.appendChild(h("li", null, btn));
    if(hadFocus){ try{ btn.focus({ preventScroll:true }); }catch(e){} }
    if(fr.yt){
      var lag = fr.yt.lagDays;
      ul.appendChild(h("li", { title:"Views, tempo assistido e interações vêm do YouTube Analytics, que libera os dados com 2–3 dias de atraso. Último dia disponível: "+fr.yt.label+"." },
        "YouTube Analytics · até "+fr.yt.label+" · defasagem "+lag+" "+(lag===1 ? "dia" : "dias")));
    }
    if(fr.ig){
      var stale = fr.ig.staleDays>3;
      var li = h("li", { title:"Seguidores e métricas do Instagram entram por coleta manual no Metricool. Última leitura: "+fr.ig.label+"."+(stale ? " Já são "+fr.ig.staleDays+" dias sem leitura nova." : "") }, "Instagram (Metricool) · "+fr.ig.label);
      if(stale){ li.appendChild(document.createTextNode(" · ")); li.appendChild(h("span", { class:"st-warn" }, "⚠ "+fr.ig.staleDays+" dias sem leitura")); }
      ul.appendChild(li);
    }
  }
  setInterval(function(){ if(!document.hidden && metricsGeneratedAt && !refetching) renderFreshChips(); }, 60000);   // "ao vivo" vira "atrasado" sozinho após 15 min

      return '<button class="leader-row" data-video="'+esc(v.id)+'">' +
        thumbHtml(v.thumb, "leader-thumb") +
        '<span class="leader-info"><span class="leader-title">'+esc(v.title)+'</span><span class="leader-value">'+fmtNumber(v[field])+' · '+label+'</span></span>' +

  function renderTrafficSide(itemId){

    var rows = info.traffic.map(function(tr){
      return '<div class="evo-row" style="grid-template-columns:1fr auto;"><span class="evo-item">'+esc(tr.label)+'</span><span class="evo-value">'+fmtNumber(tr.views)+'</span></div>';

  function renderAudienceSide(itemId){
    var a = AUDIENCE_INFO[itemId];
    if(!a) return "";
    var blocks = [];
    if(a.ageGender && a.ageGender.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Público (idade e gênero)</div><div class="evo-list">' +
        renderAudienceGroup(a.ageGender, function(r){ return r.pct.toFixed(1).replace(".",",")+"%"; }) + '</div></div>');
    }
    if(a.countries && a.countries.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Países</div><div class="evo-list">' +
        renderAudienceGroup(a.countries, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    if(a.device && a.device.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Dispositivo</div><div class="evo-list">' +
        renderAudienceGroup(a.device, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }
    if(a.playbackLocation && a.playbackLocation.length){
      blocks.push('<div><div class="section-label" style="margin-top:0;">Onde assistiram</div><div class="evo-list">' +
        renderAudienceGroup(a.playbackLocation, function(r){ return fmtNumber(r.views); }) + '</div></div>');
    }

        renderAudienceGroup(a.subscriptionStatus, function(r){ return fmtNumber(r.views); }) + '</div></div>');

  function renderDetailPanel(item, metricsDef, parsed, activeIdx, frontKey){
    var frontName = (state.fronts[frontKey]||{}).name || frontKey;
    var bc = breadcrumbHtml([
      {label:"Início"}, {label:frontName}, {label:item.label}
    ]);
    var tabs = metricsDef.map(function(def,i){
      return '<button class="detail-tab'+(i===activeIdx?" active":"")+'" data-idx="'+i+'">'+esc(def.label)+'</button>';
    }).join("");
    var def = metricsDef[activeIdx];
    var m = parsed[activeIdx];
    var deltaHtml = "";
    if(m.delta!==null && m.delta!==0){
      var cls = m.delta>=0 ? "up" : "down";
      var sign = m.delta>=0 ? "+" : "";
      deltaHtml = '<span class="delta metric-delta '+cls+'">'+sign+formatMetricValue(def, m.delta)+' em 30 dias</span>';
    }
    var sideParts = [renderLeaderboard(item.id, def.field, def.label), renderTrafficSide(item.id), renderAudienceSide(item.id)].filter(Boolean);
    var sideCol = sideParts.length ? '<div class="detail-side">'+sideParts.join("")+'</div>' : "";

    var sourceLabel = (item.source && item.source.detailSourceLabel) || "Metricool";
    // C4 DailyChart: série ativa + tooltip com as outras métricas do dia (§10.1.7); estoque (inscritos totais) liga leituras consecutivas
    var chartW = (sideParts.length && !isMobile()) ? Math.floor((availPanelWidth("full")-24)*0.6) : availPanelWidth("full");
    var others = parsed.map(function(mm, i){ return { def:metricsDef[i], m:mm }; }).filter(function(x, i){ return i!==activeIdx; });
    var chart = dailyChart({ id:"fig-daily", title:def.label, source:sourceLabel+(m.points.length ? " · "+fmtDateShort(m.points[0].date)+" – "+fmtDateShort(m.points[m.points.length-1].date) : ""),
      points:m.points, label:def.label, unit:def.label.toLowerCase(), fmt:function(v){ return formatMetricValue(def, v); }, stock:!!def.stock || def.field==="IGEV01",
      w:chartW, h:isMobile() ? 200 : 260, showTitle:false, drawIn:shouldDrawIn(),
      grid:function(date){ return others.map(function(x){ var p = x.m.points.filter(function(pp){ return pp.date===date; })[0]; return p ? { label:x.def.label, value:formatMetricValue(x.def, p.value) } : null; }).filter(Boolean); } });
    var mainCol =
      '<div><div class="detail-stat"><span class="big">'+formatMetricValue(def, m.value)+'</span>'+deltaHtml+'</div>' +
      '<div class="detail-period">'+(m.points.length ? fmtDateShort(m.points[0].date)+' – '+fmtDateShort(m.points[m.points.length-1].date) : "sem histórico no período")+'</div>' +
      '<div class="chart-wrap">'+chart+'</div></div>';
    return bc + '<div class="panel-head">' +

        '<button class="back-btn" id="backBtn" aria-label="Voltar">←</button>' +
        '<div style="min-width:0;"><div class="panel-name">'+esc(item.label)+'</div><div class="panel-kicker">'+esc(item.id)+' · via '+esc(sourceLabel)+'</div></div>' +
      '</div>' +
      '<button class="close-btn" id="closeBtn">×</button>' +
    '</div>' +
    '<div class="detail-tabs">'+tabs+'</div>' +
    '<div class="detail-grid'+(sideCol?"":" single")+'" id="detailBody">'+mainCol+sideCol+'</div>';

  function wireDetail(frontKey, item, metricsDef, parsed, activeIdx){
    wireBreadcrumb(panel, [
      {onClick:function(){ go(""); }},
      {onClick:function(){ go("#/p/"+frontKey); }}
    ]);
    document.getElementById("closeBtn").addEventListener("click", function(){ go(""); });
    document.getElementById("backBtn").addEventListener("click", function(){ go("#/p/"+frontKey); });
    Array.prototype.forEach.call(panel.querySelectorAll(".detail-tab"), function(btn){

        var idx = parseInt(btn.getAttribute("data-idx"),10);
        VIEW.item = item.id; VIEW.idx = idx;
        openModal(renderDetailPanel(item, metricsDef, parsed, idx, frontKey), "full");

      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".leader-row"), function(btn){

      });

  function openMetricDetail(frontKey, itemId, keep){               // keep = re-render em lugar: mantém a métrica ativa (VIEW.idx) e o vídeo aberto (VIEW.video)
    var f = state.fronts[frontKey];
    var item = f.items.find(function(x){ return x.id===itemId; });
    if(!item || !item.source) return;
    if(!keep || VIEW.item!==itemId){ VIEW.item = itemId; VIEW.idx = 0; VIEW.video = null; }
    var metricsDef = (item.source.detailMetrics || item.source.metrics).slice();
    var rows = DETAIL_ROWS[itemId] || SNAPSHOT_ROWS[itemId] || [];
    var parsed = parseMetricRows(rows, metricsDef);
    var subKey = item.source.subscriberSnapshotKey;
    if(subKey){                                                    // inscritos totais = subsSeries (YTEV01 ∪ leitura ao vivo do bot), não só a última leitura
      var sp = subsSeries(item);
      if(sp.length){
        var subDef = {field:"subs", label:"Inscritos totais", stock:true};
        metricsDef = [subDef].concat(metricsDef);
        parsed = [{ label:subDef.label, currency:false, isPercent:false, value:sp[sp.length-1].value, delta:sp[sp.length-1].value-sp[0].value, points:sp }].concat(parsed);
      }
    }
    var idx = Math.max(0, Math.min(VIEW.idx, metricsDef.length-1));
    if(keep && VIEW.video){
      var vid = (ITEM_VIDEOS[item.id]||[]).find(function(v){ return v.id===VIEW.video; });
      if(vid){ openVideoDetail(frontKey, item, metricsDef, parsed, idx, VIEW.video); return; }
      VIEW.video = null;
    }
    openModal(renderDetailPanel(item, metricsDef, parsed, idx, frontKey), "full");
    wireDetail(frontKey, item, metricsDef, parsed, idx);
  }

  function openVideoDetail(frontKey, item, metricsDef, parsed, activeIdx, videoId){

  // ---- overview: frentes / evolução / financeiro (tabbed) ----

  var OVERVIEW_TABS = [
    {key:"fronts", label:"Frentes"},
    {key:"evo", label:"Evolução"},
    {key:"fin", label:"Financeiro"}
  ];

  function renderFrontsTab(){
    var arr = frontsAsArray();
    return '<div class="overview-table">' + arr.map(function(f){
      var bar = '<div class="ov-bar">' + STAGES.map(function(s,i){
        var on = i<=f.stage;
        return '<div class="seg '+(on?"on "+(f.stage>=3?"done":""):"")+'"></div>';
      }).join("") + '</div>';
      return '<div class="ov-row" data-key="'+esc(f.key)+'">' +
        '<span class="ov-num">'+String(f.num).padStart(2,"0")+'</span>' +
        '<span class="ov-name">'+esc(f.name)+'</span>' +
        bar +
        '<span class="ov-stage">'+STAGES[f.stage]+'</span>' +
      '</div>';
    }).join("") + '</div>';
  }

  function renderEvoTab(){
    var rows = [];
    frontsAsArray().forEach(function(f){
      f.items.forEach(function(it){
        if(!it.source) return;
        var ms = metricsState[it.id];
        if(!ms || !ms.metrics.length) return;
        var m = ms.metrics[0];
        var valStr = m.value===null ? "—" : (m.currency||m.isPercent ? formatMetricValue(m,m.value) : fmtNumber(m.value));
        var deltaStr = "";
        if(m.delta!==null && m.delta!==0){
          var cls = m.delta>=0 ? "up" : "down";
          var sign = m.delta>=0 ? "+" : "";
          deltaStr = ' <span class="metric-delta '+cls+'">'+sign+(m.currency||m.isPercent?formatMetricValue(m,m.delta):fmtNumber(m.delta))+'</span>';
        }
        rows.push(
          '<div class="evo-row" data-key="'+esc(f.key)+'">' +
            '<div class="evo-name"><span class="evo-front">'+String(f.num).padStart(2,"0")+' · '+esc(f.name)+'</span><span class="evo-item">'+esc(it.label)+'</span></div>' +
            '<div class="evo-value">'+valStr+deltaStr+'</div>' +
            '<div class="evo-spark">'+sparklineSvg(m.points, { w:120, h:28, color:slotColor(slotFor(it.id)) })+'</div>' +
          '</div>'
        );
      });
    });
    if(!rows.length) return '<div class="empty-items">Nenhuma conta com dado real conectado ainda.</div>';
    return '<div class="evo-list">'+rows.join("")+'</div>';
  }

  function wireOverview(tabKey){
    document.getElementById("closeBtn").addEventListener("click", function(){ go(""); });
    Array.prototype.forEach.call(panel.querySelectorAll(".ov-tab"), function(btn){
      btn.addEventListener("click", function(){ go("#/geral/"+btn.getAttribute("data-tab")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".ov-row"), function(row){
      row.addEventListener("click", function(){ go("#/p/"+row.getAttribute("data-key")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".evo-row"), function(row){
      row.addEventListener("click", function(){ go("#/p/"+row.getAttribute("data-key")); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".fin-del"), function(btn){
      btn.addEventListener("click", function(){
        var id = btn.closest(".fin-row").getAttribute("data-id");
        state.revenue.entries = state.revenue.entries.filter(function(e){ return e.id!==id; });
        persistState();
        openOverview("fin");
      });
    });
    var revAddBtn = document.getElementById("revAddBtn");
    if(revAddBtn){
      revAddBtn.addEventListener("click", function(){
        var frontKey = document.getElementById("revFront").value;
        var month = document.getElementById("revMonth").value;
        var amount = parseFloat(document.getElementById("revAmount").value);
        if(!frontKey || !month || !(amount>=0)) return;
        state.revenue = state.revenue || {entries:[]};
        state.revenue.entries.push({ id:"r"+Date.now()+Math.floor(Math.random()*1000), frontKey:frontKey, month:month, amount:amount });
        persistState();
        openOverview("fin");
      });
    }
    document.getElementById("resetLocalBtn").addEventListener("click", function(){
      if(!window.confirm("Isso vai apagar as edições feitas só neste navegador e voltar para a versão publicada. Continuar?")) return;
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      lastPersistedRaw = null;
      state = JSON.parse(JSON.stringify(SEED_DATA));
      initMetrics();
      renderGrid();
      openOverview(tabKey);
    });
  }

  function openOverview(tabKey){
    tabKey = tabKey || "fronts";
    openModal(renderOverview(tabKey));
    wireOverview(tabKey);
  }

  function frontRevenueEntries(key){
    return ((state.revenue||{}).entries||[]).filter(function(e){ return e.frontKey===key; });
  }
  function frontRevenueTotal(key){
    return frontRevenueEntries(key).reduce(function(sum,e){ return sum+Number(e.amount); }, 0);
  }

  function renderProjectFinance(key){
    var entries = frontRevenueEntries(key).slice().sort(function(a,b){ return b.month.localeCompare(a.month); });
    if(!entries.length){
      return '<div class="empty-items">Nenhum lançamento financeiro para este projeto ainda — adicione na Visão geral › Financeiro.</div>';
    }
    var rows = entries.map(function(e){
      return '<div class="fin-row"><span class="fin-row-front">'+monthLabel(e.month)+'</span><span class="fin-row-month"></span><span class="fin-row-amount">'+fmtCurrency(e.amount)+'</span><span></span></div>';
    }).join("");
    return '<div class="fin-list">'+rows+'</div>';
  }

  function openFront(key){
    var f = state.fronts[key];
    if(!f) return;

    var bc = breadcrumbHtml([{label:"Início"}, {label:f.name}]);

    var itemsCount = f.items.length;
    var activeCount = f.items.filter(function(it){ return it.status==="ativo"; }).length;
    var gp = goalProgress(f);
    var revenueTotal = frontRevenueTotal(key);
    var kpiRow =
      '<div class="kpi-row">' +
        '<div class="kpi-tile"><span class="kpi-label">Itens ativos</span><span class="kpi-value">'+activeCount+'/'+itemsCount+'</span></div>' +
        '<div class="kpi-tile"><span class="kpi-label">Estágio</span><span class="kpi-value">'+STAGES[f.stage]+'</span></div>' +
        '<div class="kpi-tile"><span class="kpi-label">Meta</span><span class="kpi-value">'+(gp?gp.pct+"%":"—")+'</span></div>' +
        '<div class="kpi-tile"><span class="kpi-label">Receita registrada</span><span class="kpi-value">'+fmtCurrency(revenueTotal)+'</span></div>' +
      '</div>';

    var series = seriesWithData(f);
    var chartSection = "";
    if(series.length){                                             // C3: um painel por série (x compartilhado, y próprio), nunca eixo duplo
      var xLo = null, xHi = null;
      series.forEach(function(s){ s.points.forEach(function(p){ if(xLo===null || p.date<xLo) xLo = p.date; if(xHi===null || p.date>xHi) xHi = p.date; }); });
      var spanDays = daysBetween(xLo, xHi)+1;
      var panels = series.map(function(s){
        var sec = s.variant==="secondary", st = staleness(s.points, s.provider);
        return { title:s.item.id+" · "+s.def.label, color:sec ? slotColorLt(s.slot) : slotColor(s.slot), dash:sec, points:s.points, mk:s.item.id+":"+s.field,
                 valueText:fmtNumber(s.latest.v), delta:deltaFromNamed(deltaNamed(s.points, 7), { noPct:true }), foot:"até "+fmtDateDM(s.latest.d), footWarn:!!(st && st.alert),
                 ariaLabel:s.item.label+" · "+s.def.label };
      });
      chartSection = '<div class="project-chart-wrap">'+figure({ id:"fig-evo", title:"Evolução do público", kicker:spanDays+" dias disponíveis", source:fmtDateDM(xLo)+" – "+fmtDateDM(xHi),
        body:smallMultiples(panels, { xDomain:[xLo, xHi], sync:"front-"+key, drawIn:shouldDrawIn() }),
        table:smallMultiplesTable(panels, { caption:"Evolução do público · leituras por data" }) })+'</div>';
    }

    var stagesHtml = STAGES.map(function(s,i){
      return '<button class="stage-btn'+(i===f.stage?" active":"")+'" data-stage="'+i+'"><b>'+(i+1)+'</b>'+s+'</button>';
    }).join("");

    var itemsHtml = f.items.length ? f.items.map(function(it){
      var extra = it.source ? renderMetricsBlock(it.id) : (it.note ? '<div class="metric-note">'+esc(it.note)+'</div>' : "");
      var expandBtn = (it.source && it.source.detailMetrics) ? '<button class="item-expand" data-detail="'+esc(it.id)+'" aria-label="Ver gráfico completo">📈</button>' : "";
      return '<div class="item-block">' +
        '<div class="item-row" data-item="'+esc(it.id)+'">' +
          '<span class="item-label">'+esc(it.id)+' · '+esc(it.label)+'</span>' +
          expandBtn +
          '<button class="status-pill" data-status="'+esc(it.status)+'">'+(STATUS_LABEL[it.status]||esc(it.status))+'</button>' +
          '<button class="item-del" aria-label="Remover">×</button>' +
        '</div>' +
        extra +
      '</div>';
    }).join("") : '<div class="empty-items">Nenhum item ainda — adicione abaixo.</div>';

    var html = bc +
      '<div class="panel-head"><div class="panel-title"><span class="num">'+String(f.num).padStart(2,"0")+'</span>' +
      '<div><div class="panel-name">'+esc(f.name)+'</div><div class="panel-kicker">'+esc(f.category)+'</div></div></div>' +
      '<button class="close-btn" id="closeBtn">×</button></div>' +

      kpiRow +
      chartSection +

      '<div class="section-label">Financeiro do projeto</div>' +
      renderProjectFinance(key) +

      '<div class="section-label">Estágio</div>' +
      '<div class="stages">'+stagesHtml+'</div>' +

      '<div class="section-label">Meta</div>' +
      '<div class="add-row goal-row">' +
        '<input type="text" id="goalText" placeholder="Ex.: chegar a 1.000 seguidores até dez/26" value="'+esc((f.goal&&f.goal.text)||"")+'" />' +
        '<input type="number" id="goalTarget" placeholder="Alvo (nº)" value="'+esc((f.goal&&f.goal.target!=null)?f.goal.target:"")+'" />' +
      '</div>' +
      (function(){
        var gp = goalProgress(f);
        if(!gp) return "";
        return '<div class="goal-progress"><div class="goal-bar"><div class="goal-bar-fill'+(gp.pct>=100?" complete":"")+'" style="width:'+gp.pct+'%"></div></div>' +
          '<span class="goal-pct">'+fmtNumber(gp.value)+' / '+fmtNumber(gp.target)+' · '+gp.pct+'%</span></div>';
      })() +

      '<div class="section-label">Itens</div>' +
      '<div class="items" id="itemsWrap">'+itemsHtml+'</div>' +
      '<div class="add-row"><input type="text" id="newItemInput" placeholder="Novo item…" /><button id="addItemBtn">Adicionar</button></div>' +

      '<div class="section-label">Notas</div>' +
      '<textarea class="notes" id="notesArea" placeholder="Observações, próximos passos…">'+esc(f.notes||"")+'</textarea>' +

      '<div class="updated">Atualizado em '+fmtDate(f.updatedAt)+'</div>';

    openModal(html, "full");
    wireBreadcrumb(panel, [{onClick:function(){ go(""); }}]);
    document.getElementById("closeBtn").addEventListener("click", function(){ go(""); });
    Array.prototype.forEach.call(panel.querySelectorAll(".stage-btn"), function(btn){
      btn.addEventListener("click", function(){
        f.stage = parseInt(btn.getAttribute("data-stage"),10);
        persistFront(key, f);
        openFront(key);
      });
    });

    Array.prototype.forEach.call(panel.querySelectorAll(".item-row"), function(row){
      var id = row.getAttribute("data-item");
      row.querySelector(".status-pill").addEventListener("click", function(){
        var item = f.items.find(function(it){ return it.id===id; });
        var idx = STATUS_ORDER.indexOf(item.status);
        item.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
        persistFront(key, f);
        openFront(key);
      });
      row.querySelector(".item-del").addEventListener("click", function(){
        f.items = f.items.filter(function(it){ return it.id!==id; });
        persistFront(key, f);
        openFront(key);
      });
      var expandBtn = row.querySelector(".item-expand");
      if(expandBtn){
        expandBtn.addEventListener("click", function(e){
          e.stopPropagation();
          go("#/p/"+key+"/i/"+id);
        });
      }
    });

    var addBtn = document.getElementById("addItemBtn");
    var addInput = document.getElementById("newItemInput");
    function doAdd(){
      var val = addInput.value.trim();
      if(!val) return;
      var nextN = f.items.length ? Math.max.apply(null, f.items.map(function(it){
        var parts = it.id.split(".");
        return parseInt(parts[1]||"0",10);
      })) + 1 : 1;
      f.items.push({id:f.num+"."+nextN, label:val, status:"pendente"});
      persistFront(key, f);
      openFront(key);
    }
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } });

    var notesArea = document.getElementById("notesArea");
    notesArea.addEventListener("blur", function(){
      f.notes = notesArea.value;
      persistFront(key, f);
    });

    var goalTextInput = document.getElementById("goalText");
    var goalTargetInput = document.getElementById("goalTarget");
    function saveGoal(){
      var targetVal = goalTargetInput.value.trim();
      f.goal = {
        text: goalTextInput.value.trim(),
        target: targetVal ? parseFloat(targetVal) : null
      };
      persistFront(key, f);
    }
    goalTextInput.addEventListener("blur", saveGoal);
    goalTargetInput.addEventListener("blur", saveGoal);
  }

  function persistState(){
    state.updatedAt = Date.now();
    invalidateInsights();
    renderGrid();
    try{ var raw = JSON.stringify(state); localStorage.setItem(STORAGE_KEY, raw); lastPersistedRaw = raw; }catch(e){ /* private mode / storage full: edits stay in-memory only */ }
  }
  function persistFront(key, f){
    f.updatedAt = Date.now();
    state.fronts[key] = f;
    persistState();
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      lastPersistedRaw = raw || null;
      if(raw) return JSON.parse(raw);
    }catch(e){ /* fall through to seed */ }
    return JSON.parse(JSON.stringify(SEED_DATA));
  }

  function wireTopBar(){
    var pb = document.getElementById("paletteBtn");
    if(pb) pb.addEventListener("click", function(){ if(typeof openPalette==="function") openPalette(); });   // a paleta (§13.4) chega na camada 5
  }

  function boot(){
    state = loadState();
    applyTheme(themeMode);
    wireThemeToggle();
    wireTopBar();
    ensureTip();
    ensureAnnounce();
    loadMetricsData().then(function(){
      lastCheck = Date.now();
      if(!metricsDataLoaded) backoff = 1;
      initMetrics();
      renderGrid();
      renderFreshChips();
      route(false);
      schedule(pollDelay());
    });
  }


  // gancho de desenvolvimento/testes (funções puras expostas; nada da UI depende disto)
  window.__vdp = {
    derive:{ parseSeries:parseSeries, mergeByDate:mergeByDate, subsSeries:subsSeries, stockSeriesFor:stockSeriesFor, latest:latest, deltaNamed:deltaNamed,
             flowWindow:flowWindow, flowSum:flowSum, flowPct:flowPct, weightedAvgDuration:weightedAvgDuration, engagementRate:engagementRate, netSubs:netSubs,
             weekdayStats:weekdayStats, weekBuckets:weekBuckets, shares:shares, staleness:staleness, videoLife:videoLife, shortsVsLong:shortsVsLong,
             frontSeries:frontSeries, seriesWithData:seriesWithData, frontAudience:frontAudience, frontAccounts:frontAccounts, groupAudience:groupAudience,
             groupAccounts:groupAccounts, groupSeries:groupSeries, primaryMetricFor:primaryMetricFor, goalProgress:goalProgress, freshness:freshness,
             liveState:liveState, detailCols:detailCols, maxDate:maxDate, distinctDates:distinctDates, SERIES_SLOT:SERIES_SLOT, slotFor:slotFor,
             slotColor:slotColor, slotColorLt:slotColorLt, seqStep:seqStep, seqColor:seqColor, ordColor:ordColor },
    insights:{ computeInsights:computeInsights, topInsights:topInsights, groupRanking:groupRanking, invalidateInsights:invalidateInsights,
               insightNode:insightNode, insightText:insightText, rules:INSIGHT_RULES, itemContext:itemContext },
    fmt:{ fmtNumber:fmtNumber, fmtCompact:fmtCompact, fmtDec:fmtDec, fmtPct:fmtPct, fmtPctSentence:fmtPctSentence, fmtMinutes:fmtMinutes, fmtSeconds:fmtSeconds,
          fmtCurrency:fmtCurrency, fmtDelta:fmtDelta, fmtDeltaNamed:fmtDeltaNamed, fmtSigned:fmtSigned, deltaGlyph:deltaGlyph, deltaDir:deltaDir, fmtDateDM:fmtDateDM,
          fmtDateRange:fmtDateRange, fmtWeekLabel:fmtWeekLabel, fmtMonth:fmtMonth, weekdayName:weekdayName, capFirst:capFirst, hhmm:hhmm, fmtStamp:fmtStamp,
          todayYmd:todayYmd, addDays:addDays, daysBetween:daysBetween, isoWeekday:isoWeekday, niceTicks:niceTicks, xScaleByDate:xScaleByDate, resample:resample },
    dom:{ h:h, t:t, b:b, vtitle:vtitle, esc:esc, textOf:textOf, frag:frag },
    theme:{ setTheme:setTheme, cycleTheme:cycleTheme, mode:function(){ return themeMode; } },
    charts:{ statTile:statTile, sparkline:sparklineSvg, sparkRows:sparkRows, smallMultiples:smallMultiples, smallMultiplesTable:smallMultiplesTable, dailyChart:dailyChart, heatmap:heatmap,
             weekdayColumns:weekdayColumns, hbars:hbars, ageGenderBars:ageGenderBars, composition100:composition100, composition100Table:composition100Table, videosTable:videosTable,
             videoDaily:videoDaily, monthlyColumns:monthlyColumns, meter:meter, orbit:orbitSvg, wireOrbit:wireOrbit, figure:figure, tableHtml:tableHtml, legend:legendHtml,
             lineChartSvg:lineChartSvg, wire:wireCharts, tipShow:tipShow, tipHide:tipHide, setCaption:setCaption, deltaFromNamed:deltaFromNamed, deltaFromPct:deltaFromPct,
             availPanelWidth:availPanelWidth, models:function(){ return CHARTS; } },
    assignData:assignData, initMetrics:initMetrics, frontsAsArray:frontsAsArray,
    pulse:{ refreshMetrics:refreshMetrics, simulateRefetch:simulateRefetch, renderFreshChips:renderFreshChips, snapshotValues:snapshotValues, flashChanged:flashChanged,
            announce:announce, rerenderInPlace:rerenderInPlace, liveState:currentLiveState, info:function(){ return { backoff:backoff, lastCheck:lastCheck, liveOverride:liveOverride, pendingPanel:pendingPanel, polling:pollTimer!==null, POLL_MS:POLL_MS }; } },
    home:{ renderGrid:renderGrid, fitAllChips:fitAllChips, renderCard:renderCard, view:VIEW, parentHash:parentHash },
    state:function(){ return state; },
    data:function(){ return { SNAPSHOT_ROWS:SNAPSHOT_ROWS, DETAIL_ROWS:DETAIL_ROWS, EXTRA_INFO:EXTRA_INFO, AUDIENCE_INFO:AUDIENCE_INFO, ITEM_VIDEOS:ITEM_VIDEOS, VIDEO_DAILY:VIDEO_DAILY, metricsGeneratedAt:metricsGeneratedAt, metricsDataLoaded:metricsDataLoaded }; }
  };

  boot();
})();
</script>
</body>
</html>
