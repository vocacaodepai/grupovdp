name: Atualizar dados do YouTube

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar dados reais do YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node scripts/refresh-youtube.mjs

      - name: Publicar se algo mudou
        run: |
          git config user.name "vdp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metrics.json
          git diff --cached --quiet || git commit -m "chore: atualizar métricas do YouTube automaticamente"
          git push
